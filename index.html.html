ria idosa (maior taxa de suicídio consumado entre homens), perda recente de vínculo, isolamento social, provável depressão e estigma quanto à busca por ajuda.","Por não verbalizar espontaneamente um plano suicida, o paciente deve ser estratificado como baixo risco e reavaliado apenas em 6 meses.","A principal intervenção deve focar apenas nos determinantes biológicos, prescrevendo antidepressivo sem necessidade de acionar a rede comunitária.","O estigma relatado pelo paciente atua como fator protetor contra o suicídio, pois evita que ele se exponha socialmente."],"c":1,"x":"Homens idosos têm as maiores taxas de suicídio consumado, agravadas por isolamento, luto, depressão e estigma."},{"t":"C","e":"A Secretaria Municipal de Saúde de uma cidade com 180.000 habitantes está reestruturando sua RAPS a partir do perfil epidemiológico local, que demonstrou aumento de crises psiquiátricas noturnas e internações hospitalares evitáveis. Considerando os critérios populacionais e assistenciais da RAPS apresentados na Aula 1, qual equipamento especializado o município já possui porte populacional para implantar visando oferecer acolhimento noturno e funcionamento 24 horas?","a":["Apenas CAPS I e CECO.","CAPS II, com funcionamento estendido até as 22h em dias úteis.","CAPS III (para transtornos mentais graves) e CAPSad III (para álcool e outras drogas), pois ambos são indicados para municípios acima de 150 mil habitantes.","Apenas UBS com horário estendido, pois o CAPS III exige população superior a 300 mil habitantes.","Ambulatório Médico de Especialidades (AMA-E) como única porta de entrada para crises noturnas."],"c":2,"x":"Municípios acima de 150 mil habitantes têm critério populacional para CAPS III e CAPSad III (ambos 24h)."},{"t":"C","e":"Uma mulher de 34 anos, trabalhadora formal, comparece à consulta médica na Atenção Primária queixando-se de insônia, fadiga e falta de ar. Possui diagnóstico prévio de asma e transtorno de ansiedade generalizada, mas abandonou o seguimento em saúde mental. Nos últimos meses, apresentou três faltas ao trabalho e duas exacerbações asmáticas graves. Com base nas evidências sobre as consequências do adoecimento mental apresentadas na Aula 1, assinale a interpretação correta do caso:","a":["O transtorno de ansiedade não interfere na evolução clínica da asma, devendo as duas condições ser tratadas de forma totalmente independente.","No Brasil, os transtornos mentais representam cerca de 1/3 dos casos de Doenças Crônicas Não Transmissíveis (DCNT) e associam-se a maior frequência e gravidade de outras doenças crônicas, além de aumento do absenteísmo laboral.","O absenteísmo observado é um achado isolado, pois os transtornos ansiosos causam incapacidade funcional apenas quando associados à depressão psicótica.","A paciente deve ser afastada definitivamente do trabalho, pois o retorno laboral agrava o ciclo entre pobreza e adoecimento mental em países de alta renda.","O caso demonstra que os transtornos mentais geram alto índice de YLL (mortalidade prematura) pela asma, mas baixo impacto em YLD."],"c":1,"x":"Transtornos mentais respondem por 1/3 das DCNT no Brasil e aumentam a gravidade de outras doenças crônicas e o absenteísmo."}]},{"id":"P2","lbl":"Aula 2","title":"Reforma Psiquiátrica, RAPS, Projeto Terapêutico Singular e Matriciamento","qs":[{"t":"M","e":"Sobre as raízes históricas e conceituais da Reforma Psiquiátrica brasileira e do conceito de desinstitucionalização, assinale a alternativa correta:","a":["A reforma brasileira filiou-se à linha administrativa norte-americana (governo Kennedy), focada apenas na redução de custos hospitalares por meio da desospitalização.","A Reforma Psiquiátrica brasileira inspira-se na experiência italiana de Franco Basaglia (Lei 180/1978), adotando a perspectiva da desinstitucionalização como desconstrução de saberes, práticas e relações de poder.","O Movimento dos Trabalhadores em Saúde Mental (MTSM) surgiu apenas após a promulgação da Lei nº 10.216/2001, como órgão gestor do Ministério da Saúde.","O conceito de \"desassistência\" corresponde à proposta central da Luta Antimanicomial, defendendo o fechamento imediato de leitos sem criação de rede substitutiva.","A intervenção na Casa de Saúde Anchieta, em Santos (1989), foi uma medida administrativa que manteve o modelo manicomial sob gestão privada."],"c":1,"x":"A Reforma Psiquiátrica brasileira filia-se à linha desconstrutiva italiana de Basaglia. (A: rejeitou a linha administrativa dos EUA; C: MTSM nasceu em 1978; D: desassistência é argumento contrário à reforma; E: Anchieta foi fechada e substituída por rede)."},{"t":"M","e":"Em relação aos marcos legais e normativos da saúde mental no Brasil, assinale a alternativa correta:","a":["A Lei nº 10.216/2001 instituiu a arquitetura concreta dos pontos de atenção da Rede de Atenção Psicossocial (RAPS).","A Portaria GM/MS nº 3.088/2011 instituiu a Rede de Atenção Psicossocial (RAPS), criando os pontos de atenção que substituem o hospital psiquiátrico.","O Programa \"De Volta para Casa\" (Lei nº 10.708/2003) destina-se exclusivamente ao financiamento de internações de longa permanência em hospitais psiquiátricos.","O Dia Nacional da Luta Antimanicomial é celebrado em 10 de outubro, data de publicação da Declaração de Caracas.","A Portaria GM/MS nº 336/2002 extinguiu as modalidades de CAPS, unificando-as em um único serviço ambulatorial."],"c":1,"x":"A Portaria nº 3.088/2011 cria a arquitetura concreta da RAPS. (A: Lei 10.216 diz \"o quê\" e \"por quê\"; C: De Volta para Casa é reintegração social; D: 18 de maio; E: Portaria 336 regulamentou as modalidades de CAPS)."},{"t":"M","e":"A Nota Técnica nº 11/2019, publicada pelo Ministério da Saúde, representou um importante ponto de inflexão e disputa política na saúde mental brasileira. Assinale a alternativa que apresenta corretamente um dos retrocessos apontados nessa nota:","a":["Reforçou o caráter estritamente substitutivo dos CAPS e determinou o fechamento acelerado dos hospitais psiquiátricos restantes.","Proibiu o uso da eletroconvulsoterapia (ECT) no SUS e ampliou a integração entre a política de saúde mental e a de álcool e outras drogas.","Reclassificou os serviços da rede, retirando seu estatuto de \"substitutos\", defendeu o aumento de leitos psiquiátricos e autorizou a internação de crianças e adolescentes em enfermarias psiquiátricas comuns.","Foi construída de forma amplamente participativa com o Conselho Nacional de Saúde (CNS), Abrasco e Abrasme.","Acelerou o ritmo de implantação de novos CAPS no país em comparação ao período anterior a 2016."],"c":2,"x":"A NT 11/2019 retirou o caráter substitutivo dos serviços, defendeu aumento de leitos e internação de menores em enfermarias comuns."},{"t":"M","e":"De acordo com a Portaria GM/MS nº 3.088/2011, a Rede de Atenção Psicossocial (RAPS) é estruturada em 7 componentes. Assinale a alternativa que associa corretamente o componente aos seus respectivos pontos de atenção:","a":["Atenção Básica: CAPS I, II, III, AD e i.","Atenção Residencial Transitória: Serviços Residenciais Terapêuticos (SRT) e Programa De Volta para Casa.","Estratégias de Desinstitucionalização: SRT, Programa De Volta para Casa e EAP-Desinst.","Atenção Hospitalar: Unidades de Acolhimento (até 6 meses) e Comunidades Terapêuticas (até 9 meses).","Reabilitação Psicossocial: SAMU, UPA e salas de estabilização."],"c":2,"x":"Estratégias de Desinstitucionalização = SRT, De Volta para Casa e EAP-Desinst."},{"t":"M","e":"Sobre o Projeto Terapêutico Singular (PTS) e o Apoio Matricial (Matriciamento), assinale a alternativa correta:","a":["O PTS sustenta-se sobre um tripé formulado pela PNH: Clínica Ampliada, Equipe de Referência e o próprio PTS.","Na construção do PTS, a etapa de \"Diagnóstico e análise situacional\" é apontada na prática clínica como a mais frágil e negligenciada pelas equipes.","O matriciamento caracteriza-se como um arranjo vertical em que o especialista assume a supervisão administrativa e a condução individual do caso.","O PTS aplica-se exclusivamente a sujeitos individuais atendidos nos CAPS, não sendo indicado para famílias, grupos ou Atenção Primária.","A nomeação do Técnico de Referência ocorre na quarta etapa do PTS, denominada Reavaliação."],"c":0,"x":"O tripé da PNH é Clínica Ampliada, Equipe de Referência e PTS. (B: a mais frágil é a Reavaliação; C: arranjo horizontal; D: aplica-se a famílias, grupos e APS; E: Técnico de Referência é na 3ª etapa)."},{"t":"C","e":"Uma equipe de Estratégia Saúde da Família (ESF) atende um usuário de 42 anos com diagnóstico de esquizofrenia, em acompanhamento estável, que apresenta dificuldades de adesão medicamentosa e conflitos familiares. Durante a reunião de matriciamento com a equipe do CAPS de referência, os profissionais da ESF solicitam que o psiquiatra do CAPS \"assuma o caso definitivamente\" para realizar consultas individuais mensais, desvinculando o paciente da UBS. À luz do conceito de Matriciamento (Campos, 1999), como a equipe de apoio matricial deve conduzir essa situação?","a":["Aceitar a transferência definitiva do caso, pois transtornos mentais graves não devem ser acompanhados na Atenção Primária.","Recusar qualquer discussão do caso, informando que a ESF deve resolver sozinha os conflitos familiares por meio de visita domiciliar.","Construir conjuntamente uma intervenção pedagógico-terapêutica em arranjo horizontal e dialógico, compartilhando o cuidado, ampliando a capacidade terapêutica da ESF e evitando a lógica vertical de mero encaminhamento.","Realizar uma supervisão hierárquica da equipe da ESF, aplicando sanções técnicas caso o médico de família não prescreva o antipsicótico corretamente.","Encaminhar o paciente para internação de curta duração em hospital geral até que os conflitos familiares sejam solucionados."],"c":2,"x":"Matriciamento é arranjo horizontal, dialógico e pedagógico-terapêutico, não mero encaminhamento ou supervisão hierárquica."},{"t":"C","e":"Uma mulher de 29 anos, usuária de crack em situação de vulnerabilidade socioeconômica e gestante de 16 semanas, é acolhida no CAPSad. A equipe interdisciplinar realiza escuta qualificada, mapeia seus riscos e potencialidades e negocia com ela metas de curto, médio e longo prazo, definindo uma enfermeira como Técnica de Referência e articulando ações com a UBS e a assistência social. Após três meses, a equipe percebe que o plano inicial não foi revisitado desde a primeira semana, apesar de a usuária ter mudado de endereço e iniciado o pré-natal. Qual etapa do PTS falhou nesse acompanhamento e qual sua característica?","a":["Etapa 1 (Diagnóstico), pois não foi aplicado um questionário estruturado de dependência química na admissão.","Etapa 2 (Definição de metas), pois as metas devem ser definidas unilateralmente pela equipe médica sem negociação com o usuário.","Etapa 3 (Divisão de responsabilidades), pois o Técnico de Referência só pode ser um médico psiquiatra.","Etapa 4 (Reavaliação), que funciona como um \"inventário\" periódico e dinâmico com participação ativa do usuário, sendo frequentemente a etapa mais frágil na prática.","Etapa 4 (Reavaliação), que ocorre apenas no momento da alta definitiva do serviço."],"c":3,"x":"A Reavaliação (4ª etapa) é o inventário periódico e dinâmico do PTS, frequentemente a mais frágil na prática."},{"t":"C","e":"Um homem de 54 anos, que permaneceu internado por 18 anos em um hospital psiquiátrico tradicional e perdeu todos os vínculos familiares, recebe alta hospitalar após o fechamento da instituição. Ele não possui renda própria nem moradia, mas apresenta autonomia preservada para atividades básicas com suporte comunitário. Quais dispositivos do componente \"Estratégias de Desinstitucionalização\" da RAPS são mais indicados para garantir sua moradia e reintegração social?","a":["Unidade de Acolhimento (UA) por 6 meses e internação em Comunidade Terapêutica por 9 meses.","Serviço Residencial Terapêutico (SRT) e inclusão no Programa \"De Volta para Casa\" (auxílio- reabilitação psicossocial).","Leito de Saúde Mental em Hospital Geral e acompanhamento exclusivo pela EAP-Desinst.","Encaminhamento para UPA 24h e inserção em enfermaria psiquiátrica de longa permanência.","Acolhimento noturno permanente em CAPS III por tempo indeterminado."],"c":1,"x":"SRT (moradia no território) e Programa De Volta para Casa (auxílio financeiro para reintegração) são as estratégias específicas para egressos de longa internação."},{"t":"C","e":"Um indivíduo com transtorno mental grave cometeu um delito durante um surto psicótico e encontra-se internado em um hospital de custódia e tratamento psiquiátrico (manicômio judiciário). A rede municipal de saúde deseja promover sua desinstitucionalização articulada com o Poder Judiciário e a RAPS territorial. Qual dispositivo específico da RAPS, inserido no componente de Estratégias de Desinstitucionalização, tem a atribuição de avaliar e acompanhar medidas terapêuticas aplicáveis à pessoa com transtorno mental em conflito com a lei?","a":["Consultório na Rua (eCR).","Equipe de Avaliação e Acompanhamento de Medidas Terapêuticas Aplicáveis à Pessoa com Transtorno Mental em Conflito com a Lei (EAP-Desinst).","Núcleo Ampliado de Saúde da Família (NASF).","Centro de Convivência e Cultura (CECO).","Serviço de Atendimento Móvel de Urgência (SAMU 192)."],"c":1,"x":"A EAP-Desinst atua especificamente na interface com a justiça para desinstitucionalização de pessoas em conflito com a lei."},{"t":"C","e":"Um adolescente de 15 anos é levado pela mãe à UPA em estado de intensa agitação psicomotora e ideação suicida aguda após conflito familiar. Após estabilização clínica inicial na UPA, o médico plantonista solicita transferência hospitalar. De acordo com os princípios da RAPS (Portaria nº 3.088/2011) e em contraposição aos retrocessos da Nota Técnica nº 11/2019, qual deve ser a lógica do cuidado hospitalar e territorial nesse caso?","a":["Internação de longa duração em enfermaria psiquiátrica comum junto a adultos, para garantir vigilância rigorosa.","Uso da internação hospitalar como primeira resposta padrão para qualquer crise juvenil, dispensando o acionamento do CAPS i.","Internação de curta duração, preferencialmente em leitos de saúde mental em hospital geral (nunca como primeira resposta isolada), articulada com o CAPS i para continuidade do cuidado no território.","Realização imediata de eletroconvulsoterapia (ECT) na UPA como aparato terapêutico de primeira escolha.","Encaminhamento compulsório para Comunidade Terapêutica religiosa por 9 meses."],"c":2,"x":"A Atenção Hospitalar na RAPS prevê internação de curta duração em leitos de hospital geral, nunca como primeira resposta, articulada ao CAPS."}]},{"id":"P3","lbl":"Aula 3","title":"Desinstitucionalização e a Operacionalização na RAPS","qs":[{"t":"M","e":"Sobre os parâmetros populacionais e de cobertura dos pontos de atenção da RAPS apresentados na Aula 3, assinale a alternativa correta:","a":["Unidade de Acolhimento (UA) Adulta possui parâmetro de 100 mil habitantes, enquanto a UA Infanto-Juvenil exige 200 mil habitantes.","Os Leitos de Saúde Mental em Hospital Geral (LHG) seguem o parâmetro de 1 leito para cada 23 mil habitantes na região de saúde.","O NASF 1 oferece apoio matricial a 1 a 2 equipes de Estratégia Saúde da Família (ESF).","O CAPS III e o CAPS-i são indicados para municípios com população entre 20 mil e 70 mil habitantes.","O CAPS-AD é indicado exclusivamente para municípios com mais de 500 mil habitantes."],"c":1,"x":"O parâmetro de LHG é de 1 leito para cada 23 mil habitantes na região de saúde. (A: UA Adulta = 200 mil e Infanto-Juvenil = 100 mil; C: NASF 1 apoia 5 a 9 equipes; D: CAPS III e CAPS-i >200 mil hab. na Aula 3; E: CAPS-AD de 70 mil a 300 mil hab.)."},{"t":"M","e":"De acordo com a Portaria GM/MS nº 5.738/2024 sobre os Centros de Convivência (CECO), assinale a alternativa correta quanto à sua classificação e vedações:","a":["O CECO Básico destina-se a municípios acima de 70 mil habitantes e tem como foco principal consultas médicas individuais.","São vedados no CECO atendimentos médicos individuais ou grupais, atendimentos psicoterapêuticos e atendimentos farmacoterapêuticos, pois trata-se de um espaço social livre e desmedicalizado.","O CECO Ampliado é destinado a municípios com até 15 mil habitantes.","O CECO Intermediário destina-se a municípios acima de 70 mil habitantes.","O CECO substitui o CAPS no manejo de crises psiquiátricas agudas com prescrição medicamentosa."],"c":1,"x":"No CECO são vedadas consultas/atendimentos médicos, psicoterapêuticos e farmacoterapêuticos. (A: Básico até 15 mil hab.; C: Ampliado >70 mil hab.; D: Intermediário de 15.001 a 70 mil hab.)."},{"t":"M","e":"Sobre o acolhimento noturno e integral no CAPS III, conforme abordado na Aula 3, assinale a alternativa correta:","a":["O prazo máximo parametrizado do acolhimento integral no CAPS III é de 30 dias, sem possibilidade de prorrogação.","Durante o acolhimento integral no CAPS III, a avaliação médica ocorre apenas na admissão e na alta.","O prazo máximo parametrizado do acolhimento integral é de 14 dias, exigindo exames e avaliações diárias do médico e da enfermagem, além de revisão diária da prescrição clínica.","Quando um usuário de CAPS II necessita de acolhimento noturno no CAPS III de referência, o CAPS II encerra seu vínculo até a alta definitiva.","Prorrogações excepcionais além do prazo parametrizado dispensam qualquer notificação aos órgãos de gestão da saúde."],"c":2,"x":"Prazo máximo parametrizado de 14 dias, com avaliações diárias médica e de enfermagem e revisão diária da prescrição."},{"t":"M","e":"Sobre as práticas clínico-políticas potentes de participação social e empoderamento na RAPS, assinale a alternativa que define corretamente o Guia GAM (Gestão Autônoma da Medicação):","a":["Protocolo médico rígido que impõe a retirada imediata de todos os psicofármacos nos CAPS.","Ferramenta que estimula postura ativa do usuário na cogestão do seu tratamento, superando o cuidado passivo puramente medicamentoso em direção ao engajamento pelos próprios direitos.","Técnica teatral utilizada exclusivamente para diagnosticar transtornos psicóticos em assembleias.","Formulário administrativo utilizado pela gestão municipal para auditar o estoque de medicamentos das farmácias básicas.","Instrumento jurídico que autoriza a internação involuntária sem necessidade de laudo médico."],"c":1,"x":"O Guia GAM promove a cogestão ativa do tratamento pelo usuário."},{"t":"M","e":"No contexto do impacto das políticas de saúde mental no enfrentamento às violências, o Núcleo de Prevenção à Violência (NPV) atua articulado com a RAPS. Sobre essa atuação, assinale a alternativa correta:","a":["A notificação compulsória no SINAN em casos de violência sexual deve ser realizada em até 30 dias após a confirmação judicial.","A escuta protegida dispensa sigilo técnico quando o usuário é menor de idade.","O CAPS-i atua no acolhimento de crianças e jovens vítimas de violência articulado com Conselhos Tutelares e educação, realizando escuta qualificada sob sigilo técnico e notificação compulsória no SINAN (em até 24h nos casos de violência sexual).","Espaços de diálogo sobre sexualidade, racismo, gênero e LGBTQIA+fobia devem ser evitados nos CAPS para não gerar conflitos políticos.","O NPV atua exclusivamente na repressão policial junto às delegacias especializadas."],"c":2,"x":"O CAPS-i acolhe crianças/jovens vítimas de violência articulado com Conselhos Tutelares/educação, sob sigilo técnico e notificação no SINAN (até 24h para violência sexual)."},{"t":"C","e":"Um município fechou todos os seus 120 leitos de hospital psiquiátrico, porém transferiu os pacientes crônicos para pequenas instituições fechadas na própria comunidade, onde permanecem trancados, sem contato com a vizinhança, com horários rígidos e sem autonomia sobre suas escolhas ou dinheiro. Conceitualmente, qual fenômeno ocorreu nesse município e por que ele contraria a desinstitucionalização?","a":["Ocorreu a desospitalização plena, que atende integralmente aos princípios da Reforma Psiquiátrica.","Ocorreu a transinstitucionalização, que consiste na mera transferência do paciente para outras formas de segregação e exclusão em menor escala na comunidade, sem transformação estrutural, cultural e de devolução da autonomia.","Ocorreu a territorialização viva, pois os pacientes passaram a residir dentro do perímetro urbano do bairro.","Ocorreu a reabilitação psicossocial, visto que a redução de escala institucional já garante cidadania plena.","Ocorreu o empoderamento comunitário, pois a vigilância médica foi descentralizada para o bairro."],"c":1,"x":"Transinstitucionalização é reproduzir a lógica de segregação e perda de autonomia em dispositivos menores na comunidade."},{"t":"C","e":"Durante o atendimento no CAPS II, um usuário de 35 anos com transtorno afetivo bipolar apresenta início de quadro maníaco grave, com agitação psicomotora intensa, recusa oral de medicação e comportamento agressivo contra a equipe e outros usuários. A intervenção verbal não surtiu efeito e há necessidade de contenção mecânica para proteção do paciente e de terceiros. De acordo com as normas de manejo interno de crise no CAPS, qual conduta é obrigatória?","a":["A contenção mecânica pode ser decidida e executada por qualquer trabalhador terceirizado do serviço, dispensando prescrição médica em situações de urgência.","A contenção mecânica exige prescrição médica, supervisão contínua de enfermagem e registro detalhado no prontuário após o episódio.","Todo CAPS deve acionar imediatamente o SAMU antes de qualquer manejo verbal ou medicamentoso interno, pois CAPS II não possui caixa de medicamentos de emergência.","A contenção mecânica deve ser mantida por no mínimo 24 horas no CAPS II como medida educativa.","Apenas o médico psiquiatra da equipe precisa conhecer as técnicas de manejo de crise e suporte básico de vida."],"c":1,"x":"Contenção mecânica exige prescrição médica, supervisão de enfermagem e registro detalhado em prontuário."},{"t":"C","e":"Um usuário em acompanhamento no CAPS III chega ao serviço em estado de intoxicação aguda grave por múltiplas substâncias, apresentando rebaixamento do nível de consciência, sudorese profusa e dor torácica aguda. Frente a esse quadro clínico, qual deve ser a conduta imediata da equipe do CAPS e como se dá a continuidade do cuidado?","a":["Manter o paciente em observação no leito de acolhimento noturno do CAPS III por 14 dias, pois o CAPS III possui suporte 24 horas.","Prestar os primeiros socorros clínicos e acionar imediatamente a RUE/SAMU (dispositivo prioritário para remoção ao PS/UPA), repassando o histórico clínico e mantendo o vínculo/ acompanhamento até a alta qualificada.","Acionar o SAMU e encerrar o prontuário no CAPS, transferindo a responsabilidade definitiva do usuário para o Pronto-Socorro.","Solicitar que a família transporte o paciente de carro próprio até a UBS mais próxima para avaliação ambulatorial.","Realizar contenção física e aguardar o despertar espontâneo do paciente antes de qualquer contato com a RUE."],"c":1,"x":"Urgências clínicas de alta gravidade (dor torácica aguda, rebaixamento de consciência, intoxicação grave) exigem primeiros socorros e acionamento imediato do SAMU/RUE, mantendo o vínculo do CAPS até a alta."},{"t":"C","e":"Um usuário vinculado a um CAPS II necessita de retaguarda noturna devido a um agravamento psicótico sem risco clínico iminente, sendo pactuada sua inserção no CAPS III de referência da região. Durante os 10 dias em que o usuário permanece acolhido no CAPS III, qual deve ser a atuação da equipe de referência do CAPS II de origem?","a":["Suspender suas atividades com o caso, retornando o contato apenas após o 14º dia.","Manter coparticipação ativa: acompanhar a inserção e a alta, entregar pertences, roupas e medicações de uso contínuo/alto custo, e visitar o CAPS III acolhedor ao menos 1 vez por semana para manter o vínculo.","Transferir definitivamente o prontuário e o PTS para o CAPS III, que passará a ser seu serviço de origem.","Delegar exclusivamente à família a entrega de medicações de alto custo e as visitas semanais ao CAPS III.","Solicitar prorrogação automática para 30 dias sem necessidade de comunicar a Supervisão Técnica de Saúde (STS)."],"c":1,"x":"O CAPS II mantém coparticipação ativa, entrega pertences/medicações e visita o CAPS III ao menos 1x por semana."},{"t":"C","e":"Um paciente de 40 anos apresenta quadro de transtorno de personalidade antissocial isolado, sem comorbidades psiquiátricas, e envolve-se em uma briga de trânsito. Um familiar solicita ao médico plantonista a emissão de laudo para \"internação psiquiátrica involuntária\" alegando risco de agressão à ordem pública. Com base nos critérios legais e técnicos apresentados na Aula 3 (formulário de comunicação de internação involuntária), qual a orientação correta?","a":["Proceder à internação involuntária imediatamente, pois o risco de agressão à ordem pública é critério suficiente por si só.","Não realizar internação psiquiátrica involuntária, pois ela exige a presença de transtorno mental — excetuando-se expressamente o transtorno de personalidade antissocial — associado a pelo menos uma condição de risco grave.","Converter a internação em voluntária sem o consentimento do paciente, utilizando transporte privado.","Internar o paciente no CAPS III por 14 dias em regime fechado.","Notificar o Conselho Tutelar e internar o paciente em hospital geral por até 180 dias."],"c":1,"x":"A internação involuntária exige transtorno mental (exceto transtorno de personalidade antissocial) + critério de risco (auto/heteroagressão, incapacidade grave de autocuidados, etc.)."}]},{"id":"P4","lbl":"Aula 4","title":"Política Nacional de Atenção Integral à Saúde da População em Situação de Rua (PNAIS-RUA)","qs":[{"t":"M","e":"De acordo com o Decreto nº 7.053/2009 e a Resolução CNDH nº 40/2020, sobre o conceito e a caracterização da População em Situação de Rua (PSR), assinale a alternativa correta:","a":["Trata-se de um grupo populacional homogêneo, composto exclusivamente por homens adultos em situação de desemprego permanente.","Caracteriza-se por pobreza extrema, vínculos familiares interrompidos ou fragilizados e inexistência de moradia convencional regular, utilizando logradouros públicos ou unidades de acolhimento de forma temporária ou permanente.","Pessoas que pernoitam em abrigos institucionais ou unidades de acolhimento provisório deixam automaticamente de ser consideradas população em situação de rua.","Crianças e adolescentes não são contemplados no conceito de heterogeneidade da população em situação de rua, sendo regidos apenas pela política educacional.","A responsabilidade pela atenção à saúde dessa população é exclusiva das equipes de Consultório na Rua (eCR), desobrigando as demais unidades do SUS."],"c":1,"x":"Definição exata do Decreto nº 7.053/2009, incluindo unidades de acolhimento provisório."},{"t":"M","e":"Sobre a Política Nacional de Atenção Integral à Saúde da População em Situação de Rua (PNAIS-RUA), instituída pela Portaria GM/MS nº 11.692, de 23 de junho de 2026, assinale a alternativa correta:","a":["Estrutura-se em 7 eixos estratégicos, entre os quais a interseccionalidade, a redução de danos, a vigilância popular em saúde e a intersetorialidade.","Estabelece como diretriz a exigência de abstinência prévia para o acesso aos serviços de saúde, visando à patologização das condições de vida na rua.","Veda a participação de pessoas com trajetória de rua nas equipes de saúde ou nas instâncias de controle social.","Restringe o cuidado em saúde à oferta de atendimentos ambulatoriais curativos, excluindo ações de saúde bucal e saúde reprodutiva.","Determina que a rua deve ser encarada apenas como um espaço de passagem ilícita, devendo ser desconsiderada no planejamento territorial."],"c":0,"x":"A Portaria GM/MS nº 11.692/2026 organiza a PNAIS-RUA em 7 eixos estratégicos com foco em equidade, redução de danos e intersetorialidade."},{"t":"M","e":"Acerca da composição e das modalidades das equipes de Consultório na Rua (eCR), conforme os artigos 28 a 32 da Portaria GM/MS nº 11.692/2026, assinale a alternativa correta:","a":["Modalidade I: mínimo de 6 profissionais, sendo obrigatório ao menos 1 médico e 2 enfermeiros.","Modalidade II: mínimo de 4 profissionais, sendo 2 de nível superior e 2 de nível médio, com presença obrigatória de médico.","Modalidade III: possui a mesma composição mínima da Modalidade II (6 profissionais, sendo 3 de nível superior), acrescida obrigatoriamente de 1 médico.","O agente social é considerado equivalente a profissional de nível superior e não pode atuar em ações de redução de danos.","É obrigatória a contratação de no mínimo 4 profissionais da mesma categoria profissional em cada eCR."],"c":2,"x":"Modalidade III = Modalidade II (6 profissionais, sendo 3 de nível superior) + 1 médico. (D: agente social equivale a nível médio; E: máximo 2 da mesma categoria)."},{"t":"M","e":"Sobre o financiamento federal e os parâmetros de implantação das equipes de Consultório na Rua (eCR), assinale a alternativa correta:","a":["O teto de equipes financiadas por município corresponde à população em situação de rua dividida por 1.000, exigindo o mínimo de 200 pessoas cadastradas.","O teto de eCR corresponde à população em situação de rua dividida por 500, sendo necessário comprovar no mínimo 80 pessoas em situação de rua por meio de registros oficiais (como Siaps e CadÚnico).","A perda de profissionais da equipe por mais de 15 dias gera o cancelamento definitivo e irreversível do credenciamento federal.","O financiamento da PNAIS-RUA é de responsabilidade exclusiva da esfera federal, sem pactuação na CIT ou CIB.","O monitoramento e a avaliação dos indicadores de equidade vinculados ao componente de qualidade do cofinanciamento ocorrem a cada 5 anos."],"c":1,"x":"Teto = PSR ÷ 500, com mínimo de 80 pessoas comprovadas via Siaps/ CadÚnico."},{"t":"M","e":"Sobre as regras de funcionamento, vinculação e atuação do Consultório na Rua (eCR) no território, assinale a alternativa incorreta:","a":["O horário de funcionamento das eCR deve se adequar às demandas das pessoas em situação de rua, podendo ocorrer em período diurno e/ou noturno e em qualquer dia da semana.","Cada eCR é considerada equivalente a uma equipe de Saúde da Família para fins de vinculação ao NASF / eMulti.","Em municípios onde não há equipe de Consultório na Rua implantada, o cuidado integral à população em situação de rua segue sendo responsabilidade das equipes de Atenção Básica do território.","O técnico ou auxiliar em saúde bucal da eCR deve ser supervisionado por cirurgião-dentista da própria eCR ou vinculado ao mesmo estabelecimento no SCNES.","As ações da eCR devem ser realizadas exclusivamente dentro de unidades móveis motorizadas, sendo vedado o uso das instalações físicas das UBS locais."],"c":4,"x":"As eCR atuam na rua, em unidade móvel e também nas instalações das UBS do território."},{"t":"C","e":"Um município de 120.000 habitantes realiza o levantamento oficial por meio do CadÚnico e do Siaps e comprova a existência de 160 pessoas em situação de rua no território. O gestor municipal deseja credenciar equipes de Consultório na Rua (eCR) com cofinanciamento federal. Com base nas regras da PNAIS-RUA, quantas eCR esse município poderá pleitear inicialmente e qual a relação com o porte populacional do município?","a":["Nenhuma equipe, pois o mínimo exigido para habilitação é de 500 pessoas em situação de rua.","1 equipe (já que 160 ÷ 500 = 0,32, mas atinge o mínimo de 80 pessoas), podendo pleitear mais equipes futuramente por ter mais de 100 mil habitantes caso comprove oficialmente o aumento dessa população.","2 equipes imediatamente, pois cada equipe cobre obrigatoriamente o teto máximo de 80 pessoas.","3 equipes, pois municípios acima de 100 mil habitantes recebem financiamento automático independente de comprovação em sistemas oficiais.","1 equipe apenas se comprovar que todas as 160 pessoas possuem documento de identidade e comprovante de residência fixo."],"c":1,"x":"Com 160 pessoas (>80), garante 1 eCR; por ter >100 mil habitantes, pode pleitear mais equipes se comprovar aumento populacional."},{"t":"C","e":"Uma mulher trans, negra, em situação de rua há 3 anos e usuária de álcool, procura uma UBS após sofrer agressão física. Na recepção, exige-se comprovante de endereço para abertura de prontuário e questiona-se sua identidade de gênero. À luz das diretrizes e objetivos da PNAIS-RUA (Portaria GM/MS nº 11.692/2026), quais princípios foram violados nesse atendimento?","a":["Apenas o princípio da hierarquização hospitalar, pois vítimas de agressão devem ser atendidas exclusivamente por médicos legistas.","Os princípios da interseccionalidade (reconhecimento de raça, gênero e situação de rua como fatores que agravam a vulnerabilização), do acesso desburocratizado (sem exigência de comprovante de residência) e do acolhimento livre de julgamentos.","O princípio da patologização das condições de vida, que recomenda internar compulsoriamente mulheres em situação de rua vítimas de violência.","O princípio da focalização exclusiva, segundo o qual pessoas trans em situação de rua só podem ser atendidas se estiverem acompanhadas por um representante judicial.","Nenhum princípio foi violado, pois o Cadastro Nacional de Saúde exige obrigatoriamente comprovante de residência fixo para atendimento na APS."],"c":1,"x":"Viola a interseccionalidade, a desburocratização do acesso e o acolhimento livre de julgamentos."},{"t":"C","e":"Uma equipe de Consultório na Rua (Modalidade III) possui em sua composição: 1 enfermeiro, 1 psicólogo, 1 assistente social, 1 médico, 1 técnico de enfermagem e 1 agente social. Durante o ano, o médico solicita exoneração e o município demora 75 dias para contratar um substituto, mantendo a equipe sem médico por esse período. Qual a consequência administrativa e financeira prevista na PNAIS-RUA para essa situação?","a":["Nenhuma alteração ocorre, pois a Modalidade III mantém seu valor de repasse por até 180 dias sem médico.","A perda de profissionais por mais de 60 dias pode gerar a reclassificação temporária da modalidade (neste caso, para Modalidade II), com impacto direto no valor do repasse financeiro federal.","O município deverá devolver todos os recursos recebidos nos últimos 5 anos e encerrar o Consultório na Rua.","O enfermeiro assume legalmente as prescrições médicas e o município recebe um acréscimo financeiro por sobrecarga de trabalho.","A equipe é automaticamente transformada em uma equipe de Estratégia Saúde da Família convencional."],"c":1,"x":"Perda de profissionais por >60 dias pode gerar reclassificação temporária da modalidade e redução do repasse."},{"t":"C","e":"Durante uma abordagem noturna em uma praça central, a equipe de Consultório na Rua encontra um grupo de pessoas fazendo uso de crack. Um dos integrantes da equipe, que possui trajetória prévia de vivência nas ruas, estabelece diálogo próximo com o grupo, distribui insumos de autocuidado e higiene, informa sobre os horários do CAPS-AD e do restaurante popular, sem exigir que interrompam o consumo naquele momento. Qual profissional desempenhou esse papel estratégico e qual diretriz da PNAIS-RUA orientou essa conduta?","a":["Agente Comunitário de Saúde; diretriz de abstinência obrigatória como pré-requisito para vinculação.","Agente Social; diretriz de Redução de Danos (estratégias de cuidado não coercitivas que garantem acesso a direitos e defesa da vida, aproximando a equipe da cultura da rua).","Terapeuta Ocupacional; diretriz de internação asilar preventiva para usuários de substâncias.","Auxiliar em Saúde Bucal; diretriz de vigilância punitiva e encaminhamento policial.","Sanitarista; diretriz de centralização ambulatorial, que orienta aguardar o usuário procurar a UBS em horário comercial."],"c":1,"x":"O Agente Social (preferencialmente com trajetória de rua) atua na aproximação cultural e redução de danos não coercitiva."},{"t":"C","e":"Uma gestante de 24 semanas, em situação de rua, é acompanhada pela eCR em articulação com a UBS do território e o serviço de assistência social (SUAS). Ela expressa o desejo de manter a guarda de seu filho após o nascimento, mas teme que o bebê seja retirado dela na maternidade pelo simples fato de não possuir moradia convencional. De acordo com as ações estratégicas do Eixo I da PNAIS-RUA, como a rede deve atuar?","a":["Comunicar imediatamente ao juizado a retirada compulsória do recém-nascido no momento do parto, devido à ausência de domicílio fixo.","Promover cuidado humanizado no pré-natal, parto e puerpério, assegurando o direito à maternagem, ao vínculo familiar e à saúde sexual e reprodutiva, articulando intersetorialmente saúde e assistência social (moradia/acolhimento).","Orientar a gestante a interromper o pré-natal na UBS e realizar o parto apenas em unidade móvel da eCR.","Condicionar o acompanhamento pré-natal à internação da gestante em comunidade terapêutica até o nascimento da criança.","Restringir o atendimento da gestante apenas a ações de saúde bucal e vacinação, deixando o pré-natal para a rede privada."],"c":1,"x":"O Eixo I assegura cuidado humanizado no pré-natal, parto e puerpério, garantindo o direito à maternagem e ao vínculo familiar."}]},{"id":"P5","lbl":"Aula 5","title":"Políticas sobre Drogas no Brasil: da Repressão à Redução de Danos","qs":[{"t":"M","e":"Sobre a evolução histórica das políticas sobre drogas no Brasil até a década de 1980, assinale a alternativa correta:","a":["Desde a década de 1920, o uso de drogas foi tratado exclusivamente como questão de saúde pública, com amplo financiamento estatal ao SUS.","O Decreto-Lei nº 891/1938 tornou a toxicomania doença de notificação compulsória e previa a internação obrigatória ou facultativa em hospital psiquiátrico, condicionando a alta à comprovação de \"cura\".","A Lei nº 6.368/1976 descriminalizou totalmente o porte e o tráfico de substâncias psicoativas, extinguindo o viés repressivo.","O uso abusivo do álcool sempre recebeu prioridade máxima de saúde pública antes de 1980, apresentando baixas taxas de internação psiquiátrica.","O Código Penal de 1941 introduziu a estratégia de Redução de Danos como alternativa à prisão de usuários."],"c":1,"x":"O Decreto-Lei nº 891/1938 medicalizou e judicializou a toxicomania com internação obrigatória condicionada à \"cura\"."},{"t":"M","e":"Sobre o surgimento da Redução de Danos (RD) no Brasil e a transição conceitual epidemiológica provocada pela epidemia de AIDS, assinale a alternativa correta:","a":["A primeira experiência brasileira de distribuição de seringas aos usuários de drogas injetáveis ocorreu em Santos-SP, em 1989, liderada pelo médico sanitarista David Capistrano.","A epidemia de AIDS consolidou o conceito estigmatizante de \"grupos de risco\" (\"4 Hs\"), abandonando a noção de \"comportamentos de risco\".","O Ministério da Saúde reconheceu oficialmente a Redução de Danos como estratégia de saúde pública apenas em 2019, por meio do Decreto nº 9.761.","A experiência de Santos- SP em 1989 recebeu apoio imediato do Poder Judiciário, sem enfrentar processos criminais ou cíveis.","A Redução de Danos exige a abstinência total como pré-requisito indispensável para que o usuário receba insumos de prevenção."],"c":0,"x":"Santos-SP (1989), sob liderança de David Capistrano, foi o marco inicial da RD no Brasil. (B: migrou de \"grupos\" para \"comportamentos de risco\"; C: MS reconheceu em 1994)."},{"t":"M","e":"Comparando o Decreto nº 9.761/2019 com a Resolução CONAD nº 15/2026, assinale a alternativa correta:","a":["O Decreto nº 9.761/2019 fortaleceu a integração entre a Política sobre Drogas e a Reforma Psiquiátrica, priorizando a Redução de Danos em detrimento da abstinência.","A Resolução CONAD nº 15/2026 estabelece princípios e diretrizes de boas práticas de Redução de Riscos e Danos (RRD), reafirmando que a abstinência não é exigida como pré-requisito para o acesso ao tratamento.","A Resolução CONAD nº 15/2026 proíbe a análise toxicológica de substâncias e a distribuição de insumos de autocuidado por considerá-las apologia ao uso.","Entre 2016 e 2018, houve um aumento exponencial na criação de novos CAPS no Brasil, saltando de 30 para 130 unidades anuais.","A Resolução CONAD nº 15/2026 aplica-se apenas a drogas ilícitas, excluindo o uso prejudicial de álcool e tabaco."],"c":1,"x":"A Resolução CONAD nº 15/2026 reafirma no Art. 1º, §2º que a abstinência não é pré-requisito para o tratamento."},{"t":"M","e":"O Plano Nacional de Políticas sobre Drogas (PLANAD 2026-2030), aprovado por unanimidade pelo CONAD em 27/11/2025, organiza-se em 8 eixos temáticos. Assinale a alternativa que associa corretamente o eixo temático à sua proposta estratégica:","a":["Eixo 1 (Desenvolvimento social): aplica o conceito de Desenvolvimento Alternativo Sustentável (DAS), fomentando inclusão produtiva e renda lícita em territórios afetados pelo tráfico.","Eixo 3 (Redução de danos): extingue a ocupação de Redutor de Danos e restringe o horário dos serviços apenas ao período matutino.","Eixo 4 (Segurança e justiça): determina o encarceramento em massa de usuários portando pequenas quantidades para uso pessoal, revogando a decisão do STF (RE 635659).","Eixo 5 (Acesso ao cuidado): criminaliza as práticas cerimoniais e o uso ritual de espécies vegetais por povos indígenas.","Eixo 7 (Evidências e indicadores): desativa o Observatório Brasileiro de Informações sobre Drogas (Obid) e o Sistema de Alerta Rápido (SAR)."],"c":0,"x":"Eixo 1 aplica o Desenvolvimento Alternativo Sustentável (DAS) para inclusão produtiva lícita."},{"t":"M","e":"De acordo com a Resolução CONAD nº 15/2026 (Art. 2º e Art. 4º), constituem princípios e boas práticas reconhecidas de Redução de Riscos e Danos (RRD), exceto:","a":["Não julgamento, autonomia, universalidade e intersetorialidade.","Baixa exigência, com ações que ampliam o acesso, o acolhimento e o vínculo.","Análise toxicológica para identificação de adulterantes em substâncias ilícitas e ações educativas sobre manejo de urgências.","Geração de renda por meio de qualificação profissional e inclusão produtiva de usuários.","Alta exigência disciplinar, condicionando a permanência no serviço à testagem toxicológica semanal negativa."],"c":4,"x":"A RRD pauta-se pela baixa exigência e pelo não julgamento, nunca por alta exigência punitiva."},{"t":"C","e":"Um homem de 46 anos comparece à UBS relatando consumo diário de destilados há 15 anos. Ele afirma que gostaria de reduzir os danos à sua saúde e melhorar sua relação com os filhos, mas diz explicitamente que \"não consegue nem deseja parar totalmente de beber neste momento\". Qual deve ser a conduta médica na Atenção Primária à luz das diretrizes atuais (Resolução CONAD nº 15/2026 e PLANAD 2026-2030)?","a":["Informar que o SUS só oferece acompanhamento ambulatorial quando o paciente aceita a meta de abstinência total e imediata.","Acolher o paciente sem julgamento, priorizar o vínculo terapêutico, ofertar estratégias de Redução de Danos (como redução gradual, hidratação, alimentação, não dirigir), rastrear comorbidades clínicas/ psiquiátricas e articular a rede (CAPS-AD).","Encaminhar o paciente compulsoriamente para uma Comunidade Terapêutica fechada por 9 meses pelo modelo dos 12 passos.","Prescrever dissulfiram sem informar o paciente, visando provocar aversão física ao álcool.","Dispensar o paciente da UBS e orientá-lo a retornar apenas quando estiver há 30 dias em abstinência."],"c":1,"x":"Abstinência não é pré-requisito; o médico deve acolher, criar vínculo, ofertar RD, rastrear comorbidades e articular a rede."},{"t":"C","e":"Uma equipe de Saúde da Família identifica em sua área de abrangência um jovem de 22 anos com uso problemático de substâncias psicoativas, vivendo em extrema vulnerabilidade e sem qualquer documentação civil (RG, CPF ou Cartão SUS). Aplicando as diretrizes do PLANAD 2026-2030 na prática clínica, como a equipe deve proceder?","a":["Negar o atendimento na UBS e no CAPS-AD até que o jovem regularize sua documentação civil no cartório.","Iniciar o cuidado imediatamente em regime de baixa exigência (Eixo 3) e articular intersetorialmente com o SUAS e os Centros de Acesso a Direitos e Inclusão Social – CAIS (Eixo 5) para garantir acesso à documentação e direitos.","Acionar a autoridade policial para conduzir o jovem à delegacia visando sua identificação civil compulsória.","Restringir o atendimento à entrega de folhetos informativos na porta da unidade, sem abertura de prontuário.","Encaminhar o jovem ao Pronto-Socorro geral para internação social até a emissão de seus documentos."],"c":1,"x":"Nem abstinência nem documentação são pré-requisitos; Eixo 3 garante baixa exigência e Eixo 5 articula o CAIS para acesso a direitos e documentos."},{"t":"C","e":"Um paciente de 28 anos é levado por amigos à UBS apresentando quadro súbito de agitação extrema, hipertermia, taquicardia severa, midríase e confusão mental após ingerir substâncias sintéticas em um evento festivo. Considerando o fluxo assistencial do cuidado em drogas apresentado na Aula 5, qual é a conduta imediata mais adequada?","a":["Agendar consulta de rotina com o psicólogo do CAPS-AD para a semana seguinte.","Realizar apenas psicoeducação inicial sobre Redução de Danos e liberar o paciente para repouso domiciliar.","Reconhecer o quadro de intoxicação aguda grave, prestar suporte clínico imediato e realizar encaminhamento de emergência (RUE/ SAMU), articulando posteriormente o seguimento na RAPS.","Encaminhar o paciente para oficina de geração de renda no Centro de Convivência (CECO).","Aplicar questionário de rastreio do Observatório Brasileiro de Informações sobre Drogas (Obid) antes de qualquer medida clínica."],"c":2,"x":"Intoxicação aguda grave exige encaminhamento imediato para emergência (RUE/SAMU) antes de qualquer abordagem ambulatorial."},{"t":"C","e":"Em uma comunidade indígena, lideranças e profissionais da saúde indígena discutem o manejo de jovens com uso prejudicial de álcool, integrando práticas biomédicas do SUS com rituais tradicionais e medicinas indígenas próprias daquela etnia. Como o PLANAD 2026-2030 (Eixo 5 – Acesso ao Cuidado) respalda essa iniciativa?","a":["Proíbe qualquer associação entre práticas tradicionais indígenas e protocolos clínicos do SUS.","Valoriza a diversidade cultural, espiritual e religiosa nas práticas de cuidado, garante segurança jurídica às práticas cerimoniais e terapêuticas de povos indígenas (Convenção 169 da OIT) e reconhece as medicinas indígenas como patrimônio cultural imaterial brasileiro.","Determina a substituição das práticas cerimoniais indígenas por grupos terapêuticos padronizados de abstinência.","Restringe o uso ritual de espécies vegetais apenas a hospitais universitários credenciados pela Senad.","Exclui os povos indígenas da governança participativa das políticas sobre drogas."],"c":1,"x":"O Eixo 5 garante segurança jurídica às práticas cerimoniais indígenas (Convenção 169 OIT) e reconhece as medicinas indígenas como patrimônio cultural imaterial."},{"t":"C","e":"Um redutor de danos que atua há anos em um projeto comunitário vinculado à RAPS busca formalização profissional e capacitação técnica para atuar junto a equipes multiprofissionais no território e no sistema prisional. De acordo com o Eixo 3 do PLANAD 2026-2030, quais medidas estão previstas para fortalecer essa atuação?","a":["Extinção das equipes de RRD no sistema prisional e proibição de contratação de redutores de danos pelo setor público.","Inclusão da ocupação de \"Redutor de Danos\" na Classificação Brasileira de Ocupações (CBO) com currículo nacional mínimo de formação, além da atuação de equipes de RRD também no sistema prisional.","Exigência de diploma de medicina psiquiátrica para o exercício da função de redutor de danos.","Transferência da gestão das equipes de RRD exclusivamente para órgãos de segurança penitenciária, sem interface com a RAPS.","Substituição de todos os redutores de danos por agentes penitenciários treinados em abstinência."],"c":1,"x":"O Eixo 3 prevê a inclusão de \"Redutor de Danos\" na CBO com currículo mínimo e atuação na RAPS e no sistema prisional."}]},{"id":"P6","lbl":"Aula 6","title":"Política Nacional de Saúde do Trabalhador e da Trabalhadora (PNSTT)","qs":[{"t":"M","e":"Sobre o conceito de Saúde do Trabalhador e a abrangência da Política Nacional de Saúde do Trabalhador e da Trabalhadora (PNSTT – Portaria nº 1.823/2012, consolidada no Anexo XV da Portaria de Consolidação nº 2/2017), assinale a alternativa correta:","a":["Assim como a Previdência Social, a PNSTT restringe seu público-alvo aos trabalhadores urbanos com vínculo empregatício formal e carteira assinada.","A PNSTT reconhece o trabalho como determinante social da saúde e abrange todos os trabalhadores — urbanos e rurais, formais e informais, autônomos, avulsos, domésticos, estagiários, aposentados e desempregados.","O processo saúde-doença-trabalho reduz- se a uma relação monocausal linear entre um agente físico específico e uma doença ocupacional.","A PNSTT é uma política verticalizada e isolada, sem articulação com a Vigilância em Saúde ou com a Atenção Primária.","Os trabalhadores inseridos em atividades informais e precárias são excluídos das ações prioritárias da política por falta de registro no CAGED."],"c":1,"x":"|"},{"t":"M","e":"De acordo com o Art. 7º da PNSTT, embora a política contemple todos os trabalhadores, ela estabelece a priorização de determinados grupos em situação de maior vulnerabilidade. Assinale a alternativa que apresenta corretamente esses grupos prioritários:","a":["Apenas servidores públicos estatutários e trabalhadores da indústria automobilística.","Pessoas inseridas em atividades ou relações informais e precárias de trabalho, atividades de maior risco para a saúde, pessoas submetidas a formas nocivas de discriminação e crianças e adolescentes em situação de trabalho infantil.","Exclusivamente trabalhadores aposentados por tempo de contribuição que residem em capitais.","Trabalhadores autônomos de alta renda e profissionais liberais com plano de saúde suplementar.","Apenas trabalhadores afastados pelo INSS há mais de 5 anos."],"c":1,"x":"|"},{"t":"M","e":"Sobre a Rede Nacional de Atenção Integral à Saúde do Trabalhador (RENAST) e os Centros de Referência em Saúde do Trabalhador (CEREST), assinale a alternativa correta:","a":["Os CEREST funcionam como porta de entrada primária exclusiva do SUS para qualquer queixa clínica de trabalhadores formais, substituindo as UBS.","Os CEREST são serviços especializados que atuam como retaguarda técnica, polo irradiador de vigilância e apoio matricial para a Atenção Primária, serviços especializados e urgência/ emergência, podendo ter abrangência estadual, regional ou municipal.","Existem atualmente apenas 27 CEREST no Brasil (um por estado), não havendo unidades regionais ou municipais habilitadas.","A atuação dos CEREST restringe-se à perícia médica previdenciária para concessão de auxílio-doença do INSS.","Os CEREST não mantêm articulação com as Comissões Intersetoriais de Saúde do Trabalhador e da Trabalhadora (CISTT)."],"c":1,"x":"|"},{"t":"M","e":"A Vigilância em Saúde do Trabalhador (VISAT), componente do Sistema Nacional de Vigilância em Saúde, sustenta-se sobre dois pilares complementares. Quais são eles?","a":["Perícia médica previdenciária e aplicação de multas trabalhistas isoladas.","Vigilância epidemiológica dos agravos relacionados ao trabalho (detecção, notificação e investigação) e vigilância dos ambientes e processos de trabalho (identificação de riscos tecnológicos, sociais e organizacionais).","Atendimento ambulatorial especializado e internação hospitalar de longa permanência.","Fiscalização tributária das empresas e gestão do Fundo de Garantia (FGTS).","Controle exclusivo de doenças infecciosas agudas e campanhas de vacinação infantil."],"c":1,"x":"|"},{"t":"M","e":"Sobre a classificação dos riscos ocupacionais e os agravos de notificação compulsória relacionados ao trabalho apresentados na Aula 6, assinale a associação correta:","a":["Riscos ergonômicos: ruído, calor, vibração e radiação ionizante.","Riscos físicos: postura inadequada, repetitividade e ritmo intenso de trabalho.","PAIR (Perda Auditiva Induzida por Ruído): diminuição gradual e neurossensorial da acuidade auditiva por exposição continuada ao ruído, geralmente bilateral e irreversível.","Pneumoconioses: transtornos mentais decorrentes exclusivamente de assédio moral organizacional.","Riscos psicossociais: exposição a poeiras minerais como sílica e asbesto."],"c":2,"x":"|"},{"t":"C","e":"Uma trabalhadora informal de 38 anos, diarista e catadora de materiais recicláveis, procura a UBS com queixa de dor lombar crônica, parestesia em membros superiores e fadiga intensa há 8 meses. Durante o acolhimento, o recepcionista deixa o campo \"ocupação\" em branco no e-SUS AB por ela não ter carteira assinada. Na consulta médica, qual deve ser a conduta adequada à luz da PNSTT?","a":["Manter o campo \"ocupação\" em branco, pois a PNSTT só reconhece vínculos formais registrados na Previdência Social.","Reconhecer a paciente como trabalhadora (visto que a PNSTT abrange trabalhadores informais e autônomos), registrar sua ocupação no cadastro, realizar a anamnese/história ocupacional detalhada, investigar LER/DORT, notificar o agravo no Sinan e articular apoio matricial com o NASF-AB/CEREST.","Encaminhar a paciente diretamente para a perícia do INSS para emissão de CAT, já que trabalhadores informais têm direito automático ao seguro acidentário.","Tratar apenas com analgésicos sintomáticos sem investigar as condições de trabalho, pois dores musculoesqueléticas são inerentes à idade.","Recusar a notificação no Sinan por não haver confirmação pericial do nexo causal por um médico do trabalho da empresa."],"c":1,"x":"|"},{"t":"C","e":"Um trabalhador da construção civil de 45 anos sofre queda de andaime durante o expediente, apresentando fratura exposta em membro inferior direito, sendo levado pelo SAMU ao Pronto-Socorro hospitalar. Considerando a transversalidade do cuidado ao trabalhador na Rede de Atenção à Saúde (RAS), qual é o papel da equipe de Urgência e Emergência nesse atendimento?","a":["Realizar apenas a estabilização ortopédica e a alta hospitalar, cabendo exclusivamente à UBS identificar se houve acidente de trabalho.","Identificar o evento como acidente de trabalho típico, prestar a assistência clínica imediata, realizar a notificação compulsória no sistema de informação (Sinan) e articular a contrarreferência para reabilitação e acompanhamento na rede.","Aguardar a autorização do empregador antes de registrar o acidente como relacionado ao trabalho no prontuário.","Encaminhar o paciente imediatamente ao CEREST para realização da cirurgia ortopédica de urgência.","Notificar o caso apenas se o trabalhador vier a óbito durante a internação."],"c":1,"x":"|"},{"t":"C","e":"Durante visitas domiciliares e atendimentos na UBS de um bairro rural, a equipe de Saúde da Família observa aumento expressivo de casos de cefaleia, náuseas, tontura e dermatites entre trabalhadores agrícolas que aplicam agrotóxicos sem equipamentos de proteção adequados. Aplicando as diretrizes da Estratégia I e II da PNSTT (integração da VISAT com as demais vigilâncias e a APS), a equipe deve:","a":["Tratar cada caso isoladamente na consulta médica, evitando comunicar a vigilância para não gerar conflitos com os proprietários rurais.","Notificar os casos suspeitos de intoxicação exógena e dermatoses ocupacionais no Sinan, mapear a atividade produtiva no território e acionar a VISAT, a Vigilância Ambiental/Sanitária e o CEREST para investigação e intervenção integrada nos ambientes e processos de trabalho.","Orientar os trabalhadores a procurarem planos de saúde privados, pois intoxicações por agrotóxicos não são acompanhadas pelo SUS.","Aguardar a comprovação laboratorial definitiva de todos os casos antes de realizar qualquer notificação de suspeita no Sinan.","Restringir a ação à distribuição de cremes hidratantes na farmácia da UBS."],"c":1,"x":"|"},{"t":"C","e":"Uma enfermeira de um hospital geral sofre acidente perfurocortante com agulha utilizada em paciente durante procedimento de punção venosa. Além das condutas clínicas imediatas de profilaxia pós-exposição (PEP) e acompanhamento sorológico, esse evento caracteriza-se como um agravo de notificação compulsória no Sinan denominado:","a":["PAIR (Perda Auditiva Induzida por Ruído).","Pneumoconiose ocupacional.","Acidente de trabalho com exposição a material biológico.","Intoxicação exógena por agente químico.","Transtorno mental relacionado ao trabalho."],"c":2,"x":"|"},{"t":"C","e":"Um operador de telemarketing de 27 anos procura a UBS com crises frequentes de ansiedade, insônia, exaustão emocional e medo intenso de demissão devido a metas abusivas, monitoramento constante por segundos e assédio moral por parte da supervisão. Na consulta, o médico aplica as perguntas-chave da História Ocupacional e articula o caso com o psicólogo e o assistente social do NASF-AB/eMulti para construção de um Projeto Terapêutico Singular (PTS). Sobre essa situação, assinale a alternativa correta:","a":["O sofrimento emocional relacionado à organização e gestão do trabalho (como assédio, sobrecarga e metas abusivas) configura risco psicossocial e caracteriza agravo notificável como Transtorno Mental Relacionado ao Trabalho.","Transtornos mentais só podem ser relacionados ao trabalho quando decorrem de exposição a substâncias químicas neurotóxicas, nunca de fatores organizacionais.","O apoio matricial do NASF-AB substitui a equipe de referência da ESF, que deve encerrar o vínculo com o paciente após o encaminhamento.","Como não houve acidente físico visível, não cabe nenhuma ação de vigilância ou orientação sobre direitos trabalhistas.","O paciente deve ser afastado definitivamente do convívio comunitário e internado em hospital psiquiátrico."],"c":0,"x":""}]}],"unit":"aulas"},{"id":"Q","name":"Prova 2","sps":[]}]},{"id":"s8","name":"Prova Integrada 2025.2","themes":[{"id":"I","name":"Prova Integrada","sps":[{"id":"I1","lbl":"Prova","title":"6ª Etapa (gabarito comentado)","qs":[{"t":"P","e":"O choque circulatório ocorre quando faltam oxigênio e nutrientes nas células das partes vitais do corpo, devido a uma deficiência na circulação sanguínea, o que consequentemente aumenta a produção de gás carbônico e lactato no sangue. O choque, portanto, é caracterizado pela diminuição da pressão arterial, o que afeta diretamente órgãos e tecidos do corpo humano. É dividido em quatro tipos: hipovolêmico, cardiogênico, distributivo e obstrutivo. Nesse sentido, é muito importante saber também que o choque deve ser revertido imediatamente, porque, caso isso não ocorra, ele pode até mesmo levar o indivíduo à morte. Sobre alguns dos choques circulatórios, avalie as afirmativas a seguir.\nI. O choque anafilático é um tipo de choque distributivo, caracterizado pela diminuição de retorno venoso, ocasionada por uma reação que ocorre após entrar na circulação um antígeno ao qual o indivíduo é alérgico.\nII. O choque hipovolêmico é causado pela diminuição do retorno venoso, o que está relacionado à perda de grande quantidade de líquidos corporais, como, por exemplo, sangue, plasma ou líquido, por diarreia ou vômito.\nIII. O choque cardiogênico é causado pela evolução de anormalidades cardíacas no indivíduo, as quais afetam o bombeamento de sangue pelo coração de maneira adequada. Ele ocorre, por exemplo, pelo enfraquecimento do músculo cardíaco.\nÉ correto o que se afirma em","a":["I, II e III.","I e III, apenas.","II, apenas.","I, apenas.","II e III, apenas."],"c":0,"x":"As três afirmativas estão corretas. I: o choque anafilático é distributivo — mediadores como a histamina causam vasodilatação e aumento da permeabilidade, com queda da resistência vascular e do retorno venoso efetivo. II: no choque hipovolêmico a perda de volume (hemorragia, plasma, perdas gastrointestinais) reduz o retorno venoso e o débito cardíaco. III: no choque cardiogênico há falha de bomba (infarto, miocardiopatias, arritmias), com débito cardíaco insuficiente apesar de volemia adequada."},{"t":"P","e":"Um homem de 64 anos, hipertenso e diabético, apresenta instalação súbita de fraqueza no hemicorpo direito e afasia motora. A tomografia computadorizada evidencia área hipodensa no território cortical lateral do hemisfério esquerdo, compatível com infarto isquêmico. Considerando o trajeto e os territórios irrigados pelas principais artérias cerebrais, qual vaso é o mais provável responsável pelo quadro clínico descrito?","a":["Artéria cerebral anterior, que se origina da artéria vertebral e percorre o sulco central, irrigando o tálamo e o hipotálamo.","Artéria cerebral anterior, que emerge da artéria basilar e irriga o tronco encefálico e o cerebelo superior.","Artéria cerebral média, que se origina da artéria carótida interna e percorre o sulco lateral, irrigando a maior parte da face lateral dos lobos frontal, parietal e temporal.","Artéria comunicante anterior, que conecta as artérias cerebrais médias e irriga o corpo caloso e a cápsula interna.","Artéria cerebral posterior, que se origina da artéria carótida interna e irriga os lobos frontal e parietal medial."],"c":2,"x":"A artéria cerebral média (ramo da carótida interna, no sulco lateral) irriga a face lateral dos lobos frontal, parietal e temporal, incluindo as áreas motora e sensitiva do rosto e do membro superior e, no hemisfério dominante (esquerdo), a área de Broca. Infarto nesse território explica hemiparesia direita e afasia motora. A cerebral anterior irriga a face medial (perna) e se origina da carótida interna; a cerebral posterior irriga o lobo occipital e a face inferior do temporal; a comunicante anterior liga as duas cerebrais anteriores."},{"t":"P","e":"Um homem de 35 anos procura atendimento por fadiga intensa, palidez e episódios recorrentes de infecção. O hemograma revela anemia normocítica normocrômica, leucopenia e plaquetopenia. O esfregaço sanguíneo periférico mostra ausência de formas imaturas e sem sinais de displasia, enquanto a biópsia de medula óssea evidencia substituição difusa por tecido adiposo, com hipocelularidade acentuada e escassez de precursores hematopoéticos. Considerando o quadro descrito e os achados laboratoriais e histológicos, qual das alternativas representa corretamente o diagnóstico e suas principais características hematológicas e anatômicas?","a":["Síndrome mielodisplásica, com displasia das linhagens hematopoéticas, macro-ovalócitos e aumento de blastos na medula.","Anemia hemolítica autoimune, com aumento de reticulócitos, esferócitos no sangue periférico e hiperplasia eritroide medular.","Anemia falciforme, com presença de hemácias em forma de foice, aumento de reticulócitos e hiperplasia eritroide compensatória.","Anemia megaloblástica, caracterizada por hiperplasia medular, macrocitose e presença de megaloblastos na medula óssea.","Anemia aplástica, caracterizada por pancitopenia periférica, medula óssea hipocelular substituída por gordura e ausência de infiltração neoplásica."],"c":4,"x":"Pancitopenia (anemia, leucopenia e plaquetopenia) com medula hipocelular substituída por gordura, sem displasia, sem blastos e sem infiltração neoplásica caracteriza a anemia aplástica. Na síndrome mielodisplásica há displasia e medula geralmente hipercelular; na hemolítica autoimune e na falciforme há hiperplasia eritroide e reticulocitose; na megaloblástica a medula é hipercelular com macrocitose."},{"t":"P","e":"Um paciente de 9 anos, procedente de região endêmica para hemoglobinopatias, é levado ao pronto atendimento por icterícia, dor intensa em membros inferiores e história de múltiplas internações por crises vaso-oclusivas. O hemograma mostra anemia normocrômica e normocítica com presença de drepanócitos, e o teste do pezinho realizado ao nascimento revelou hemoglobina fetal aumentada. O médico solicita exames laboratoriais específicos para confirmar o diagnóstico e determinar o genótipo da hemoglobina alterada. Com base nesse cenário clínico e nos princípios da patologia clínica, qual exame laboratorial é mais indicado para confirmar o diagnóstico de anemia falciforme e diferenciar heterozigotos de homozigotos?","a":["Hemograma automatizado com RDW elevado, que permite distinguir subtipos de anemia microcítica e hipocrômica.","Teste de Coombs direto, por identificar autoanticorpos ligados à superfície eritrocitária.","Teste de fragilidade osmótica, utilizado para diagnóstico de esferocitose hereditária.","Dosagem sérica de ferritina, útil para avaliar o estoque de ferro e diferenciar anemia por deficiência de ferro.","Cromatografia líquida de alto desempenho (HPLC), por separar e quantificar as frações de hemoglobina com base em suas propriedades físico-químicas."],"c":4,"x":"A HPLC (assim como a eletroforese de hemoglobina) separa e quantifica as frações de hemoglobina. No homozigoto (HbSS) predomina a HbS, sem HbA; no heterozigoto (traço falciforme, HbAS) há HbA em maior proporção que HbS. O RDW mede anisocitose, o Coombs direto investiga hemólise autoimune, a fragilidade osmótica é usada na esferocitose e a ferritina avalia estoques de ferro."},{"t":"P","e":"Uma jovem de 20 anos apresenta episódios recorrentes de convulsões tônico-clônicas desde a infância, após crises febris precoces. O quadro sugere epilepsia de origem temporal e cortical, doença cujas causas ainda não são totalmente compreendidas. Com base na microestrutura do córtex e do hipocampo, assinale a alternativa correta em relação aos mecanismos histopatológicos envolvidos na epilepsia.","a":["Crises febris precoces podem provocar irritação no hipocampo, desencadeando o desenvolvimento da esclerose hipocampal, caracterizada por perda neuronal e gliose em setores de CA, associada a descargas neuronais síncronas anormais favorecendo a formação de focos epileptogênicos.","Crises febris recorrentes podem levar a uma migração anormal de neurônios piramidais do córtex para o giro dentado, provocando aumento da densidade de sinapses inibitórias dessincronização parcial de impulsos, acompanhada de morte neuronal e acúmulo de alfa-sinucleína no interior do corpo neuronal situados no hipocampo.","As crises febris na infância causam hipertrofia de astrócitos e aumento de dendritos nos interneurônios do giro dentado localizados no hipocampo, tais alterações produzem descargas assíncronas e excitotoxicidade neuronal, com o acúmulo de Corpos de Lewy, encontrados nas crises epilépticas recorrentes.","A proliferação de interneurônios no CA3 e córtex com ramificações dendríticas aumentadas leva a crises febris, com propagação de impulsos e geração de descargas irregulares com hiperatividade neuronal, o que causa focos hiperexcitáveis, com aumento da necrose nos neurônios piramidais encontrados no hipotálamo.","Crises febris precoces aumentam a densidade de neurônios piramidais no giro dentado e induzem fibrose nas camadas do córtex, gerando descargas assíncronas e alterações necróticas que favorecem a formação de emaranhados neurofibrilares nos neurônios localizados nos setores do CA no hipocampo."],"c":0,"x":"Crises febris prolongadas na infância se associam à esclerose hipocampal (esclerose mesial temporal): perda neuronal e gliose nos setores CA do hipocampo, com reorganização de circuitos que gera descargas síncronas e focos epileptogênicos. As demais alternativas misturam achados de outras doenças — alfa-sinucleína e corpos de Lewy (doença de Parkinson/demência com corpos de Lewy), emaranhados neurofibrilares (doença de Alzheimer) — e localizações incorretas (hipotálamo)."},{"t":"P","e":"Um paciente masculino, 58 anos, apresenta dor torácica súbita, intensa, em aperto, irradiando para o braço esquerdo, associada a sudorese profusa e náuseas. Ao exame físico, está ansioso, taquicárdico, com pressão arterial 100/70 mmHg e ausculta cardíaca sem alterações significativas. O eletrocardiograma mostra supra de ST em derivações anteriores (V1–V4). Considerando a fisiopatologia da síndrome coronariana aguda com supra de ST (SCASST), assinale a alternativa que melhor descreve o mecanismo primário responsável pelo evento agudo neste paciente.","a":["a erosão superficial da parede arterial induz inflamação local, com formação gradual de trombo progressivo e isquemia subendocárdica intermitente, resultando em alterações dinâmicas do segmento ST.","a formação de trombo intracoronário ocorre após ruptura de uma placa aterosclerótica estável, resultando em obstrução parcial da luz arterial e subsequente necrose subendocárdica.","a ruptura de uma placa aterosclerótica instável leva à exposição de seu núcleo lipídico, ativação plaquetária e trombose aguda, causando oclusão total da artéria coronária e necrose transmural, refletida pelo supra de ST.","a oclusão coronariana é desencadeada por um espasmo prolongado da artéria coronária em território previamente saudável, levando à isquemia transmural e à elevação do segmento ST.","a disfunção endotelial crônica provoca dilatação coronariana inadequada durante esforço físico, provocando isquemia transmural sem formação de trombo, refletida pelo supra de ST."],"c":2,"x":"No infarto com supra de ST, o mecanismo típico é a ruptura (ou erosão) de uma placa instável: expõe o núcleo lipídico e material trombogênico, ativa plaquetas e a cascata de coagulação e forma um trombo oclusivo total, causando isquemia transmural, que se traduz em supradesnivelamento do ST. Obstrução parcial e isquemia subendocárdica correspondem ao infarto sem supra e à angina instável; o vasoespasmo (angina de Prinzmetal) é causa menos comum e não é o mecanismo primário habitual."},{"t":"P","e":"São critérios para diagnóstico de demência:","a":["afasia, delirium, agnosia e dissociação albumino-citológica no liquor.","afasia, agnosia, comprometimento de memória e dificuldade na execução de tarefas.","depressão, agnosia, comprometimento de memória e convulsão.","depressão, delirium, convulsão e dificuldade na execução de tarefas.","afasia, depressão, dissociação albumino-citológica no liquor e convulsão."],"c":1,"x":"O diagnóstico sindrômico de demência exige declínio cognitivo (tipicamente de memória) associado a déficit em ao menos outro domínio — linguagem (afasia), gnosias (agnosia), praxias ou funções executivas — com prejuízo funcional (dificuldade nas atividades e tarefas). Delirium é um quadro agudo diferencial, a dissociação albumino-citológica é típica da síndrome de Guillain-Barré, e depressão e convulsão não são critérios diagnósticos."},{"t":"P","e":"Demência pode ser definida como síndrome caracterizada por declínio de memória associado a déficit de pelo menos uma outra função cognitiva (linguagem, gnosias, praxias ou funções executivas) com intensidade suficiente para interferir no desempenho social ou profissional do indivíduo. O diagnóstico de demência exige, portanto, a ocorrência de comprometimento da memória, embora essa função possa estar relativamente preservada nas fases iniciais de algumas formas de demência, como a Demência Frontotemporal. O diagnóstico sindrômico de demência depende de avaliação objetiva do funcionamento cognitivo e do desempenho em atividades de vida diária. A avaliação cognitiva pode ser iniciada com testes de rastreio, como o mini exame do estado mental, e deve ser complementada por testes que avaliam diferentes componentes do funcionamento cognitivo. CARAMELLI, Paulo; BARBOSA, Maira T. Como diagnosticar as quatro causas mais frequentes de demência? Revista Brasileira de Psiquiatria, São Paulo, v. 24 (Supl. I), abr. 2002. Disponível em: http://www.scielo.br/pdf/rbp/v24s1/8850.pdf. Acesso em: 30 set. 2019 (adaptado).\nConsiderando o tema, julgue as afirmativas a seguir sobre o diagnóstico das demências.\nI. A doença de Alzheimer caracteriza-se por alucinações visuais, parkinsonismo, vigília flutuante e distúrbio comportamental do sono R.\nII. A doença de Creutzfeldt-Jakob caracteriza-se por demência rapidamente progressiva, mioclonia, prejuízo da memória e acometimento do sistema nervoso central.\nIII. A doença dos corpúsculos de Lewy caracteriza-se pela apatia, desinibição, euforia e memória preservada com deficiência no planejamento, discernimento ou linguagem.\nÉ correto o que se afirma em","a":["III, apenas.","I e II, apenas.","I, apenas.","(texto não visível na foto original)","(texto não visível na foto original)"],"c":1,"x":"I está errada: alucinações visuais, parkinsonismo, flutuação e distúrbio do sono REM caracterizam a demência com corpos de Lewy, enquanto o Alzheimer cursa com déficit de memória episódica de início insidioso. II está correta: a doença de Creutzfeldt-Jakob é uma demência rapidamente progressiva com mioclonias e comprometimento do SNC. III está errada: apatia, desinibição, euforia e memória preservada no início descrevem a demência frontotemporal (como o próprio texto lembra), não a doença dos corpúsculos de Lewy."},{"t":"P","e":"Diversas classes de fármacos são utilizadas no manejo da hipertensão arterial e da insuficiência cardíaca. Considerando os IECA's, os antagonistas dos receptores AT1 e os betabloqueadores, assinale a alternativa CORRETA:","a":["Os betabloqueadores estimulam os receptores β1 cardíacos, elevando a frequência e a contratilidade miocárdica, o que melhora a performance ventricular em pacientes com insuficiência cardíaca aguda.","Os IECA's aumentam a formação de angiotensina II e estimulam a liberação de aldosterona, o que promove vasoconstrição e retenção de sódio, sendo úteis apenas em pacientes com hipotensão refratária.","O uso conjunto de IECA's e antagonistas AT1 é recomendado para potencializar a vasodilatação, sem risco de hipercalemia ou disfunção renal, desde que o paciente esteja em uso de diuréticos poupadores de potássio.","Os IECA's inibem a conversão da angiotensina I em angiotensina II, reduzindo a secreção de aldosterona; os antagonistas AT1 bloqueiam a ação da angiotensina II nos receptores AT1, promovendo vasodilatação.","Os antagonistas dos receptores AT1 bloqueiam a ação da angiotensina II sobre os receptores AT2, provocando vasoconstrição e aumento da resistência vascular periférica, sendo indicados em casos de choque hipovolêmico."],"c":3,"x":"Os IECA inibem a enzima conversora, reduzindo a formação de angiotensina II (e, portanto, de aldosterona); os BRA bloqueiam o receptor AT1 e causam vasodilatação. A: betabloqueadores bloqueiam (não estimulam) receptores β1, reduzindo frequência e contratilidade, e não são usados para melhorar a performance na IC aguda descompensada. B: IECA reduzem a angiotensina II e são pilares no tratamento da hipertensão e da IC. C: a associação de IECA e BRA, sobretudo com poupadores de potássio, aumenta o risco de hipercalemia e lesão renal. E: BRA bloqueiam AT1 (vasodilatação) e não têm indicação no choque hipovolêmico."},{"t":"P","e":"[início do enunciado cortado na foto original] ...extenso) e angioplastia primária na artéria descendente anterior há 8 semanas. Passou a fazer uso de AAS, clopidogrel, atenolol, sinvastatina e enalapril. Esse paciente deu entrada no pronto-socorro com queixas de mal-estar inespecífico, dor torácica ventilatório-dependente, em pontada, de moderada intensidade, mais claramente observada em retroesternal e epigástrio, além de dispneia aos grandes esforços e episódios de febre (T = 39,5°C) surgidos na última semana. O exame físico revelou que o paciente está em estado geral regular, eupneico, corado e orientado. O exame cardiovascular revelava ritmo regular, em 2 tempos, sem sopros. Não havia distensão venosa jugular a 45°C e pulso paradoxal. A ausculta pulmonar estava normal. Não havia edema de membros inferiores. Os exames de urgência revelavam: leucócitos = 14 500 (segmentados 74%, eosinófilos 1%, linfócitos 15%); hemoglobina = 14,2; hematócrito = 42%, plaquetas = 251 000; VHS/VSG = 54 mm na 1ª hora; glicemia = 84 mg/dL (VR 80 -100), ureia = 31 mg/dL (VR = 20 - 35); creatinina = 1,0 mg/dL (0,8 -1,4 mg/dL), CK-MB = 31 (VR < 25 ng/mL), troponina T = 0,25 (VR < 0,2 mg/L). O ECG na admissão é apresentado abaixo.\nA conduta diagnóstica para o caso descrito é solicitar","a":["cineangiocoronariografia cardíaca.","ecocardiograma transtorácico.","cintilografia do miocárdio.","endoscopia digestiva alta.","angiotomografia de tórax."],"c":1,"x":"Paciente com infarto extenso de parede anterior tratado há 8 semanas, agora com febre, dor torácica ventilatório-dependente, leucocitose, VHS elevado e discreta elevação de marcadores de necrose: o quadro é de pericardite pós-infarto (síndrome de Dressler). O exame inicial para confirmar o acometimento pericárdico (derrame), avaliar repercussão hemodinâmica e a função ventricular é o ecocardiograma transtorácico. Não há dor anginosa típica que justifique nova cineangiocoronariografia; cintilografia, endoscopia e angiotomografia de tórax não são indicadas como conduta diagnóstica inicial."},{"t":"P","e":"A cardiopatia isquêmica é a forma mais frequente de cardiopatia secundária no idoso, devido à disfunção miocárdica de causa isquêmica (espástica ou obstrutiva) por acometimento da circulação coronariana, acarretando disfunção com ou sem sintomas. Quanto à fisiopatologia da cardiopatia isquêmica, marque a alternativa correta.","a":["O aumento da pressão diastólica final do ventrículo esquerdo facilita a perfusão subendocárdica, bem como a diminuição da frequência cardíaca, reduz o tempo de enchimento coronário, podendo desencadear ciclo vicioso que resultará na cardiopatia isquêmica.","A redução do fluxo coronariano pode diminuir a perfusão miocárdica, ficando esta em níveis inferiores aos necessários, com reserva de fluxo inadequada, o que leva à hipoperfusão e à hipóxia, com consequente alteração bioquímica, elétrica e mecânica do miócito.","Resulta de lesão local e não progressiva devido a processo isquêmico degenerativo crônico com substituição das miofibrilas por tecido fibroso, apresentando como achado típico a presença de fibrose reparativa à análise histológica, com uma ilha de tecido fibrótico.","No início da cardiopatia isquêmica, surge assincronismo regional na zona isquêmica, que irá ocasionar alteração no relaxamento ventricular, manifestando disfunção sistólica, ainda com função diastólica normal.","No processo de remodelamento que se segue à agressão miocárdica, ocorre aumento do depósito fibroso (colágeno) nas áreas não necrosadas, provocando maior flexibilidade do miocárdio, que, por sua vez, causará disfunção diastólica e posteriormente disfunção sistólica."],"c":1,"x":"A cardiopatia isquêmica resulta do desequilíbrio entre oferta e demanda de oxigênio: a redução do fluxo coronariano, com reserva inadequada, leva à hipoperfusão e à hipóxia, com alterações bioquímicas, elétricas e mecânicas do miócito. A: o aumento da pressão diastólica final do VE dificulta (não facilita) a perfusão subendocárdica, e a redução da frequência cardíaca aumenta o tempo de enchimento coronário. C: a lesão isquêmica é progressiva. D: a alteração do relaxamento (disfunção diastólica) precede a disfunção sistólica. E: a fibrose aumenta a rigidez, não a flexibilidade, do miocárdio."},{"t":"P","e":"Qual das opções abaixo representa corretamente a definição de Estado de Mal Epiléptico (EME)?","a":["Falha nos mecanismos de término das crises ou início anormal de crises, levando a episódios prolongados com risco de dano neurológico.","Presença de crises psicogênicas recorrentes e sem atividade elétrica cerebral.","Episódios de convulsão febril em crianças com duração inferior a 5 minutos.","Qualquer crise epiléptica que ocorre em um paciente com histórico de epilepsia.","Episódio de convulsão controlado espontaneamente após 2 minutos."],"c":0,"x":"Pela definição atual (ILAE), o estado de mal epiléptico resulta da falha dos mecanismos de término da cris
