tica, com formação de trombo e redução ou interrupção do fluxo coronariano.","Acúmulo de líquido no espaço pericárdico, comprimindo o coração.","Entrada de ar no espaço pleural, provocando colapso pulmonar.","Ruptura da camada média da aorta, formando uma falsa luz."],"c":1,"x":"A ruptura ou erosão da placa aterosclerótica pode desencadear trombose coronariana."},{"t":"C","e":"Paciente apresenta dor torácica súbita e intensa, descrita como rasgando, irradiada para região interescapular. Ao exame, apresenta assimetria dos pulsos periféricos. Qual diagnóstico deve ser prioritariamente investigado?","a":["Síndrome coronariana aguda.","Tamponamento cardíaco.","Dissecção aguda de aorta.","Pneumotórax espontâneo.","Síndrome de Takotsubo."],"c":2,"x":"Dor súbita, intensa, irradiada para o dorso e assimetria de pulsos sugerem dissecção."},{"t":"M","e":"Sobre a fisiopatologia da dissecção aguda de aorta, assinale a alternativa correta.","a":["Ocorre pela obstrução de uma artéria coronária por um trombo.","Ocorre pelo acúmulo de líquido entre as camadas do pericárdio.","É provocada pela entrada de ar na cavidade pleural.","Começa geralmente com uma ruptura da camada íntima, permitindo a passagem de sangue para a camada média e formando uma falsa luz.","É causada exclusivamente por processos infecciosos da parede aórtica."],"c":3,"x":"A ruptura da íntima permite a passagem de sangue para a camada média, formando falsa luz."},{"t":"M","e":"Na classificação de Stanford da dissecção de aorta, qual é a característica do tipo A?","a":["Acometimento exclusivo da aorta abdominal.","Acometimento da aorta ascendente.","Acometimento exclusivo da aorta descendente, sem envolvimento da ascendente.","Acometimento exclusivo das artérias ilíacas.","Acometimento isolado do arco aórtico, sem envolvimento da aorta ascendente."],"c":1,"x":"Stanford A envolve a aorta ascendente."},{"t":"C","e":"Homem de 65 anos, hipertenso, apresenta dor torácica súbita, intensa e irradiada para o dorso. Está hemodinamicamente estável e apresenta função renal preservada. Qual é o exame de imagem preferencial para confirmação diagnóstica?","a":["Radiografia simples de tórax.","Eletrocardiograma de 12 derivações.","Ecocardiograma transtorácico isoladamente.","Angiorressonância obrigatoriamente como primeiro exame.","Angiotomografia computadorizada da aorta com contraste intravenoso."],"c":4,"x":"A angiotomografia com contraste é o exame preferencial no paciente estável."},{"t":"M","e":"Qual é o principal objetivo do tratamento anti-impulso na dissecção aguda de aorta?","a":["Aumentar a frequência cardíaca para melhorar o débito cardíaco.","Promover aumento da pressão arterial sistólica.","Reduzir a frequência cardíaca, a pressão arterial e o estresse sobre a parede aórtica.","Aumentar a contratilidade ventricular por meio de inotrópicos.","Promover vasodilatação isolada, independentemente da frequência cardíaca."],"c":2,"x":"O tratamento anti-impulso reduz a frequência cardíaca, a pressão e o estresse aórtico."},{"t":"C","e":"Paciente com suspeita de dissecção aguda de aorta apresenta pressão arterial elevada e frequência cardíaca de 120 bpm. Qual é a conduta farmacológica inicial mais adequada descrita no material?","a":["Administrar nitroprussiato isoladamente.","Iniciar betabloqueador intravenoso, como esmolol ou labetalol, com titulação cuidadosa.","Administrar AAS e heparina imediatamente.","Administrar trombolítico para prevenir trombose coronariana.","Iniciar vasodilatador antes do controle da frequência cardíaca."],"c":1,"x":"O betabloqueador deve ser iniciado antes de associar vasodilatador, se necessário."},{"t":"M","e":"Qual é a principal característica fisiopatológica do pneumotórax hipertensivo?","a":["Acúmulo de sangue no espaço pleural por ruptura vascular.","Acúmulo de líquido no espaço pericárdico.","Formação de trombos nas artérias pulmonares.","Entrada de ar no espaço pleural com aprisionamento progressivo, aumentando a pressão intratorácica.","Ruptura da c ntricular, alterações segmentares, derrame pericárdico e sobrecarga do ventrículo direito.","A radiografia de tórax confirma isoladamente a síndrome coronariana aguda.","A troponina normal exclui todas as causas cardiovasculares graves.","A angiotomografia é utilizada exclusivamente para diagnóstico de pneumotórax.","O eletrocardiograma substitui todos os exames de imagem."],"c":0,"x":"O ecocardiograma avalia função ventricular e complicações cardíacas importantes."}]},{"id":"C2","title":"Infarto agudo do miocárdio (IAM)","qs":[{"t":"M","e":"Segundo a Quarta Definição Universal do Infarto do Miocárdio, qual é o critério laboratorial fundamental para o diagnóstico de lesão miocárdica aguda?","a":["Elevação isolada de CK total.","Elevação isolada de mioglobina.","Elevação e/ou queda dos níveis de troponina cardíaca, com pelo menos um valor acima do percentil 99 do limite superior de referência.","Redução dos níveis de troponina cardíaca.","Elevação isolada de BNP."],"c":2,"x":"A lesão aguda apresenta elevação e/ou queda da troponina, com pelo menos um valor acima do percentil 99."},{"t":"M","e":"Qual é o mecanismo fisiopatológico mais frequentemente relacionado ao IAM tipo 1?","a":["Desequilíbrio entre oferta e demanda de oxigênio sem trombose coronariana aguda.","Ruptura ou erosão de placa aterosclerótica, com formação de trombo coronariano.","Hipotensão arterial isolada.","Taquicardia persistente sem doença coronariana.","Anemia sem comprometimento da circulação coronariana."],"c":1,"x":"IAM tipo 1 está relacionado à ruptura ou erosão da placa e trombose coronariana."},{"t":"C","e":"Paciente com sepse grave apresenta taquicardia importante, anemia e hipotensão. Evolui com elevação da troponina e evidências clínicas de isquemia miocárdica, sem evidências de ruptura de placa ou trombose coronariana aguda. Qual tipo de IAM deve ser considerado?","a":["IAM tipo 1.","IAM tipo 3.","IAM tipo 4.","IAM tipo 2.","IAM tipo 5."],"c":3,"x":"IAM tipo 2 ocorre pelo desequilíbrio entre oferta e demanda de oxigênio."},{"t":"M","e":"Como ocorre a progressão da necrose miocárdica durante uma obstrução coronariana persistente?","a":["Começa na região subendocárdica e pode progredir em direção ao epicárdio, caracterizando o fenômeno de onda de necrose.","Começa no epicárdio e progride exclusivamente para o pericárdio.","Acomete inicialmente o endocárdio e não progride.","Começa no septo interventricular e sempre se restringe a essa região.","Acomete inicialmente o átrio direito e depois o ventrículo esquerdo."],"c":0,"x":"A necrose começa no subendocárdio e progride em direção ao epicárdio."},{"t":"M","e":"A dor torácica típica ou anginosa caracteriza-se principalmente por:","a":["Dor exclusivamente ventilatório-dependente, sem relação com esforço.","Dor localizada apenas na região abdominal inferior.","Dor superficial, reproduzida exclusivamente pela palpação.","Dor acompanhada obrigatoriamente de febre.","Dor retroesternal em aperto ou pressão, podendo apresentar irradiação e relação com esforço ou estresse."],"c":4,"x":"Dor típica é geralmente retroesternal, em aperto ou pressão."},{"t":"C","e":"Homem de 67 anos apresenta IAM e, durante a avaliação, apresenta estertores pulmonares e sinais de congestão pulmonar, sem choque cardiogênico. Qual classificação de Killip corresponde ao quadro de insuficiência cardíaca com congestão pulmonar?","a":["Killip I.","Killip II.","Killip III.","Killip IV.","Killip 0."],"c":1,"x":"Killip II corresponde à presença de sinais de insuficiência cardíaca, incluindo congestão pulmonar."},{"t":"M","e":"Qual é a principal utilidade da classificação de Killip no IAM?","a":["Determinar a artéria coronária responsável pelo infarto.","Diferenciar IAM tipo 1 de IAM tipo 2.","Avaliar a gravidade clínica, a presença de insuficiência cardíaca e o prognóstico hospitalar.","Determinar exclusivamente a necessidade de trombólise.","Identificar a presença de trombose venosa profunda."],"c":2,"x":"Killip avalia gravidade clínica e prognóstico hospitalar."},{"t":"M","e":"Qual associação entre parede miocárdica e derivações eletrocardiográficas está correta?","a":["Parede inferior – V1 e V2.","Parede lateral – V1 e V2.","Parede anterior – DII, DIII e aVF.","Parede inferior – DII, DIII e aVF.","Parede septal – DI e aVL."],"c":3,"x":"DII, DIII e aVF correspondem à parede inferior."},{"t":"M","e":"Qual é a sequência clássica de alterações eletrocardiográficas durante a evolução do IAM com supradesnivelamento do segmento ST?","a":["Ondas T hiperagudas, elevação do ST, evolução com possíveis ondas Q patológicas e alterações posteriores de repolarização.","Ondas Q, seguida de normalização imediata do ST e desaparecimento da onda T.","Inversão da onda P, elevação do PR e redução do QRS.","Redução progressiva da onda R, sem alterações do segmento ST.","Onda T negativa, seguida de desaparecimento do complexo QRS."],"c":0,"x":"A sequência clássica envolve T hiperaguda, elevação de ST e possíveis ondas Q patológicas."},{"t":"C","e":"Paciente apresenta IAM inferior associado a hipotensão arterial, turgência jugular e ausência de congestão pulmonar. Qual complicação deve ser suspeitada?","a":["Ruptura do septo interventricular.","Ruptura de músculo papilar.","Tamponamento cardíaco.","Edema agudo de pulmão por insuficiência ventricular esquerda.","Infarto do ventrículo direito."],"c":4,"x":"IAM inferior com hipotensão, turgência jugular e pulmões sem congestão sugere infarto do VD."},{"t":"M","e":"Qual complicação mecânica do IAM costuma ocorrer entre o segundo e o sétimo dia e pode provocar insuficiência mitral aguda, edema pulmonar e choque cardiogênico?","a":["Ruptura da parede livre do ventrículo esquerdo.","Ruptura do músculo papilar.","Aneurisma ventricular crônico.","Infarto do ventrículo direito.","Pericardite crônica."],"c":1,"x":"A ruptura do músculo papilar provoca insuficiência mitral aguda."},{"t":"C","e":"Homem de 60 anos apresenta dor torácica em repouso, com elevação e queda de troponina compatíveis com necrose miocárdica aguda. O ECG não apresenta supradesnivelamento persistente do segmento ST. Qual é o diagnóstico mais provável?","a":["Angina estável.","Angina instável.","IAM sem supradesnivelamento do segmento ST.","Pericardite aguda.","Síndrome de Takotsubo obrigatoriamente."],"c":2,"x":"Elevação e queda da troponina com ausência de supra persistente sugerem IAMSSST."},{"t":"M","e":"Qual é o tempo recomendado para realização do ECG de 12 derivações na abordagem inicial de pacientes com suspeita de síndrome coronariana aguda?","a":["Até 10 minutos.","Até 30 minutos.","Até 60 minutos.","Após o resultado da troponina.","Somente após a avaliação do cardiologista."],"c":0,"x":"O ECG de 12 derivações deve ser realizado em até 10 minutos."},{"t":"C","e":"Homem de 55 anos apresenta IAM com supradesnivelamento do segmento ST. Está em um hospital com serviço de hemodinâmica disponível e possibilidade de realização de angioplastia em tempo adequado. Qual é a estratégia de reperfusão preferencial?","a":["Apenas tratamento clínico, independentemente do quadro.","Trombólise obrigatória em todos os pacientes.","Anticoagulação isolada.","Angioplastia coronariana primária.","Cirurgia de revascularização obrigatória como primeira escolha."],"c":3,"x":"A angioplastia primária é a estratégia preferencial quando disponível em tempo adequado."},{"t":"M","e":"Sobre o tratamento do IAM sem supradesnivelamento do segmento ST, assinale a alternativa correta.","a":["A trombólise é obrigatória em todos os pacientes.","Não há indicação de antiagregação plaquetária.","O tratamento deve ser exclusivamente cirúrgico.","A reperfusão por fibrinolítico é a primeira escolha.","Não está indicada trombólise; o tratamento envolve antiagregação, anticoagulação, controle da isquemia, estatina de alta intensidade e estratificação de risco."],"c":4,"x":"IAMSSST não tem indicação de trombólise. O tratamento envolve antiagregação, anticoagulação e estratificação de risco."}]},{"id":"C3","title":"TVP e TEP","qs":[{"t":"M","e":"Qual é a principal diferença entre trombo e êmbolo?","a":["O trombo é sempre formado nos pulmões, enquanto o êmbolo é formado exclusivamente no coração.","O trombo é uma massa formada dentro de um vaso ou do coração, enquanto o êmbolo é um material que se desloca pela circulação e pode obstruir um vaso distante.","O trombo é composto exclusivamente por plaquetas, enquanto o êmbolo é composto exclusivamente por hemácias.","O trombo sempre provoca obstrução arterial, enquanto o êmbolo provoca apenas obstrução venosa.","Não existe diferença entre os dois termos."],"c":1,"x":"Trombo é formado no local; êmbolo desloca-se pela circulação."},{"t":"M","e":"A formação de trombos na TVP é explicada principalmente pela Tríade de Virchow. Quais são seus componentes?","a":["Hipertensão, diabetes e obesidade.","Vasoconstrição, anemia e hipoxemia.","Estase sanguínea, lesão endotelial e hipercoagulabilidade.","Infecção, inflamação e vasodilatação.","Hipotensão, taquicardia e hipovolemia."],"c":2,"x":"Tríade de Virchow: estase, lesão endotelial e hipercoagulabilidade."},{"t":"C","e":"Paciente permanece acamado por vários dias após uma cirurgia ortopédica e evolui com edema unilateral e dor na panturrilha. Qual mecanismo da Tríade de Virchow está especialmente relacionado à imobilização?","a":["Estase sanguínea.","Lesão endotelial exclusivamente.","Vasodilatação arterial.","Redução da viscosidade sanguínea.","Aumento do fluxo venoso."],"c":0,"x":"A imobilização prolongada favorece estase sanguínea."},{"t":"M","e":"Na TVP, onde geralmente se inicia a formação do trombo?","a":["Artérias femorais.","Veias pulmonares.","Artérias coronárias.","Seios venosos musculares da panturrilha.","Veia cava superior."],"c":3,"x":"A TVP geralmente começa nos seios venosos musculares da panturrilha."},{"t":"M","e":"Qual é a principal consequência hemodinâmica da obstrução das artérias pulmonares pelo TEP?","a":["Redução da pós-carga do ventrículo direito.","Aumento da resistência vascular pulmonar e da pós-carga do ventrículo direito.","Aumento imediato do enchimento do ventrículo esquerdo.","Redução da pressão na circulação pulmonar.","Aumento isolado da contratilidade do ventrículo esquerdo."],"c":1,"x":"A obstrução aumenta a resistência vascular pulmonar e a pós-carga do VD."},{"t":"C","e":"Mulher de 35 anos, em uso de anticoncepcional hormonal com estrogênio, apresenta edema unilateral de membro inferior, dor na panturrilha e aumento da temperatura local. Qual diagnóstico deve ser investigado prioritariamente?","a":["Insuficiência arterial aguda.","Linfedema.","Erisipela obrigatoriamente.","Insuficiência cardíaca.","Trombose venosa profunda."],"c":4,"x":"Edema unilateral e dor em paciente com fator de risco sugerem TVP."},{"t":"M","e":"Qual das alternativas apresenta manifestações clínicas características da TVP?","a":["Edema bilateral, tosse produtiva e febre obrigatória.","Dor abdominal, vômitos e diarreia.","Edema unilateral, dor na panturrilha ou coxa, calor local e aumento da circunferência do membro.","Cianose facial, dor cervical e disfagia.","Hipertensão arterial, bradicardia e síncope."],"c":2,"x":"São manifestações características da trombose venosa profunda."},{"t":"C","e":"Homem de 62 anos apresenta dispneia súbita, dor torácica ventilatório-dependente, taquicardia e taquipneia. Qual diagnóstico deve ser considerado prioritariamente?","a":["Tromboembolismo pulmonar.","Gastrite aguda.","Insuficiência venosa crônica.","Linfedema.","Síndrome pós-trombótica."],"c":0,"x":"Dispneia súbita, dor pleurítica e taquicardia são manifestações típicas de TEP."},{"t":"M","e":"Sobre o sinal de Homans na investigação da TVP, assinale a alternativa correta.","a":["É altamente específico e confirma o diagnóstico.","Sua ausência exclui TVP.","É caracterizado por edema bilateral dos membros inferiores.","É caracterizado por dor na panturrilha durante a dorsiflexão passiva do pé, mas apresenta baixa sensibilidade e especificidade.","É utilizado para confirmar TEP."],"c":3,"x":"O sinal de Homans tem baixa sensibilidade e especificidade."},{"t":"M","e":"No escore de Wells para TVP, qual alternativa representa corretamente a classificação de duas categorias?","a":["Pontuação maior que quatro indica TVP improvável.","Pontuação igual ou superior a dois indica TVP provável, enquanto pontuação igual ou inferior a um indica TVP improvável.","Qualquer pontuação positiva confirma TVP.","Pontuação zero indica TVP provável.","O escore não considera história prévia de TVP."],"c":1,"x":"Wells TVP: ≥ 2 indica provável; ≤ 1 indica improvável."},{"t":"C","e":"Paciente apresenta suspeita clínica de TVP e é submetido à ultrassonografia venosa com Doppler e compressão. Qual é o achado mais característico de TVP nesse exame?","a":["Aumento da compressibilidade da veia.","Aumento isolado do fluxo arterial.","Presença obrigatória de aneurisma venoso.","Redução da espessura da parede arterial.","Ausência de compressibilidade da veia acometida."],"c":4,"x":"A ausência de compressibilidade venosa é o achado mais característico."},{"t":"M","e":"Sobre o diagnóstico do TEP utilizando o escore de Wells, assinale a alternativa correta.","a":["Pontuação superior a quatro indica TEP provável, enquanto pontuação igual ou inferior a quatro indica TEP improvável.","Pontuação inferior a dois confirma TEP.","O escore considera exclusivamente a frequência cardíaca.","Hemoptise não faz parte dos critérios.","História prévia de TVP ou TEP não é considerada."],"c":0,"x":"Wells TEP: > 4 provável; ≤ 4 improvável."},{"t":"C","e":"Paciente com suspeita de TEP apresenta baixa probabilidade clínica pelo escore de Wells. O dímero D está negativo, utilizando ensaio de alta sensibilidade e algoritmo validado. Qual é a interpretação mais adequada?","a":["O resultado confirma TEP.","O paciente obrigatoriamente necessita de fibrinólise.","O resultado permite excluir TEP nesse contexto clínico.","O resultado indica necessidade obrigatória de embolectomia.","O dímero D não possui utilidade na investigação do TEP."],"c":2,"x":"Dímero D negativo pode excluir TEP em pacientes de baixa probabilidade, com algoritmo validado."},{"t":"M","e":"Qual alternativa caracteriza corretamente o TEP de alto risco?","a":["Paciente estável, sem alterações ventriculares e com troponina normal.","Paciente com dispneia leve, sem alterações hemodinâmicas.","Paciente com disfunção ventricular direita isolada, sempre sem necessidade de monitorização.","Presença de instabilidade hemodinâmica, como choque obstrutivo, parada cardíaca ou hipotensão persistente.","Presença isolada de dímero D elevado."],"c":3,"x":"TEP de alto risco apresenta instabilidade hemodinâmica."},{"t":"C","e":"Homem de 70 anos apresenta TEP confirmado, choque obstrutivo e hipotensão persistente. Não apresenta contraindicações importantes à fibrinólise. Qual é a conduta terapêutica descrita no material?","a":["Apenas observação clínica.","Fibrinólise sistêmica com alteplase, conforme protocolo institucional, associada à abordagem anticoagulante.","Suspender toda anticoagulação e aguardar resolução espontânea.","Utilizar exclusivamente meias de compressão.","Realizar filtro de veia cava obrigatoriamente como primeira medida."],"c":1,"x":"TEP de alto risco com choque e sem contraindicação importante indica avaliação para fibrinólise sistêmica com alteplase."}]}]}]},{"id":"s1","name":"Habilidades Médicas","themes":[]},{"id":"s2","name":"Habilidades Cirúrgicas","themes":[]},{"id":"s3","name":"LPF","themes":[]},{"id":"s4","name":"LMF","themes":[]},{"id":"s5","name":"Anatomia","themes":[]},{"id":"s6","name":"Core Curriculum","themes":[{"id":"L","name":"Libras","unit":"aulas","sps":[{"id":"L1","lbl":"Aula 1","title":"Introdução à Libras, Mitos e Terminologia","qs":[{"t":"M","e":"Qual é a principal diferença conceitual entre \"Língua\" e \"Linguagem\" estudada na introdução à Libras?","a":["A língua é exclusivamente oral, enquanto a linguagem abrange qualquer comunicação gestual.","A língua é um conjunto de palavras/sinais organizados com regras gramaticais próprias, enquanto a linguagem é um modo amplo de comunicação e expressão sem regras gramaticais rígidas (como a arte ou placas de trânsito).","A linguagem possui estrutura sintática universal, enquanto a língua depende da modalidade auditiva.","A Libras é classificada como linguagem por ser visual-espacial, e o Português é classificado como língua por ser oral-auditivo.","Não há distinção técnica entre os termos na linguística moderna, sendo ambos sinônimos de comunicação humana."],"c":1,"x":""},{"t":"M","e":"Sobre a natureza e a abrangência da Língua Brasileira de Sinais (Libras), assinale a alternativa CORRETA:","a":["É uma língua universal compreendida por surdos de qualquer país.","Trata-se de um código artificial criado a partir do alfabeto manual da língua portuguesa.","É uma língua de modalidade visual-espacial, dotada de gramática própria, utilizada pela comunidade surda do Brasil.","É composta exclusivamente por gestos icônicos e mímicas que imitam objetos concretos.","É uma língua dependente da leitura labial para transmitir tempos verbais e emoções."],"c":2,"x":""},{"t":"M","e":"Qual termo é considerado pejorativo, incorreto e deve ser abolido da prática clínica e social ao se referir à pessoa surda?","a":["Pessoa surda.","Surdo-mudo.","Deficiente auditivo (quando usado no contexto clínico/legal específico).","Usuário de Libras.","Sinalizante."],"c":1,"x":""},{"t":"C","e":"Durante uma triagem na UBS, um estudante de medicina anota no prontuário: \"Paciente surdo-mudo, não se comunica, incapaz de relatar sintomas sem acompanhante\". Ao revisar o prontuário, o preceptor corrige o estudante. Qual é o erro conceitual e ético presente nessa anotação?","a":["O termo \"surdo-mudo\" é inadequado, pois a surdez afeta a audição e não o aparelho fonador; além disso, o paciente possui uma língua plena (Libras) para se comunicar.","O estudante deveria ter escrito \"deficiente auditivo mudo\", pois a ausência de audição impede a emissão de qualquer som laríngeo.","O paciente surdo só pode ser atendido legalmente se estiver acompanhado por um familiar ouvinte que faça leitura labial.","A anotação está correta do ponto de vista médico, mas errada apenas no aspecto jurídico.","Pacientes surdos realmente não possuem linguagem estruturada se não forem oralizados na infância."],"c":0,"x":""},{"t":"M","e":"Entre os mitos frequentes sobre os surdos e a Libras, destaca-se a crença de que:","a":["Pessoas surdas não podem dirigir veículos automotores por falta de audição.","A Libras possui estrutura gramatical independente do Português.","Nem todo surdo realiza leitura labial com fluência.","A comunidade surda inclui também familiares, intérpretes e profissionais envolvidos com a cultura surda.","A Libras foi reconhecida legalmente no Brasil em 2002."],"c":0,"x":""},{"t":"C","e":"Uma enfermeira, ao atender um paciente surdo sem intérprete, fala muito rápido e articulando exageradamente as palavras, acreditando que todo surdo domina perfeitamente a leitura labial. O paciente demonstra confusão e não compreende as orientações. Esse episódio ilustra a quebra de qual mito sobre a surdez?","a":["O mito de que a Libras é uma língua universal.","O mito de que todo surdo faz leitura labial.","O mito de que a língua de sinais é apenas mímica.","O mito de que surdos não têm acesso a tecnologias assistivas.","O mito de que a Libras é igual ao Português sinalizado."],"c":1,"x":""},{"t":"M","e":"Quem faz parte da chamada \"Comunidade Surda\"?","a":["Exclusivamente indivíduos com surdez congênita profunda.","Apenas pessoas com perda auditiva bilateral que não utilizam implante coclear.","Surdos e ouvintes (como familiares, intérpretes, professores e amigos) que compartilham a língua de sinais, lutas políticas e aspectos culturais.","Somente profissionais da área da saúde e educação certificados pelo MEC.","Exclusivamente pessoas que possuem laudo médico de deficiência auditiva."],"c":2,"x":""},{"t":"M","e":"Qual dos seguintes recursos tecnológicos foi apresentado como ferramenta digital de apoio/tradução para auxiliar na aprendizagem e comunicação básica em Libras?","a":["Hand Talk e ProDeaf.","Duolingo e Babbel.","Google Tradutor de Voz.","Sistema Braille Digital.","Audiômetro Portátil."],"c":0,"x":""},{"t":"C","e":"Um médico residente precisa perguntar dados básicos de identificação a um paciente surdo na enfermaria: nome, idade, altura e peso. Ele não sabe os sinais específicos dessas palavras e decide soletrar todas as palavras da frase usando o alfabeto manual (datilologia). Qual é a limitação dessa estratégia?","a":["A datilologia não existe na Libras, sendo exclusiva da língua de sinais americana.","A soletração manual serve apenas para representar letras do alfabeto (como nomes próprios ou palavras sem sinal), não substituindo a estrutura gramatical e o léxico próprio da Libras.","O alfabeto manual da Libras utiliza as duas mãos simultaneamente, impossibilitando a anotação médica.","A soletração manual é proibida em ambientes hospitalares pela Lei 10.436/2002.","A datilologia só pode ser compreendida por surdos que possuem ensino superior completo."],"c":1,"x":""},{"t":"M","e":"Na Libras, a representação dos números divide-se em categorias distintas conforme o contexto de uso. Quais são as três categorias numéricas apresentadas na aula introdutória?","a":["Cardinais (números), quantidades e números ordinais.","Romanos, arábicos e fracionários.","Decimais, percentuais e monetários.","Pares, ímpares e primos.","Temporais, espaciais e corporais."],"c":0,"x":""},{"t":"M","e":"Sobre a iconidade na Libras, é correto afirmar que:","a":["Todos os sinais são completamente transparentes e qualquer ouvinte entende sem estudar.","É um mito afirmar que a Libras é puramente icônica; embora existam sinais icônicos, muitos sinais são arbitrários e possuem regras gramaticais complexas.","Sinais icônicos são considerados inferiores aos sinais arbitrários na linguística.","A iconidade impede que a Libras expresse conceitos abstratos da medicina.","Apenas os verbos possuem caráter icônico na Libras."],"c":1,"x":""},{"t":"C","e":"Um paciente surdo chega ao pronto-socorro e, ao encontrar a recepcionista que sabe Libras, recebe os cumprimentos: \"Oi, tudo bem? Bom dia! Qual seu nome?\". O paciente sorri aliviado e inicia o relato de suas queixas. De acordo com o conteúdo estudado, qual o impacto direto do uso da Libras no atendimento?","a":["Substitui a necessidade de exames laboratoriais e físicos.","Promove inclusão social, acessibilidade comunicacional e autonomia para que o paciente participe ativamente do próprio cuidado.","Dispensa o registro em prontuário médico escrito em português.","Garante que o paciente compreenda automaticamente termos médicos em latim.","Obriga o hospital a contratar apenas médicos surdos."],"c":1,"x":""},{"t":"M","e":"Qual obra de Audrei Gesser foi destacada como material de apoio bibliográfico fundamental para desconstruir crenças e preconceitos em torno da língua de sinais?","a":["\"Libras? Que língua é essa? Crenças e preconceitos em torno da língua de sinais e da realidade surda\".","\"O Silêncio dos Inocentes\".","\"Tratado de Otorrinolaringologia Clínica\".","\"Gramática Normativa da Língua Portuguesa\".","\"História da Medicina Moderna\"."],"c":0,"x":""},{"t":"C","e":"Durante uma consulta de medicina do trabalho para renovação de Carteira Nacional de Habilitação (CNH), um médico questiona se um candidato surdo profundo tem capacidade legal e cognitiva para dirigir. Com base nos conhecimentos sobre cultura surda e legislação, qual deve ser a conduta do médico?","a":["Inaptar o candidato automaticamente, pois a audição é indispensável para a direção veicular.","Avaliar o candidato normalmente dentro dos critérios clínicos vigentes, sabendo que a surdez não impede a direção veicular (a ideia de que surdo não dirige é um mito).","Exigir que o candidato realize implante coclear antes de emitir o laudo.","Permitir a direção apenas se o candidato comprovar fluência em leitura labial.","Encaminhar o paciente para avaliação psiquiátrica compulsória."],"c":1,"x":""},{"t":"M","e":"Qual instituição nacional oferece um dicionário online oficial de Libras citado nos materiais de estudo?","a":["INES (Instituto Nacional de Educação de Surdos).","ANVISA (Agência Nacional de Vigilância Sanitária).","CFM (Conselho Federal de Medicina).","IBGE (Instituto Brasileiro de Geografia e Estatística).","OMS (Organização Mundial da Saúde)."],"c":0,"x":""}]},{"id":"L2","lbl":"Aula 2","title":"Parâmetros da Libras","qs":[{"t":"M","e":"Quantos e quais são os cinco parâmetros fonológicos/morfológicos fundamentais que estruturam a formação dos sinais na Libras?","a":["5 parâmetros: Configuração de mãos, Ponto de articulação, Movimento, Orientação das mãos e Expressão facial/corporal.","5 parâmetros: Alfabeto manual, Números, Sinais icônicos, Leitura labial e Gestos naturais.","4 parâmetros: Configuração de mãos, Movimento, Velocidade e Gramática.","5 parâmetros: Fonema, Morfema, Sintaxe, Semântica e Pragmática.","3 parâmetros: Mãos, Braços e Expressão Facial."],"c":0,"x":""},{"t":"M","e":"O que define o parâmetro Configuração de Mãos (CM) na Libras?","a":["O local do corpo onde a mão toca durante o sinal.","A direção para onde a palma da mão está voltada.","A forma/formato que a mão assume para executar o sinal, podendo utilizar formas do alfabeto datilológico, números ou outras configurações específicas.","A velocidade com que os braços se deslocam no espaço.","A contração das sobrancelhas para indicar perguntas."],"c":2,"x":""},{"t":"M","e":"Na execução do sinal \"DESCULPE\" (conforme ilustrado na Aula 3), qual é a Configuração de Mão utilizada?","a":["Mão em \"A\".","Mão em \"Y\".","Mão em \"L\".","Mão em \"S\".","Mão em \"V\"."],"c":1,"x":""},{"t":"M","e":"O que corresponde ao parâmetro Ponto de Articulação (PA)?","a":["Apenas as articulações anatômicas dos dedos e punhos.","O lugar no corpo onde o sinal é executado, ou ainda o espaço neutro logo à frente do corpo e suas laterais.","Exclusivamente a região da face e da cabeça.","O movimento circular realizado pelo antebraço.","A posição sentada ou em pé do emissor da mensagem."],"c":1,"x":""},{"t":"C","e":"Um estudante de medicina está aprendendo a perguntar sintomas em Libras. Ele realiza o sinal de \"APRENDER\" levando a mão à testa, mas, por descuido, executa exatamente a mesma configuração de mão e movimento na altura do peito (região esternal), formando outro sinal (\"SÁBADO\" / \"LARANJA\" dependendo do movimento). Qual parâmetro foi alterado pelo estudante, mudando o significado do sinal?","a":["Orientação das mãos.","Ponto de articulação.","Expressão facial.","Velocidade do movimento.","Configuração de mãos."],"c":1,"x":""},{"t":"M","e":"Sobre o parâmetro Movimento (M) na Libras, assinale a alternativa CORRETA:","a":["Todos os sinais da Libras exigem movimento amplo dos braços.","Existem sinais considerados estáticos (sem movimento), e nos sinais com movimento observam-se direção (unidirecional e bidirecional), tipos de movimento e velocidade.","O movimento serve apenas para indicar verbos no passado.","A velocidade do movimento não interfere no sentido de intensidade de um sintoma.","O movimento é sempre realizado de baixo para cima."],"c":1,"x":""},{"t":"M","e":"O que significa o parâmetro Orientação das Mãos (O)?","a":["A lateralidade do sinalizante (ser destro ou canhoto).","A direção para a qual a palma da mão está voltada durante a execução do sinal (ex.: para cima, para baixo, para frente, para trás).","A distância entre o médico e o paciente durante a consulta.","O uso simultâneo da mão direita e da mão esquerda.","A ordem cronológica das palavras na frase em Libras."],"c":1,"x":""},{"t":"C","e":"Na Cartilha de Libras em Medicina e Saúde, os sinais de INTERNAÇÃO e INTERNAR (páginas 57-58) possuem configuração de mão e ponto de articulação semelhantes (mão esquerda aberta palma para cima, mão direita em \"U\" tocando a palma esquerda). Porém, em internação, a mão direita em \"U\" tem a palma voltada para baixo, enquanto em internar, a mão direita em \"U\" tem a palma voltada para cima (tocando o dorso direito na palma esquerda). Essa distinção gramatical ocorre pela mudança em qual parâmetro?","a":["Ponto de articulação.","Configuração de mãos.","Orientação das mãos.","Expressão corporal.","Espaço neutro."],"c":2,"x":""},{"t":"M","e":"Qual é o papel linguístico da Expressão Facial e Corporal (expressões não manuais) na Libras?","a":["É um recurso meramente teatral e opcional, sem valor gramatical.","Funciona como parâmetro linguístico essencial que define o tom da mensagem, marca estruturas sintáticas (como frases interrogativas ou negativas) e quantifica intensidades (como dor leve ou severa).","Deve ser evitada pelos profissionais de saúde para manter a neutralidade clínica.","Substitui completamente a necessidade de configurar as mãos.","Serve apenas para demonstrar tristeza ou alegria fora do contexto clínico."],"c":1,"x":""},{"t":"C","e":"Um paciente surdo realiza o sinal de DOR (mão em \"F\" girando rapidamente no espaço neutro ou próximo ao local afetado), porém mantém o rosto completamente inexpressivo, e em seguida repete o mesmo sinal manual com os olhos semicerrados, testa franzida e movimento muito rápido. Como o médico deve interpretar essa diferença?","a":["O paciente está repetindo a palavra por gagueira motora.","O parâmetro expressão facial aliado à velocidade do movimento está modulando a intensidade do sintoma, indicando o agravamento ou alta intensidade da dor.","O paciente mudou o significado do sinal de \"dor\" para \"febre\".","A expressão facial indica que o paciente não entendeu a pergunta do médico.","O paciente está negando que sente dor."],"c":1,"x":""},{"t":"C","e":"Considere os sinais PRESSÃO ALTA e PRESSÃO BAIXA (páginas 34-35 da Cartilha). Ambos iniciam com a mão direita em \"S\" ao lado da parte superior do braço esquerdo (simulando o manguito). No final, em pressão alta, a mão aberta com palma para cima se eleva; em pressão baixa, a mão aberta baixa. Quais parâmetros diferenciam a parte final desses dois sinais?","a":["Apenas o ponto de articulação na testa.","Direção do movimento (para cima vs. para baixo) e orientação da palma.","Configuração de mão em \"Y\" vs. mão em \"X\".","Apenas a soletração manual das palavras \"alta\" e \"baixa\".","O uso exclusivo da mão esquerda."],"c":1,"x":""},{"t":"M","e":"Quando um sinal da Libras não toca nenhuma parte do corpo do sinalizante, sendo executado na região logo à frente do tronco, diz-se que seu Ponto de Articulação é o:","a":["Espaço nulo.","Espaço neutro.","Ponto visceral.","Plano sagital posterior.","Campo periférico."],"c":1,"x":""},{"t":"C","e":"Ao sinalizar AMIGDALITE, o paciente toca as pontas dos dedos (mãos em \"O\") nas laterais do pescoço. Ao sinalizar OTITE, toca as pontas dos dedos (indicador e polegar unidos) no ouvido com expressão de dor. Nesses dois sinais clínicos, o Ponto de Articulação tem função diretamente relacionada a quê?","a":["À localização anatômica do órgão ou estrutura acometida pelo processo inflamatório.","Ao tempo de duração dos sintomas em dias ou semanas.","À gravidade da infecção bacteriana versus viral.","À idade do paciente atendido.","Ao tipo de medicamento prescrito na receita."],"c":0,"x":""},{"t":"M","e":"Na descrição fonológica de Capovilla & Raphael (2022) na Cartilha de Libras em Medicina e Saúde, as unidades mínimas que compõem a forma de um sinal e permitem distinguir dois sinais que formam pares mínimos são chamadas de:","a":["Grafemas.","Sematosemas.","Fonemas vocálicos.","Morfemas presos.","Ideogramas."],"c":1,"x":""},{"t":"C","e":"Um médico deseja perguntar ao paciente surdo se ele está com FEBRE. Ele posiciona a mão em \"B\" horizontal, palma para frente, tocando o dorso da mão na testa, e acompanha o sinal elevando as sobrancelhas e inclinando levemente a cabeça para frente. A elevação das sobrancelhas e inclinação da cabeça desempenham qual função gramatical nessa interação?","a":["Indicam que a febre está acima de $40^\\circ\\text{C}$.","Marcam a modalidade interrogativa da frase (pergunta) através da expressão facial e corporal.","Negam a presença do sintoma.","Transformam o substantivo \"febre\" no verbo \"esfriar\".","Indicam que o médico está irritado com o paciente."],"c":1,"x":""}]},{"id":"L3","lbl":"Aula 3","title":"Dois Olhares sobre o Surdo e a Surdez (Clínico-Terapêutico vs. Socioantropológico)","qs":[{"t":"M","e":"Como o Olhar Clínico-Terapêutico define a surdez?","a":["Como uma diferença linguística e identidade cultural.","Como uma patologia, doença, deficiência ou anomalia médica (\"defeito\" que precisa ser consertado/curado).","Como uma minoria política com história própria.","Como uma variação normal da experiência visual humana.","Como uma barreira exclusivamente arquitetônica da sociedade."],"c":1,"x":""},{"t":"M","e":"Qual é o \"ideal de sucesso\" perseguido pelo modelo Clínico- Terapêutico?","a":["O surdo ser alfabetizado em Libras e conquistar autonomia social.","A sociedade remover as barreiras de acessibilidade comunicacional.","A normalização: o surdo conseguir falar oralmente e se parecer o máximo possível com um ouvinte.","A formação de escolas bilíngues lideradas por professores surdos.","A valorização da cultura visual e da identidade surda."],"c":2,"x":""},{"t":"M","e":"No Olhar Socioantropológico (A Visão da Diferença), qual é o foco da atenção voltado ao sujeito surdo?","a":["No ouvido lesado e naquilo que falta ao sujeito.","Na correção cirúrgica obrigatória da cóclea.","No canal visual e gestual (\"mãos que falam\" e \"olhos que veem\"), enxergando sua potencialidade e identidade cultural.","Na proibição da língua de sinais para estimular a oralização.","Na reabilitação fonoaudiológica como única via de integração."],"c":2,"x":""},{"t":"C","e":"Um médico otorrinolaringologista atende uma criança surda de 4 anos acompanhada de seus pais ouvintes. Durante a consulta, o médico afirma: \"Vocês precisam proibir que ela use sinais em casa, pois essa mímica atrapalha o desenvolvimento da fala. Nosso objetivo é curar esse defeito para que ela seja uma pessoa normal\". A conduta desse profissional reflete integralmente qual modelo?","a":["Olhar Socioantropológico.","Modelo Bilíngue Inclusivo.","Olhar Clínico-Terapêutico (Patológico).","Abordagem Culturalmente Segura.","Paradigma da Diversidade Linguística."],"c":2,"x":""},{"t":"M","e":"De acordo com o quadro comparativo entre os dois olhares (Aula sobre Dois Olhares), como a Língua de Sinais é vista no Olhar Socioantropológico?","a":["Como uma mímica primitiva que atrapalha a fala.","Como um recurso provisório até a colocação do aparelho auditivo.","Como língua natural, oficial e complexa, fundamental para o desenvolvimento cognitivo e social do surdo.","Como um dialeto simplificado da língua portuguesa.","Como uma ferramenta útil apenas para surdos com deficiência intelectual."],"c":2,"x":""},{"t":"M","e":"Na perspectiva do Olhar Socioantropológico, de quem é a responsabilidade pela adaptação e inclusão?","a":["Exclusivamente do surdo, que deve se esforçar para se adaptar ao mundo ouvinte.","Apenas da família do surdo, que deve custear terapias de oralização.","Da sociedade, que deve remover as barreiras de acesso e garantir acessibilidade.","Apenas dos médicos especialistas em otorrinolaringologia.","Das instituições filantrópicas de isolamento."],"c":2,"x":""},{"t":"C","e":"Uma unidade hospitalar implementa sinalização visual luminosa nas salas de espera, contrata intérpretes de Libras para o pronto-atendimento e capacita sua equipe médica em comunicação básica em Libras para acolher pacientes surdos sem exigir que eles falem oralmente. Essa postura institucional está alinhada a qual paradigma?","a":["Olhar Clínico-Terapêutico.","Olhar Socioantropológico (Cultural).","Modelo de Segregação Assistencialista.","Oralismo Puro.","Modelo Biomédico Reducionista."],"c":1,"x":""},{"t":"M","e":"Quais são as intervenções comuns associadas ao Olhar Clínico- Terapêutico?","a":["Presença de intérpretes, bilinguismo e inclusão social.","Aparelhos auditivos, implantes cocleares e fonoterapia voltada à oralização.","Ensino de SignWriting e literatura surda.","Criação de associações culturais de surdos.","Adaptação visual dos espaços públicos."],"c":1,"x":""},{"t":"C","e":"Um paciente adulto surdo, fluente em Libras e orgulhoso de sua identidade cultural, procura um médico para tratar uma hipertensão arterial. Durante a consulta, o médico ignora a queixa cardiológica e insiste repetidamente para que o paciente faça cirurgia de implante coclear para \"deixar de ser deficiente\". O paciente sente-se desrespeitado e abandona o acompanhamento. Qual crítica o modelo socioantropológico faz a essa postura médica?","a":["O médico focou apenas no \"ouvido que não ouve\" (patologização/normalização), desrespeitando a autonomia e a identidade do sujeito surdo, em vez de oferecer atendimento humanizado focado na comunicação.","O médico deveria ter encaminhado o paciente para internação psiquiátrica por recusar o implante.","O paciente agiu de forma antiética ao recusar a cura da surdez.","A hipertensão arterial não pode ser tratada em pacientes que não realizam implante coclear.","O implante coclear é obrigatório por lei para todo cidadão surdo no Brasil."],"c":0,"x":""},{"t":"M","e":"No ambiente de saúde, como se caracteriza o atendimento pautado no Olhar Socioantropológico em oposição ao Clínico-Terapêutico?","a":["Atendimento técnico focado exclusivamente na cura ou reabilitação auditiva.","Atendimento humanizado focado na comunicação efetiva e no respeito à diferença linguística.","Atendimento realizado exclusivamente por meio de questionários escritos extensos.","Atendimento terceirizado apenas a familiares ouvintes.","Atendimento que proíbe o uso de recursos visuais."],"c":1,"x":""},{"t":"M","e":"Qual autora, citada nas referências da aula sobre os Dois Olhares, escreveu \"As imagens do outro sobre a cultura surda\" (2008), analisando como a história ocidental construiu o olhar clínico e como a comunidade surda resiste pela perspectiva cultural?","a":["Karin Strobel.","Nise da Silveira.","Maria Montessori.","Ana Néri.","Zilda Arns."],"c":0,"x":""},{"t":"C","e":"Em uma discussão de caso clínico na faculdade de medicina, um aluno argumenta: \"Na visão socioantropológica, o médico não pode jamais indicar um aparelho auditivo ou tratar uma otite, pois isso seria patologizar o surdo\". Outro aluno corrige a afirmação. Qual é a explicação correta?","a":["O aluno tem razão; o olhar socioantropológico proíbe qualquer cuidado otológico.","O olhar socioantropológico não impede o cuidado clínico de doenças (como otites) ou o uso de tecnologias quando há desejo explícito e indicação clínica, mas combate a redução da pessoa surda a um \"defeito\" e garante que a língua de sinais e sua cultura sejam respeitadas.","O olhar socioantropológico só se aplica na escola, nunca nos hospitais.","Na visão socioantropológica, a otite não é considerada uma doença.","O aparelho auditivo cura completamente a surdez neurossensorial profunda."],"c":1,"x":""},{"t":"M","e":"Na transição histórica do modelo terapêutico para o modelo socioantropológico, qual conceito ganha centralidade na educação e na saúde dos surdos?","a":["A desmedicalização da surdez e o reconhecimento do surdo como membro de uma minoria linguística.","A medicalização intensiva da infância surda.","O isolamento em instituições asilares.","A substituição da Libras pelo português oral.","A exclusão social."],"c":0,"x":""},{"t":"C","e":"Uma gestante surda chega à maternidade em trabalho de parto. A equipe obstétrica oferece uma intérprete de Libras por videochamada (ou presencial), explica cada etapa do parto usando recursos visuais e permite que seu esposo surdo acompanhe o nascimento. Esse cenário exemplifica:","a":["A aplicação prática do olhar socioantropológico e da remoção de barreiras de acesso na saúde.","A imposição do modelo clínico-terapêutico.","A fase histórica da integração, onde o paciente se adapta sozinho ao ambiente.","Um procedimento ilegal segundo o Decreto 5.626/2005.","Uma prática exclusiva de hospitais psiquiátricos."],"c":0,"x":""},{"t":"M","e":"Qual organizador da obra \"A surdez: um olhar sobre as diferenças\" (2013) é referência nacional no debate sobre desmedicalização da surdez e identidade cultural surda?","a":["Carlos Skliar.","Fernando Capovilla.","Aristóteles.","Wilhelm Wundt.","Alois Alzheimer."],"c":0,"x":""}]},{"id":"L4","lbl":"Aula 4","title":"Diferenças Culturais, Ética e Respeito no Atendimento ao Surdo","qs":[{"t":"M","e":"Na relação linguística da pessoa surda brasileira, qual é o status da Língua Brasileira de Sinais (Libras) e da Língua Portuguesa?","a":["O português falado é a primeira língua (L1) e a Libras é a segunda língua (L2).","A Libras é a primeira língua (L1), oficial e com gramática própria; o português é a segunda língua (L2), geralmente na modalidade escrita.","Ambas são línguas de modalidade oral-auditiva.","O português escrito é perfeitamente dominado por 100% dos surdos brasileiros.","A Libras é apenas uma adaptação gestual da gramática do português."],"c":1,"x":""},{"t":"M","e":"Durante uma consulta médica com um paciente surdo, qual é o significado cultural do contato visual?","a":["Olhar fixamente para o paciente é considerado invasivo e desrespeitoso.","O contato visual contínuo demonstra respeito e atenção; desviar o olhar (ex.: olhar para a tela do computador enquanto o paciente sinaliza) pode ser interpretado como desinteresse ou hostilidade.","O médico deve olhar apenas para o intérprete de Libras e nunca para o paciente.","O contato visual só é necessário no momento do exame físico.","Fechar os olhos enquanto o paciente fala demonstra concentração clínica."],"c":1,"x":""},{"t":"M","e":"Qual é a forma ética e culturalmente adequada de chamar a atenção de um paciente surdo na sala de espera ou no consultório?","a":["Gritar seu nome em voz alta ou bater palmas atrás dele.","Acenar levemente dentro do seu campo visual ou realizar um toque leve no ombro (lugares de toque aceito).","Puxar seu braço bruscamente ou tocar em sua cabeça.","Jogar objetos leves na mesa para produzir vibração sonora.","Chamar apenas pelo sistema de alto-falantes da recepção."],"c":1,"x":""},{"t":"C","e":"No estudo de caso do Sr. Thiago (28 anos, surdo fluente em Libras e com baixa compreensão do português escrito, com dores abdominais intensas), qual foi o primeiro erro cometido pela Unidade de Saúde antes mesmo de ele entrar no consultório?","a":["A recepção chamou o nome de Thiago pelo sistema de som três vezes, gerando atraso e estresse.","A recepção ofereceu um intérprete de Libras sem autorização prévia.","O recepcionista acenou no campo visual de Thiago.","O recepcionista pediu para Thiago apontar onde sentia dor.","A recepção priorizou o atendimento de urgência."],"c":0,"x":""},{"t":"C","e":"Ainda no caso do Sr. Thiago, durante a anamnese, o Dr. Lucas inicialmente escreveu termos médicos técnicos em um papel e, frustrado com a demora, passou a digitar no computador sem olhar para o paciente. Quais foram as consequências dessas duas atitudes?","a":["Facilitaram o diagnóstico precoce de gastrite.","Geraram barreira comunicacional (pois o português é L2 e termos técnicos são incompreensíveis) e quebra de vínculo (desviar o olhar foi percebido como desinteresse e hostilidade).","Estimularam o paciente a aprender português escrito durante a consulta.","Melhoraram a adesão terapêutica do Sr. Thiago.","Foram atitudes recomendadas pelo protocolo de comunicação visual."],"c":1,"x":""},{"t":"C","e":"Para corrigir sua abordagem e realizar um atendimento culturalmente seguro ao Sr. Thiago, quais estratégias o Dr. Lucas adotou com sucesso?","a":["Falou mais alto e usou metáforas populares sobre \"queimação no estômago\".","Afastou o computador, manteve contato visual contínuo, usou um desenho anatômico para localizar a dor, validou a expressão facial de dor severa e ilustrou a receita com desenhos (estômago com chama de fogo, sol para manhã e lua para noite).","Encaminhou o paciente para casa sem medicação até que ele trouxesse um familiar ouvinte.","Escreveu a receita utilizando abreviações médicas (\"1 cp VO 12/12h\") e internetês.","Realizou uma endoscopia imediata sem explicar o procedimento ao paciente."],"c":1,"x":""},{"t":"M","e":"Quando há um intérprete de Libras presente na consulta médica, para quem o profissional de saúde deve olhar e direcionar sua fala?","a":["Exclusivamente para o intérprete, usando a terceira pessoa (\"Pergunte a ele o que ele sente\").","Diretamente para o paciente surdo, usando a primeira e segunda pessoas (\"O que você está sentindo?\").","Alternadamente para o prontuário e para a parede.","Apenas para o acompanhante ouvinte.","Para o chão, evitando constranger o intérprete."],"c":1,"x":""},{"t":"M","e":"Sobre o uso de metáforas e linguagem escrita na comunicação com pacientes surdos, assinale a alternativa CORRETA:","a":["Metáforas da língua portuguesa (como \"dor de partir o coração\" ou \"engolir sapo\") são compreendidas literalmente e fazem todo sentido em Libras.","Metáforas da língua falada geralmente não fazem sentido em Libras; na comunicação escrita, deve-se evitar internetês e abreviações, usando frases curtas, diretas e recursos visuais.","Deve-se usar internetês (\"vc\", \"tb\", \"pq\") para facilitar a leitura rápida do paciente surdo.","As consultas com pacientes surdos demandam menos tempo físico do que com ouvintes.","Explicações médicas não necessitam de contextualização visual."],"c":1,"x":""},{"t":"M","e":"Como confirmar se o paciente surdo compreendeu adequadamente a prescrição médica e as orientações do tratamento ao final da consulta?","a":["Perguntando apenas \"Você entendeu?\" (pois o paciente pode acenar positivamente por educação mesmo sem ter entendido).","Pedindo para que o paciente explique ou demonstre o tratamento com as próprias palavras/sinais (técnica de teach-back / confirmação ativa).","Entregando a bula do medicamento para ele ler em casa.","Falando o nome do remédio três vezes bem devagar.","Presumindo que o desenho na receita dispensa qualquer verificação."],"c":1,"x":""},{"t":"C","e":"Uma paciente surda vai a uma consulta ginecológica e é muito bem acolhida pela médica, que utiliza recursos visuais e respeita seu tempo de comunicação. Na semana seguinte, outras quatro mulheres surdas marcam consulta com a mesma médica. Esse fenômeno ilustra qual característica cultural da comunidade surda?","a":["Individualismo extremo e isolamento social.","Coletivismo e identidade surda: a comunidade surda compartilha intensamente experiências sobre serviços de saúde, e o acolhimento gera forte vínculo de confiança.","Dependência financeira entre pacientes da mesma clínica.","Obrigação legal de todos os surdos frequentarem o mesmo consultório.","Falta de opções de atendimento no sistema público."],"c":1,"x":""},{"t":"C","e":"Um médico precisa explicar a um paciente surdo, sem intérprete no momento, que ele deverá tomar um antibiótico a cada 8 horas durante 7 dias, evitando bebidas alcoólicas. Qual é a melhor forma de registrar essa orientação visualmente?","a":["Escrever um parágrafo longo em letra cursiva detalhando a farmacocinética do antibiótico.","Usar frases curtas e diretas, desenhar um relógio ou ícones de horários (manhã, tarde, noite), marcar 7 dias em um calendário e desenhar uma bebida alcoólica com um \"X\" vermelho por cima.","Usar apenas siglas médicas: \"1 comp VO 8/8h por 7d. Proibido etilismo.\"","Enviar um áudio pelo WhatsApp explicando a receita.","Pedir para o farmacêutico resolver a comunicação quando o paciente for comprar o remédio."],"c":1,"x":""},{"t":"M","e":"Por que as consultas médicas com pacientes surdos costumam demandar mais tempo físico?","a":["Porque os pacientes surdos possuem déficit cognitivo que retarda o raciocínio.","Porque explicações médicas exigem maior contextualização visual, ausência de metáforas da língua falada e checagem cuidadosa da compreensão.","Porque a lei exige que a consulta dure no mínimo duas horas.","Porque o exame físico precisa ser repetido duas vezes.","Porque o paciente precisa preencher formulários em dois idiomas."],"c":1,"x":""},{"t":"C","e":"Ao entrar no consultório, um enfermeiro percebe que o paciente surdo está de costas olhando um cartaz na parede. O enfermeiro caminha até ele e dá um leve toque em seu ombro para iniciar a comunicação. Essa conduta é:","a":["Inadequada, pois nunca se deve tocar em um paciente surdo.","Adequada, pois o ombro é um local de toque aceito na cultura surda para chamar a atenção de forma respeitosa quando o emissor não está no campo visual.","Antiética, pois viola o código de ética da enfermagem.","Desnecessária, pois o enfermeiro deveria ter batido os pés no chão.","Aceitável apenas se o paciente for criança."],"c":1,"x":""},{"t":"M","e":"Na comunicação com o paciente surdo, qual a importância das expressões faciais do próprio paciente durante a anamnese?","a":["Nenhuma, pois apenas exames laboratoriais medem a dor.","As expressões faciais definem o tom da mensagem e permitem ao profissional quantificar a intensidade de sintomas como dor ou urgência (ex.: olhos semicerrados e testa franzida indicando dor severa).","Indicam apenas nervosismo por estar no hospital.","Devem ser ignoradas se o paciente não souber escrever em português.","Servem apenas para confirmar se o paciente gosta do médico."],"c":1,"x":""},{"t":"C","e":"Um médico escreve no prontuário de entrega ao paciente: \"Vc tem q fazer USG abd total em jejum p/ ver pedra na vesícula\". Considerando as diretrizes de comunicação escrita com pacientes surdos, qual é o problema dessa frase?","a":["O uso de internetês (\"vc\", \"q\", \"p/\") e siglas técnicas (\"USG abd\") dificulta a leitura para quem tem o português como segunda língua (L2).","O exame de ultrassonografia é contraindicado para pessoas surdas.","A frase é longa demais.","O médico deveria ter usado metáforas poéticas.","Não há problema algum, pois internetês é a forma oficial de escrita dos surdos."],"c":0,"x":""}]},{"id":"L5","lbl":"Aula 5","title":"História da Educação dos Surdos, Abordagens de Ensino e Legislação","qs":[{"t":"M","e":"Qual é a ordem cronológica correta dos quatro momentos históricos vivenciados pelas pessoas com deficiência (incluindo os surdos) na sociedade?","a":["Segregação → Exclusão → Inclusão → Integração.","Exclusão → Segregação → Integração → Inclusão.","Inclusão → Integração → Segregação → Exclusão.","Integração → Exclusão → Segregação → Inclusão.","Exclusão → Integração → Segregação → Inclusão."],"c":1,"x":""},{"t":"M","e":"Na Antiguidade (fase da Exclusão), qual filósofo afirmou que \"se a pessoa não fala, ela não tem linguagem, então ela não pensa\", contribuindo para que surdos fossem marginalizados e privados de direitos?","a":["Sócrates.","Platão.","Aristóteles.","Hipócrates.","Descartes."],"c":2,"x":""},{"t":"M","e":"Qual é a diferença fundamental entre Integração e Inclusão na história das pessoas com deficiência?","a":["Na integração, o ambiente se adapta para receber o surdo; na inclusão, o surdo é isolado em instituições especiais.","Na integração, o surdo conquista o direito de estar na escola/espaço público, mas ele precisa se adaptar sozinho ao ambiente; na inclusão, o ambiente é que se adapta para receber e garantir acessibilidade a todos.","Integração e inclusão são sinônimos perfeitos na legislação brasileira.","Na inclusão, as línguas de sinais são proibidas para integrar o aluno à turma ouvinte.","A integração ocorreu na Antiguidade, enquanto a exclusão ocorreu no século XXI."],"c":1,"x":""},{"t":"C","e":"Uma escola regular aceita a matrícula de um aluno surdo, coloca-o na sala de aula comum sem intérprete de Libras, sem materiais visuais e exige que ele acompanhe as aulas expositivas orais exatamente como os colegas ouvintes. Se ele reprovar, a culpa é atribuída à sua \"dificuldade auditiva\". Esse cenário retrata qual momento histórico?","a":["Inclusão plena.","Integração (o aluno está fisicamente no espaço, mas precisa se adaptar sozinho a um ambiente não acessível).","Exclusão radical (onde era morto ou proibido de existir socialmente).","Bilinguismo educacional.","Segregação asilar."],"c":1,"x":""},{"t":"M","e":"O que foi o Congresso de Milão (1880) e qual foi seu impacto na história dos surdos?","a":["Foi um congresso que oficializou a Libras no Brasil e criou as escolas bilíngues.","Foi um marco histórico considerado um grande retrocesso, pois decidiu que o \"Oralismo\" era o melhor método de ensino e proibiu as línguas de sinais nas escolas em diversos países.","Foi uma conferência da OMS que instituiu o implante coclear gratuito.","Foi o evento em que Aristóteles defendeu a língua de sinais.","Foi o congresso que regulamentou a profissão de intérprete de Libras."],"c":1,"x":""},{"t":"M","e":"Quais são as três principais abordagens de ensino na educação dos surdos estudadas na linha do tempo?","a":["Oralismo, Comunicação Total e Bilinguismo.","Exclusão, Segregação e Assistencialismo.","Fonética, Silábica e Alfabética.","Leitura labial, Braille e Implante Coclear.","Monolinguismo, Estruturalismo e Behaviorismo."],"c":0,"x":""},{"t":"M","e":"Como se define a abordagem do Bilinguismo na educação dos surdos?","a":["Uso simultâneo de fala oral e sinais seguindo a ordem gramatical do português.","Proibição de sinais e treino intensivo de leitura labial e articulação vocal.","Ensino da Língua de Sinais como primeira língua (L1) e da Língua Portuguesa na modalidade escrita como segunda língua (L2), promovendo desenvolvimento cognitivo e construção da identidade surda.","Ensino de inglês e português oral para surdos oralizados.","Uso exclusivo de mímicas e desenhos sem ensino de língua escrita."],"c":2,"x":""},{"t":"M","e":"O que dispõe a Lei nº 10.436, de 24 de abril de 2002?","a":["Regulamenta a profissão de Tradutor e Intérprete de Libras.","Reconhece a Língua Brasileira de Sinais (Libras) como meio legal de comunicação e expressão das comunidades surdas do Brasil.","Institui o Estatuto da Pessoa com Deficiência (LBI).","Torna obrigatório o implante coclear em recém-nascidos surdos.","Proíbe o ensino de português escrito para surdos."],"c":1,"x":""},{"t":"M","e":"Qual decreto regulamentou a Lei nº 10.436/2002, detalhando a inclusão da Libras na educação (inclusive como disciplina obrigatória em cursos de licenciatura e fonoaudiologia) e nos serviços públicos essenciais, como a saúde?","a":["Decreto nº 5.626/2005.","Decreto nº 7.611/2011.","Decreto nº 10.098/2000.","Decreto nº 8.080/1990.","Decreto nº 1.880/1880."],"c":0,"x":""},{"t":"M","e":"Qual lei brasileira regulamentou a profissão de Tradutor e Intérprete de Libras, estabelecendo critérios de formação e certificação profissional?","a":["Lei nº 10.436/2002.","Lei nº 12.319/2010.","Lei nº 13.146/2015.","Lei nº 8.080/1990.","Lei nº 9.394/1996."],"c":1,"x":""},{"t":"M","e":"A Lei nº 13.146/2015 é conhecida como:","a":["Lei da Libras.","Lei Brasileira de Inclusão (Estatuto da Pessoa com Deficiência), que garante direitos, acessibilidade e combate a discriminação.","Lei do Congresso de Milão.","Lei do Teste da Orelhinha.","Lei do Intérprete Hospitalar."],"c":1,"x":""},{"t":"C","e":"Um hospital público nega atendimento com intérprete de Libras a um paciente surdo que vai passar por uma cirurgia eletiva, alegando que \"o hospital não tem obrigação legal de fornecer acessibilidade comunicacional, cabendo ao paciente dar um jeito de entender o termo de consentimento\". Com base na legislação brasileira (Decreto nº 5.626/2005 e Lei nº 13.146/2015), essa recusa do hospital é:","a":["Legal, pois a acessibilidade em Libras aplica-se apenas às escolas públicas.","Ilegal e discriminatória, pois a legislação garante às pessoas surdas o direito ao acesso à informação, comunicação e atendimento acessível nos serviços públicos e de saúde.","Aceitável, desde que o médico entregue o termo de consentimento em inglês.","Correta, pois a Lei 10.436/2002 revogou o direito a intérpretes em hospitais.","Permitida apenas em hospitais particulares."],"c":1,"x":""},{"t":"C","e":"Uma fonoaudióloga utiliza simultaneamente a fala oral, gestos naturais, alfabeto manual e sinais soltos da Libras na estrutura sintática do português para tentar se comunicar com uma criança surda. Essa prática corresponde a qual abordagem educacional/comunicacional?","a":["Oralismo puro.","Comunicação Total.","Bilinguismo.","Exclusão histórica.","Método fônico."],"c":1,"x":""},{"t":"M","e":"Na fase histórica da Segregação (assistencialismo), como as pessoas surdas e com deficiência eram tratadas pela sociedade?","a":["Eram plenamente incluídas no mercado de trabalho e nas universidades.","Eram frequentemente abandonadas por suas famílias e deixadas isoladas em instituições/asilos fora do convívio social.","Tinham direito a intérpretes em todos os tribunais e hospitais.","Eram obrigadas a cursar ensino bilíngue.","Recebiam implante coclear gratuito pelo Estado."],"c":1,"x":""},{"t":"C","e":"Na apresentação da Cartilha de Libras em Medicina e Saúde (Capovilla & Raphael, 2022), cita-se o programa PANDESB, que avaliou 9.200 surdos de 15 estados brasileiros e comprovou cientificamente que os surdos se desenvolvem mais e melhor em qual modelo educacional?","a":["Escolas exclusivamente oralistas.","Escolas bilíngues (Libras como L1 e Português escrito como L2).","Instituições de segregação asilar.","Salas comuns sem qualquer apoio em Libras.","Ensino domiciliar sem contato com outros surdos."],"c":1,"x":""}]},{"id":"L6","lbl":"Aula 6","title":"Vocabulário Clínico e Cartilha de Libras em Medicina e Saúde","qs":[{"t":"M","e":"Na Cartilha de Libras em Medicina e Saúde (Capovilla & Raphael, 2022), como é executado o sinal de HOSPITAL?","a":["Mãos em \"S\" girando ao lado da cabeça.","Mão em \"1\", palma para a esquerda, lateral do dedo indicador tocando a testa, flexionando o dedo indicador (desenhando uma cruz na testa).","Mão aberta tocando o lado esquerdo e direito do peito.","Mãos em \"X\" batendo um indicador no dorso do outro.","Mão em \"B\" tocando o dorso na testa."],"c":1,"x":""},{"t":"M","e":"Qual é a diferença conceitual entre Sinal e Sintoma destacada na página 28 da Cartilha de Libras em Medicina e Saúde?","a":["Sintoma é medido pelo aparelho de pressão, enquanto sinal é sentido apenas pelo paciente.","Sinal é qualquer alteração percebida ou medida por outra pessoa (como o profissional de saúde, ex.: febre no termômetro, palidez), enquanto sintoma é a queixa subjetiva percebida e relatada apenas pelo próprio paciente (ex.: dor, tontura, enjoo).","Não existe diferença médica entre sinal e sintoma.","Sintoma refere-se apenas a doenças infecciosas, e sinal a doenças crônicas.","Sinal é exclusivo da Libras, e sintoma é exclusivo do Português."],"c":1,"x":""},{"t":"C","e":"Um paciente surdo chega ao pronto-socorro e executa os seguintes sinais: primeiro, toca o dorso da mão em \"B\" na testa (FEBRE); em seguida, toca a palma dos dedos na nuca (MENINGITE); por fim, coloca a mão fechada sob o queixo e a abre para frente abrindo a boca com expressão de enjoo (VÔMITO). Qual é a principal hipótese diagnóstica que requer isolamento imediato?","a":["Rinite alérgica.","Meningite.","Cálculo renal.","Labirintite.","Torcicolo."],"c":1,"x":""},{"t":"M","e":"Como é executado o sinal de MÉDICO(A) na variação mais utilizada em São Paulo e diversas especialidades na Cartilha (ex.: consultório médico, cardiologista, dermatologista)?","a":["Mão esquerda em \"X\", palma para baixo, e mão direita em \"X\" vertical, tocando a ponta do indicador direito no dorso do indicador esquerdo várias vezes.","Mãos em \"L\" tocando o centro da testa até as orelhas.","Mão em \"A\" fazendo pequenos círculos próximos à boca.","Mãos abertas tocando as duas orelhas simultaneamente.","Mãos abertas diante da face movendo-se alternadamente para frente e para trás."],"c":0,"x":""},{"t":"M","e":"Qual profissional da saúde é sinalizado colocando-se as mãos em \"L\" tocando-se pelas pontas dos polegares no centro da cabeça e movendo-as para baixo até as orelhas (fazendo referência à antiga touca/véu)?","a":["Dentista.","Enfermeira.","Psicólogo(a).","Fonoaudiólogo(a).","Técnico(a) em radiologia."],"c":1,"x":""},{"t":"C","e":"Uma paciente surda relata ao médico clínico geral os seguintes sinais em Libras: passa as pontas dos dedos em \"1\" alternadamente em cada narina baixando até o queixo (CATARRO); coloca a mão em \"R\" na lateral do nariz (CONGESTÃO NASAL); e realiza o sinal de GRIPE seguido das mãos verticais abertas com dedos flexionados tocando os seios da face (SINUSITE). Qual estrutura anatômica está inflamada nesse quadro?","a":["As mucosas dos seios da face (cavidades ósseas ao redor do nariz, maçãs do rosto e olhos).","Os alvéolos pulmonares inferiores.","As tonsilas palatinas (amígdalas).","O labirinto no ouvido interno.","A mucosa do duodeno."],"c":0,"x":""},{"t":"M","e":"Na Cartilha, muitos sinais de exames laboratoriais e diagnósticos (como exame de glicemia, exame de fezes, exame de urina, colonoscopia, endoscopia, eletrocardiograma) são compostos por um sinal inicial comum executado com a mão direita em \"1\" tocando a base do pulso esquerdo e movendo-se para frente e para trás. Qual é esse sinal inicial?","a":["CURAR.","PESQUISAR / EXAMINAR.","INTERNAMENTO.","REMÉDIO.","DOR."],"c":1,"x":""},{"t":"C","e":"Um paciente surdo idoso é levado ao hospital pela família. O médico realiza o sinal composto por: sinal de DOENÇA (oscilar dedos direitos sobre o dorso da mão esquerda) seguido do sinal de ESQUECER (mão horizontal aberta com pontas dos dedos unidas deslizando do lado esquerdo para o lado direito da testa). Qual patologia o médico está explicando à família?","a":["Doença de Parkinson.","Mal de Alzheimer.","Acidente Vascular Cerebral (AVC).","Paralisia Cerebral.","Meningite bacteriana."],"c":1,"x":""},{"t":"M","e":"Como é realizado o sinal de FEBRE na Cartilha de Libras em Medicina e Saúde?","a":["Mão em \"F\" girando rapidamente no espaço neutro.","Mão em \"B\" horizontal, palma para frente, com o dorso da mão tocando a testa.","Mão em \"S\" diante da boca aberta simulando tosse.","Mãos em \"A\" nas têmporas descendo com dedos tremulando.","Mão em \"1\" puxando a pálpebra inferior do olho para baixo."],"c":1,"x":""},{"t":"C","e":"Uma mulher surda procura atendimento ginecológico e o médico solicita um exame preventivo. Em Libras, ele executa o sinal de PESQUISAR, seguido pelas mãos em \"X\" vertical movendo-se em arco para os lados opostos (espéculo) e a mão aberta girando a palma para trás duas vezes (coleta). Qual exame foi solicitado?","a":["Mamografia.","Exame de Papanicolau (Citologia Oncótica).","Exame de glicemia.","Colonoscopia.","Audiometria."],"c":1,"x":""},{"t":"M","e":"Na seção de Doenças da aula sobre Diferenças Culturais e da Cartilha, quais sinais compõem o sinal composto de DIABETES?","a":["Sinal de SANGUE + sinal de CÂNCER.","Sinal de AÇÚCAR (mão aberta em círculos diante da boca) + mão em \"X\" passando a ponta do indicador na parte interna do antebraço esquerdo (aplicação de insulina).","Sinal de DOENÇA + sinal de URINA.","Sinal de CORAÇÃO + sinal de PRESSÃO ALTA.","Sinal de ESTÔMAGO + sinal de INCHAÇO."],"c":1,"x":""},{"t":"C","e":"Um paciente surdo chega ao pronto-socorro trazido por familiares. Ele apresenta o sinal de DERRAME CEREBRAL / AVC (mão em \"M\" tocando o lado direito da testa duas vezes, seguido de mãos em \"S\" cruzadas em frente à cabeça abrindo-se com força e expressão contraída). Segundo a descrição clínica da Cartilha (p. 37), se a lesão ocorrer no hemisfério cerebral esquerdo de um paciente surdo, o que pode acontecer?","a":["Apenas perda auditiva transitória no ouvido esquerdo.","Paralisia do lado direito do corpo e distúrbios de compreensão ou produção da língua de sinais (afasia em Libras), além da leitura e escrita.","Aumento da fluência em leitura labial.","Paralisia exclusivamente dos membros inferiores sem alteração linguística.","Melhora imediata da visão periférica."],"c":1,"x":""},{"t":"M","e":"Como se diferencia o sinal de FONOAUDIÓLOGO(A) do sinal de PSICÓLOGO(A) na Cartilha?","a":["Ambos são feitos no peito, mas com configurações diferentes.","Fonoaudiólogo(a) é feito com mãos verticais abertas (palma a palma, dedos curvados) tocando as orelhas; Psicólogo(a) é feito com mãos verticais abertas (palmas para trás) diante da face movendo-se alternadamente para frente e para trás.","Fonoaudiólogo(a) é feito soletrando F-O-N-O; Psicólogo(a) é feito tocando a testa com o dedo indicador.","Fonoaudiólogo(a) é feito com a mão em \"A\" perto da boca; Psicólogo(a) é feito com a mão em \"L\" na testa.","Não há sinal específico para fonoaudiólogo na Cartilha."],"c":1,"x":""},{"t":"C","e":"Após uma cirurgia abdominal, o médico explica ao paciente surdo que ele terá ALTA HOSPITALAR no dia seguinte. Para isso, o médico faz o sinal de LIVRE / SAIR (mão direita em \"L\" movendo-se para a direita unindo indicador e polegar) seguido do sinal de HOSPITAL. Além disso, orienta que ele deve REPOUSAR em casa (mãos horizontais abertas tocando o peito e descendo virando as palmas para baixo) e tomar o REMÉDIO (mão direita em \"S\" fazendo círculos horizontais sobre a palma esquerda aberta). Essa sequência de sinais comunica corretamente:","a":["Que o paciente será internado na UTI e submetido a hemodiálise.","Que o paciente receberá alta do hospital, deverá descansar em casa e fazer uso da medicação prescrita.","Que o paciente precisará fazer transfusão de sangue e radioterapia.","Que o paciente está com convulsão e precisa de ambulância.","Que o paciente deve iniciar dieta para emagrecer imediatamente."],"c":1,"x":""},{"t":"M","e":"Na seção de Convênios Médicos da Cartilha (páginas 58-59), como são diferenciados os sinais de PACIENTE CONVENIADO, PACIENTE SUS e PACIENTE PARTICULAR?","a":["Todos usam apenas a soletração manual do nome do hospital.","Todos iniciam com os sinais de PACIENTE + INDIVÍDUO, diferenciando-se no sinal final: engatar os indicadores em \"X\" (convênio), soletrar S-U-S (SUS), ou tocar a ponta do polegar no lado direito do peito (particular).","O sinal de paciente SUS é feito com a mão na testa, e o de paciente particular é feito tocando as orelhas.","Não existem sinais distintos para tipos de cobertura de saúde na Cartilha.","Paciente particular é sinalizado fazendo o sinal de dinheiro no rosto."],"c":1,"x":""}]}]}]},{"id":"s7","name":"CISUS","themes":[{"id":"P","name":"Prova 1","sps":[{"id":"P1","lbl":"Aula 1","title":"Contexto Epidemiológico da Saúde Mental no Brasil e no Mundo","qs":[{"t":"M","e":"No estudo da Carga Global de Doenças (Global Burden of Disease – GBD), utiliza-se uma métrica-síntese para medir o impacto das doenças e lesões sobre a população, considerando tanto a mortalidade prematura quanto os anos vividos com incapacidade. Sobre esses indicadores e o panorama global dos transtornos mentais, assinale a alternativa correta:","a":["O indicador YLL representa os anos vividos com incapacidade, sendo os transtornos mentais a sua principal causa mundial.","O indicador DALY é obtido pela subtração entre os anos perdidos por morte prematura (YLL) e os anos vividos com incapacidade (YLD).","Mais de 80% das pessoas que vivem com transtornos mentais no mundo residem em países de alta renda, devido ao estresse urbano.","Os transtornos mentais são a principal causa mundial de YLD (anos vividos com incapacidade), respondendo por 15,6% (1 em cada 6) desse indicador no mundo.","A incidência de início dos transtornos mentais na população jovem atinge seu pico por volta dos 24 anos de idade."],"c":3,"x":"Os transtornos mentais representam 15,6% (1 em cada 6) dos YLD no mundo, sendo sua principal causa. (A: YLL é morte prematura; B: DALY = YLL + YLD; C: +80% estão em países de baixa/média renda; E: pico aos ~15 anos)."},{"t":"M","e":"Sobre o perfil epidemiológico do suicídio no Brasil e suas diferenças de gênero descritas na literatura, assinale a alternativa correta:","a":["As mulheres apresentam risco de morrer por suicídio de 2 a 4 vezes maior que os homens, devido à maior prevalência de transtornos de humor.","Os homens apresentam maior prevalência de ideação, planejamento e tentativas de suicídio, enquanto as mulheres têm maiores taxas de suicídio consumado.","Estima-se que, para cada morte por suicídio, ocorram cerca de 20 tentativas (o \"Iceberg\" do suicídio), e até 90% das pessoas que morreram apresentavam algum transtorno mental, sendo a depressão o mais frequente.","No Brasil, o suicídio representa a principal causa de morte entre adolescentes de 15 a 19 anos e a segunda causa entre jovens de 20 a 29 anos.","O Brasil ocupa o 1º lugar nas Américas em número absoluto de suicídios e o 1º na América Latina em crescimento anual das taxas."],"c":2,"x":"O \"Iceberg\" estima 20 tentativas por óbito, e até 90% dos óbitos têm transtorno mental associado, destacando-se a depressão. (A e B: mulheres tentam mais, homens morrem 2 a 4x mais; D: 2ª causa entre 15-19 anos e 4ª entre 20-29 anos; E: 2º nas Américas em número absoluto e 4º na América Latina em crescimento)."},{"t":"M","e":"Acerca dos fundamentos e princípios da Estratificação de Risco em Saúde Mental no SUS, assinale a alternativa incorreta:","a":["A proposta baseia-se na noção de risco presente naquele momento, e não na delimitação de diagnósticos psiquiátricos por meio de escalas ou escores.","A clínica é soberana, o que significa que o conhecimento do caso, do território, da rede, do vínculo e das relações psicossociais sempre prevalece.","Desigualdades sociais interferem diretamente no risco: um usuário em crise sem apoio social apresenta maior grau de risco que outro com retaguarda familiar.","A estratificação de risco deve ser aplicada exclusivamente durante consultas médicas agendadas nos serviços especializados (CAPS).","As três etapas sucessivas da estratificação consistem na avaliação de sinais e sintomas, identificação de fatores de risco/ proteção e definição do equipamento e conduta."],"c":3,"x":"A estratificação é aplicável em qualquer ponto de contato com o usuário (acolhimento, consultas, crises, matriciamento)."},{"t":"M","e":"De acordo com a organização da Rede de Atenção Psicossocial (RAPS) e os parâmetros populacionais das modalidades de Centros de Atenção Psicossocial (CAPS) apresentados na Aula 1, assinale a associação correta:","a":["CAPS I: municípios acima de 15 mil habitantes; atende exclusivamente adultos com transtornos mentais graves.","CAPS II: municípios acima de 70 mil habitantes; funcionamento 24 horas, inclusive fins de semana e feriados, com acolhimento noturno.","CAPS III: municípios acima de 150 mil habitantes; funcionamento 24 horas, inclusive fins de semana e feriados, com acolhimento noturno.","CAPS i: municípios acima de 15 mil habitantes; voltado para crianças e adolescentes em situação de uso prejudicial de álcool e drogas.","CAPSad III: municípios acima de 70 mil habitantes; funcionamento em horário comercial para pessoas em uso prejudicial de álcool e outras drogas."],"c":2,"x":"CAPS III funciona 24h com acolhimento noturno em municípios >150 mil habitantes. (A: CAPS I atende todas as idades; B: CAPS II não é 24h; D: CAPS i >70 mil hab. para sofrimento psíquico; E: CAPSad III >150 mil hab. e é 24h)."},{"t":"M","e":"Considerando a relação entre prevalência, grau de complexidade e custos dos cuidados em saúde mental no SUS (adaptado de IASC, 2007), assinale a afirmação verdadeira:","a":["Quanto maior a frequência de necessidade de cuidado na população, maior é a complexidade tecnológica exigida pelo serviço.","Vivências afetivas e eventos de vida adversos apresentam baixa frequência na população e exigem alta densidade tecnológica hospitalar.","Crises e quadros agudos decorrentes de transtornos mentais situam-se na base da pirâmide, sendo atendidos prioritariamente pela Rede Ampliada de esporte e lazer.","A Atenção Básica (UBS, CECCO, Consultório na Rua) apresenta maior quantidade de equipamentos e menor custo por atendimento em comparação à Atenção Hospitalar.","O acompanhamento do Projeto Terapêutico Singular (PTS) é atribuição exclusiva da Rede de Urgência e Emergência (UPA e PS)."],"c":3,"x":"Na pirâmide do cuidado, a Atenção Básica tem maior quantidade de equipamentos, maior frequência de necessidade e menor custo/complexidade que a Atenção Hospitalar."},{"t":"C","e":"Durante uma reunião de planejamento escolar, a equipe de saúde da família de um município brasileiro discute estratégias para reduzir a incidência de transtornos mentais na adolescência. A médica da equipe explica que há uma janela crítica do neurodesenvolvimento em que a prevenção proativa deve ser priorizada por meio de clínicas integradas à escola e plataformas baseadas em evidências. Com base nos dados do GBD 2021, qual faixa etária deve ser o alvo prioritário dessa prevenção proativa e qual a justificativa neurobiológica dessa vulnerabilidade?","a":["6 a 9 anos; amadurecimento precoce do córtex pré-frontal em relação às áreas sensoriais.","10 a 14 anos; desenvolvimento assíncrono entre o sistema límbico (emoções), que amadurece antes, e o córtex pré-frontal (controle de impulsos e decisões).","15 a 19 anos; degeneração fisiológica das conexões límbico-corticais associada à puberdade tardia.","18 a 24 anos; hiperatividade do córtex pré-frontal inibindo a resposta emocional do sistema límbico.","10 a 14 anos; atraso na mielinização do sistema límbico frente à hipermaturação do córtex pré-frontal."],"c":1,"x":"Janela de 10 a 14 anos, marcada pelo amadurecimento precoce do sistema límbico frente ao córtex pré-frontal."},{"t":"C","e":"No acolhimento inicial de uma UBS, comparecem dois pacientes no mesmo turno, ambos apresentando quadro agudo de sofrimento psíquico intenso e ideação suicida sem planejamento imediato. O Paciente X mora com os pais e a irmã, que se mostram acolhedores e dispostos a supervisioná-lo integralmente. O Paciente Y encontra-se em situação de rua, sem vínculos familiares ou rede de apoio comunitária. Aplicando os princípios da Estratificação de Risco em Saúde Mental, qual a conduta mais adequada da equipe?","a":["Classificar ambos com o mesmo grau de risco, visto que o diagnóstico sindrômico e os sintomas apresentados são idênticos.","Atribuir grau de risco maior ao Paciente Y, pois os determinantes e desigualdades sociais (ausência de suporte familiar/social) agravam sua vulnerabilidade e exigem maior intensidade de cuidado.","Aplicar uma escala diagnóstica psiquiátrica validada para definir quem deve ser encaminhado ao CAPS e quem deve retornar para casa.","Priorizar o Paciente X para vaga de internação hospitalar, pois a presença de familiares facilita o trâmite burocrático de alta.","Encaminhar ambos imediatamente para o Pronto-Socorro geral, já que a UBS não possui atribuição para estratificar risco em saúde mental."],"c":1,"x":"Pelo princípio de que \"desigualdades sociais importam\", a ausência de retaguarda familiar/social aumenta o risco do Paciente Y."},{"t":"C","e":"Um homem de 68 anos, aposentado, viúvo há 6 meses e morando sozinho, é levado à consulta na UBS pela vizinha, que notou seu isolamento progressivo e emagrecimento. O paciente relata tristeza profunda e desesperança, mas recusa acompanhamento psicológico por considerar que \"isso é coisa de quem não tem força de vontade\". Considerando os determinantes e o perfil epidemiológico do suicídio no Brasil, qual avaliação clínica está correta?","a":["O risco de suicídio consumado é baixo, pois homens idosos tendem a realizar muitas tentativas sem letalidade para chamar atenção.","O paciente reúne múltiplos fatores de risco de alta gravidade: sexo masculino, faixa etá
