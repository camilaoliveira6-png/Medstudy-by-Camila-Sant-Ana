<style>
:root{--navy:#102b3f;--blue:#176b87;--teal:#27a38a;--ink:#172b3a;--muted:#657786;--paper:#f4f7f9;--line:#e1e8ed;--white:#fff;--good:#16835d;--bad:#c44e4e;--shadow:0 12px 35px rgba(20,45,62,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
header{background:linear-gradient(120deg,#102b3f,#176b87);color:white;padding:28px max(22px,calc((100vw - 1180px)/2)) 25px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:#ffffff20;display:grid;place-items:center;font-size:23px}
h1{font-size:clamp(23px,4vw,32px);margin:0;letter-spacing:-.7px}.sub{color:#d6e7ee;margin:5px 0 0;font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.stat{background:#ffffff16;border:1px solid #ffffff24;padding:8px 13px;border-radius:12px;font-size:13px}.stat b{font-size:16px;margin-right:4px}
main{max-width:1180px;margin:26px auto;padding:0 18px 50px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px}
.panel,.workspace{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.sidebar{padding:18px;height:max-content;position:sticky;top:16px}.side-title{font-weight:750;font-size:14px;margin:0 0 12px}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;margin-bottom:14px;outline-color:var(--blue)}
.nav{display:flex;flex-direction:column;gap:5px;max-height:62vh;overflow:auto}.nav button{border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;color:var(--ink);font:inherit;cursor:pointer}.nav button:hover{background:#f1f6f8}.nav button.active{background:#e8f3f6;color:#125b75;font-weight:700}.nav small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#82919b;font-weight:800;padding:14px 9px 4px}
.workspace{padding:clamp(18px,3vw,30px);min-height:550px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);font-weight:800}.heading{font-size:clamp(21px,3vw,27px);letter-spacing:-.5px;margin:3px 0 4px}.muted{color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 18px}
select,.btn{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:white;color:var(--ink);cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:disabled{opacity:.4;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(.97)}
.progress-wrap{height:7px;background:#edf1f4;border-radius:20px;overflow:hidden;margin:17px 0 7px}.progress{height:100%;background:var(--teal);width:0%;transition:width .2s}.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.question{font-size:18px;font-weight:700;line-height:1.5;margin:24px 0 17px;white-space:pre-line}.option{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:inherit;cursor:pointer;transition:.15s}.option:hover:not(:disabled){border-color:#7baebd;background:#f7fbfc}.letter{flex:0 0 27px;height:27px;border-radius:8px;background:#eef3f6;display:grid;place-items:center;font-size:12px;font-weight:800}.option.correct{border-color:#62b99a;background:#effaf5}.option.correct .letter{background:#d5f1e4;color:#126b4c}.option.wrong{border-color:#df8b8b;background:#fff5f5}.option.wrong .letter{background:#f8dddd;color:#a23b3b}.option:disabled{cursor:default}
.explanation{margin-top:16px;padding:15px 16px;border-radius:12px;background:#f0f6f8;border-left:4px solid var(--blue);font-size:14px}.explanation.good{background:#effaf5;border-color:var(--good)}.explanation.bad{background:#fff5f5;border-color:var(--bad)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}.actions .right{display:flex;gap:8px}
.empty{padding:45px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}
.results{padding:24px;border-radius:15px;background:#f1f7f8;margin-top:20px}.score{font-size:38px;font-weight:850;color:var(--blue);letter-spacing:-1px}
footer{text-align:center;color:#82919b;font-size:12px;padding:0 15px 25px}
@media(max-width:800px){main{grid-template-columns:1fr;margin-top:16px}.sidebar{position:static}.nav{max-height:210px}.workspace{min-height:500px}}
@media(max-width:460px){header{padding:22px 17px}.stats{gap:7px}.stat{font-size:12px;padding:7px 9px}.workspace{padding:17px}.question{font-size:16px}}
</style>
