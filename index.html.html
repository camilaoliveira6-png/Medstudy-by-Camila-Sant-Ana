e ou do início de mecanismos que levam a crises anormalmente prolongadas, com risco de lesão ou alteração neuronal de longo prazo (nas crises tônico-clônicas, considera-se a partir de cerca de 5 minutos de atividade contínua). Crises psicogênicas não têm correlato elétrico epiléptico; crises febris ou autolimitadas breves não configuram EME; e uma crise isolada em paciente epiléptico também não."},{"t":"P","e":"O tromboembolismo pulmonar (TEP) agudo é uma doença relativamente comum, potencialmente fatal e que requer diagnóstico rápido e preciso. O seu tratamento apropriado, quando instituído, é altamente eficaz, reduzindo o risco de recorrência e, consequentemente, de mortalidade. O diagnóstico e o tratamento da embolia pulmonar exigem uma abordagem multidisciplinar, combinando especialidades médicas clínicas, cirúrgicas e radiológicas. Apesar dos avanços substanciais, as taxas de mortalidade e recorrência permanecem elevadas, porém, quando devidamente diagnosticada e tratada, a embolia pulmonar é rara causa de morte, com recorrência em apenas uma pequena minoria de pacientes. MENDONÇA, A. T. B.; LIMA, N. A. Protocolo embolia pulmonar: suspeita clínica e tratamento. Rev. Med.UFC. 2017;57(3):77-86.\nSobre o tromboembolismo pulmonar (TEP), julgue as afirmativas a seguir.\nI. As manifestações clínicas na TEP exibem de quadros oligossintomáticos até situações graves, como insuficiência respiratória aguda, instabilidade hemodinâmica e morte súbita.\nII. Na TEP, a dispneia é bastante frequente, podendo se manifestar subitamente ou evoluir por horas ou dias.\nIII. Estão entre os principais fatores de risco para TEP: idade superior a 65 anos, obesidade, tabagismo, trauma, imobilização, pós-operatório e viagem de longa distância.\nEstá correto o que se afirma em","a":["I, II e III.","I, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas."],"c":0,"x":"Todas as afirmativas estão corretas. I: o TEP vai de formas pouco sintomáticas a insuficiência respiratória, choque e morte súbita. II: a dispneia é o sintoma mais frequente, de início súbito ou progressivo em horas a dias. III: os fatores de risco refletem a tríade de Virchow (estase, lesão endotelial e hipercoagulabilidade): idade avançada, obesidade, tabagismo, trauma, imobilização, pós-operatório e viagens longas."},{"t":"P","e":"A anemia ferropriva é a anemia nutricional mais comum no mundo, frequentemente associada a níveis reduzidos de ferro sérico. O achado mais comum no esfregaço periférico como consequência direta da fisiopatologia desta condição é","a":["Micróticos e dacriócitos.","Formações de corpúsculos de Heinz.","Predominância de células microcíticas e hipocrômicas.","Anisocitose e macrocitose proeminente.","Presença de esferócitos e reticulocitose acentuada."],"c":2,"x":"A falta de ferro reduz a síntese de hemoglobina, gerando hemácias pequenas (microcíticas) e pálidas (hipocrômicas), com anisocitose (RDW aumentado). Corpúsculos de Heinz aparecem na deficiência de G6PD e em hemoglobinas instáveis; macrocitose ocorre nas anemias megaloblásticas; esferócitos e reticulocitose, nas anemias hemolíticas; dacriócitos são mais típicos de mielofibrose e talassemias."},{"t":"P","e":"Leia as afirmações abaixo e escolha a alteranativa correta:\nI. Pacientes em surto psicótico podem apresentar delírios e alucinações, mas o curso clínico desses sintomas ajuda a diferenciar esquizofrenia de transtorno bipolar.\nII. Na esquizofrenia, os sintomas psicóticos estão frequentemente dissociados de episódios de alteração do humor, enquanto no transtorno bipolar eles geralmente ocorrem em associação com episódios maníacos ou depressivos.","a":["A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas.","As asserções I e II são proposições verdadeiras, e a II é uma justificativa da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa da I."],"c":4,"x":"As duas asserções são verdadeiras: delírios e alucinações ocorrem em ambas as doenças, e o curso (relação temporal com os episódios de humor) ajuda a distingui-las; na esquizofrenia os sintomas psicóticos persistem independentemente do humor, enquanto no transtorno bipolar tendem a ocorrer durante episódios maníacos ou depressivos. Porém, a II apenas descreve uma característica diferencial e não explica a I — por isso o gabarito é a alternativa em que a II não é justificativa da I."},{"t":"P","e":"Aneurismas são dilatações segmentares da parede arterial que superam em mais de 50% o seu diâmetro máximo normal. Os aneurismas da aorta torácica (AAT) apresentam uma incidência em torno de 10/100 mil indivíduos/ano, a maioria (95%) assintomáticos e de etiologia principalmente degenerativa. A aorta é anatomicamente subdividida em torácica e abdominal. A aorta torácica é composta de três partes: porção ascendente, arco e porção descendente. A porção ascendente é limitada do ânulo aórtico ao tronco braquiocefálico. O arco aórtico representa a porção aórtica entre o tronco braquiocefálico e a subclávia esquerda. A porção descendente inicia-se após a subclávia esquerda e termina ao nível do diafragma, onde passa a ser considerada aorta abdominal. A maioria dos aneurismas da aorta torácica (60%) está limitada à porção ascendente, 10% ao arco e 30% à porção descendente (AATD). O conhecimento anatômico é relevante, pois as abordagens terapêuticas dos aneurismas variam de acordo com o segmento acometido. Disponível em: https://portalarquivos2.saude.gov.br/images/pdf/2019/janeiro/14/Endopr--tese-em-Aorta-T or--cica-Descendente.2019.pdf. Acesso em: 22 out. 2019.\nSobre os tipos de tratamentos dos AATD, julgue os itens a seguir.\nI. Em geral, o tratamento pode englobar mudanças no estilo de vida, uso de medicamentos e cirurgia, tendo como objetivo impedir o rompimento arterial, um evento com alta letalidade.\nII. A cirurgia é recomendada para pacientes sintomáticos ou com complicações associadas ao aneurisma da aorta torácica descendente. Já em assintomáticos, a indicação do reparo é dependente do diâmetro, da localização e da taxa de expansão do aneurisma.\nIII. Em relação à cirurgia aberta, o procedimento endovascular está associado a uma menor taxa de mortalidade operatória e a um menor tempo de permanência no hospital, sendo o procedimento indicado mesmo na existência de inviabilidade anatômica.\nÉ correto o que se afirma em","a":["I e II, apenas.","I, II e III.","I, apenas.","(texto não visível na foto original)","(texto não visível na foto original)"],"c":0,"x":"I e II estão corretas: o manejo combina controle de fatores de risco, medicamentos (principalmente controle pressórico) e reparo cirúrgico/endovascular, com o objetivo de evitar a ruptura; o reparo é indicado em sintomáticos ou complicados e, nos assintomáticos, conforme diâmetro, localização e velocidade de crescimento. III está errada: o reparo endovascular tem menor mortalidade operatória e menor internação, mas só pode ser feito se a anatomia for favorável (zonas de ancoragem adequadas); havendo inviabilidade anatômica, não é o procedimento indicado."},{"t":"P","e":"Síncope é um sintoma definido como a perda súbita e transitória da consciência secundária à hipoperfusão cerebral difusa. Normalmente, apresenta início súbito, curta duração e recuperação espontânea (síncope vasovagal). Entretanto, em pacientes com doenças do coração (infarto, problemas nas válvulas, coração dilatado), o desmaio pode ser decorrente de arritmias graves (síncope cardíaca), requerendo atenção imediata. O tratamento da síncope vasovagal é feito com medidas gerais (aumentar a ingestão de sal e água), medicamentos e exercícios físicos específicos (reabilitação autonômica). Casos muito rebeldes e severos, como em síncopes cardíacas, o tratamento é direcionado à doença de base, podendo ser necessário um implante de marcapasso ou desfibrilador. LUDOVICE, Ana Cristina et al. Síncope em pacientes com extra-sístoles de via de saída de ventrículo direito e sem cardiopatia estrutural aparente. Arq. Bras. Cardiol. 2006, v.87, n.5, pp.570-574 (adaptado).\nSobre o tratamento da síncope, analise as afirmações a seguir.\nI. É de suma importância a identificação da causa do desmaio para estabelecer o tratamento ideal para o caso analisado, visto que existem diferentes fatores de gatilho para o distúrbio e alguns tipos de síncope são mais graves que outros.\nII. A utilização do marca-passo para casos de síncope cardíaca auxiliará na regulação dos batimentos cardíacos, porém não curará a doença.\nIII. Em casos de síncope vasovagal são orientadas manobras comportamentais preventivas, ingestão de sódio e hidratação.\nEstá correto o que se afirma em","a":["I, apenas.","II, apenas.","III, apenas.","I e III, apenas.","I, II e III."],"c":4,"x":"Todas as afirmativas estão corretas. I: a causa define a conduta e o prognóstico (a síncope vasovagal é benigna; a cardíaca pode ser grave). II: o marca-passo trata a bradiarritmia/bloqueio que causa o sintoma, mas não cura a cardiopatia de base. III: na síncope vasovagal orientam-se medidas comportamentais (evitar gatilhos, manobras físicas de contrapressão, deitar ao pré-sintoma), aumento da ingestão de sal e água e hidratação."},{"t":"P","e":"Durante o atendimento em unidade de emergência, um homem de 42 anos, previamente hígido, procura o serviço devido a dor lombar de forte intensidade. Após a administração endovenosa de um analgésico antipirético, o paciente evolui em poucos minutos com sensação de calor generalizado, eritema difuso, prurido intenso e desconforto respiratório progressivo, acompanhado de tontura e sudorese fria. Logo em seguida, apresenta queda acentuada da pressão arterial, palidez cutânea, confusão mental e redução do nível de consciência. Ao exame físico, evidencia-se taquicardia importante (FC 132 bpm), hipotensão (PA 70/40 mmHg), taquipneia (FR 30 irpm) e saturação periférica de oxigênio em 86% em ar ambiente. Observam-se sibilos difusos à ausculta pulmonar e lesões eritematopapulosas em tronco e membros superiores. O diagnóstico mais provável e a conduta inicial imediata são, respectivamente:","a":["anafilaxia grave – iniciar corticoterapia endovenosa e expansão volêmica vigorosa.","broncoespasmo agudo secundário a reação medicamentosa – administrar salbutamol inalatório e oxigênio suplementar.","reação alérgica sistêmica – iniciar anti-histamínico e monitorização contínua e suspender o fármaco.","choque anafilático – administrar adrenalina intramuscular na face ântero-lateral da coxa.","choque anafilático – administrar adrenalina 1 mg em bolus endovenoso."],"c":3,"x":"O quadro (exposição a fármaco endovenoso, prurido, eritema, broncoespasmo, hipotensão, hipoxemia e rebaixamento de consciência) é de choque anafilático. A conduta imediata e de primeira linha é adrenalina intramuscular na face ântero-lateral da coxa (cerca de 0,3 a 0,5 mg em adultos), seguida de oxigênio, volume e medidas adjuvantes. Corticoide, anti-histamínico e salbutamol são adjuvantes e não substituem a adrenalina; o bolus endovenoso de 1 mg é dose de parada cardiorrespiratória, não de anafilaxia com pulso."},{"t":"P","e":"O eletrocardiograma (ECG) registra a atividade elétrica do coração. Para conseguirmos entender o ECG, precisamos, antes de qualquer coisa, reconhecer os eventos, que são registrados no traçado eletrocardiográfico. O ECG registra a atividade de despolarização dos átrios (onda P), a despolarização dos ventrículos (complexo QRS) e a repolarização dos ventrículos (onda T), além dos intervalos e segmentos existentes entre esses eventos (conforme figura).\nMALLET, Ana Luisa Rocha; MUXFELDT, Elizabeth Silaid. Eletrocardiograma: da graduação à prática clínica. São Paulo: Thieme Revinter, 2019.\nSobre o texto em tela e o registro do eletrocardiograma, julgue as afirmações a seguir.\nI. O complexo QRS normal deve ser estreito, ou seja, inferior a 0,12 segundo, assinalando que a ativação ventricular ocorreu pelo sistema preferencial de condução (feixe de His e suas ramificações).\nII. Em relação à onda T, a qual corresponde à repolarização ventricular, vide texto, deve-se observar a sua morfologia e polaridade, que deve ser, em geral, negativa.\nIII. O tempo medido do final do complexo QRS ao início da onda T corresponde ao segmento ST. Para avaliar esse segmento, deve-se observar se é isoelétrico ou se está elevado ou deprimido.\nEstá correto o que se afirma em","a":["I e III, apenas.","III, apenas.","I, II e III.","I e II, apenas.","(texto não visível na foto original)"],"c":0,"x":"I está correta: QRS < 0,12 s indica ativação ventricular pelo sistema His-Purkinje. II está errada: a onda T normal é, em geral, positiva (é negativa em aVR e pode ser negativa em V1 e DIII). III está correta: o segmento ST vai do fim do QRS ao início da onda T e deve ser isoelétrico; avalia-se supra ou infradesnivelamento."},{"t":"P","e":"Quando moderada e grave, a cetoacidose diabética (CAD) deve ser tratada em unidade de terapia intensiva e, fundamentalmente, por profissionais habilitados nesse tipo de complicação. É importante salientar que, durante muitos anos, considerou-se a CAD uma complicação específica do DM1. Na literatura, entretanto, encontram-se vários relatos de CAD em indivíduos com DM2, inclusive em pacientes idosos acima de 70 anos. Antes do advento da insulina, a taxa de mortalidade por CAD oscilava em torno de 90%. Da década de 1950 em diante, com a evolução de todo o arsenal terapêutico, como antibioticoterapia, ênfase no processo de hidratação, controle eletrolítico e uso de insulina regular, essa taxa foi reduzida para aproximadamente 10%. OLIVEIRA, José Egídio Paulo de et al. (orgs.). Diretrizes da Sociedade Brasileira de Diabetes 2017-2018. São Paulo: Editora Clannad, 2017.\nSobre o tratamento da CAD, julgue as afirmativas a seguir.\nI. A insulinoterapia deverá ser iniciada o mais rápido possível, independente dos níveis sanguíneos de potássio.\nII. Para correção da acidose, é recomendado o uso do bicarbonato de sódio para pacientes adultos com acidose e pH < 6,9.\nIII. Para pacientes com funções cardíaca e renal normais, a desidratação deverá ser corrigida com infusão salina isotônica de cloreto de sódio 0,9%, em média 15 a 20 mL/kg na primeira hora.\nIV. Na hipofosfatemia leve, é recomendada rotineiramente a reposição com sais de fosfato.\nÉ correto o que se afirma em","a":["I, II e III, apenas.","II e III, apenas.","II, III e IV, apenas.","I, II, III e IV.","(texto não visível na foto original)"],"c":1,"x":"I está errada: com potássio < 3,3 mEq/L a insulina deve ser adiada até a reposição de potássio, pelo risco de arritmias. II está correta: bicarbonato é recomendado em adultos com pH < 6,9. III está correta: hidratação inicial com NaCl 0,9%, em média 15 a 20 mL/kg na primeira hora. IV está errada: a reposição de fosfato não é rotineira na hipofosfatemia leve; é reservada para casos graves ou com situações específicas (disfunção cardíaca, anemia, depressão respiratória)."},{"t":"P","e":"O choque anafilático é causado por uma reação alérgica grave quando um paciente que já produziu anticorpos para uma substância não-própria (antígeno) desenvolve uma reação antígeno-anticorpo sistêmica. Esse processo exige que o paciente tenha sido previamente exposto à substância. Uma reação antígeno-anticorpo faz com que os mastócitos liberem substâncias vasoativas potentes, como a histamina ou a bradicinina, que geram a vasodilatação e a permeabilidade disseminadas. O choque anafilático ocorre com rapidez e comporta risco de vida. SMELTZER, Suzanne C; BARE, Brenda G. Brunner & Suddarth: tratado de enfermagem médico-cirúrgica. 10. ed. Rio de Janeiro: Guanabara Koogan, 2005, p. 331.\nEm relação ao tratamento do choque anafilático, analise as afirmativas abaixo.\nI. Os medicamentos nebulizados, como o albuterol (Proventil), podem ser fornecidos para reverter o broncoespasmo induzido pela histamina.\nII. O tratamento do choque anafilático requer a remoção do antígeno causal e a administração de medicamentos que restaurem o tônus vascular.\nIII. A heparina em dose baixa e o warfarin em dose baixa podem ser prescritos e administrados por via subcutânea, até que o paciente esteja deambulando.\nIV. Se a parada cardíaca e a parada respiratória são iminentes ou já aconteceram, realiza-se a reanimação cardiopulmonar, e a intubação endotraqueal pode ser necessária.\nÉ correto o que se afirma em","a":["I, II e IV, apenas.","II e III, apenas.","II, III e IV, apenas.","I, II, III e IV.","I e II, apenas."],"c":0,"x":"I está correta: broncodilatadores nebulizados (como salbutamol/albuterol) tratam o broncoespasmo. II está correta: remove-se o agente causal e restauram-se o tônus vascular e a volemia (adrenalina, volume, vasopressores se necessário). III está errada: heparina e warfarin são usados para profilaxia/tratamento de trombose e não fazem parte do tratamento do choque anafilático (além de o warfarin não ser administrado por via subcutânea). IV está correta: havendo parada iminente ou instalada, realiza-se reanimação cardiopulmonar e, se necessário, intubação."},{"t":"P","e":"O professor bilíngue é um professor com formação em curso superior de pedagogia ou em licenciatura específica que atua no processo de ensino-aprendizagem em escolas bilíngues. No país, muitas escolas têm se organizado como escolas bilíngues, principalmente nos pares linguísticos inglês/português e francês/português. No âmbito da educação de surdos, a educação bilíngue Libras/português ganha força com a regulamentação da Lei de Libras, por meio do Decreto nº 5.626/05. LACERDA, C. B. F.; ALBRES, N. A.; GRAGO, S. L. S. Política para uma educação bilíngue e inclusiva a alunos surdos no município de São Paulo. Educação e Pesquisa, v. 39, n. 1, p. 65-80, 2013 (adaptado).\nDado o exposto, considere a situação a seguir. Tânia está se preparando para participar de um processo seletivo para atuar como professora de Língua Brasileira de Sinais (Libras). Uma das etapas do processo consiste em uma entrevista oral, em que ela deverá apresentar informações sobre a Libras. Com base na situação descrita, avalie os itens a seguir sobre o que Tânia pode dizer a respeito da Libras durante a entrevista.\nI. Tânia pode afirmar que a Libras é uma forma de expressão e comunicação, um sistema linguístico com estrutura gramatical própria.\nII. A candidata pode explicar que a legislação reconhece a Libras como meio legal de comunicação e expressão e pontua que ela não pode substituir a língua portuguesa na modalidade escrita.\nIII. Tânia pode salientar que a Libras é composta por parâmetros e que o conhecimento sobre esses parâmetros auxilia os discentes no processo de aprendizagem e ampliação de vocabulário.\nÉ correto o que se afirma em","a":["III, apenas.","I, apenas.","II e III, apenas.","I, II e III.","(texto não visível na foto original)"],"c":3,"x":"As três afirmativas estão corretas. I: a Libras é uma língua com sistema linguístico e gramática próprios. II: a Lei nº 10.436/2002 reconhece a Libras como meio legal de comunicação e expressão e estabelece que ela não substitui a modalidade escrita da língua portuguesa. III: a Libras é formada por parâmetros (configuração de mão, locação, movimento, orientação da palma e expressões não manuais), e conhecê-los facilita a aprendizagem e a ampliação do vocabulário."},{"t":"P","e":"A Rede de Atenção Psicossocial (RAPS) foi instituída no âmbito do SUS para ampliar o acesso e qualificar o cuidado em saúde mental, articulando diferentes serviços em níveis de complexidade distintos. Sobre os pontos de atenção que a compõem e suas respectivas funções, assinale a alternativa CORRETA:","a":["A RAPS organiza-se apenas no nível hospitalar, sendo o hospital psiquiátrico o ponto de entrada principal do usuário em sofrimento mental, cabendo à Atenção Primária apenas a notificação dos casos.","A RAPS é composta apenas por serviços especializados em psiquiatria, devendo atuar isoladamente das demais redes temáticas do SUS, a fim de evitar sobreposição de responsabilidades assistenciais.","As Unidades de Acolhimento e os CAPS têm função exclusivamente administrativa e de encaminhamento, sendo o cuidado clínico e psicossocial realizado apenas nos hospitais gerais e especializados.","Os pontos de atenção da RAPS incluem a Atenção Primária à Saúde, os CAPS, os serviços de urgência e emergência, os leitos de saúde mental em hospitais gerais, os serviços residenciais terapêuticos, articulando-se em rede territorializada e interdisciplinar.","Os pontos de atenção da RAPS são compostos exclusivamente pelos Centros de Atenção Psicossocial (CAPS) e residências terapêuticas, responsáveis por todas as ações de promoção, prevenção e reabilitação em saúde mental, incluindo internações hospitalares e urgências psiquiátricas."],"c":3,"x":"A RAPS (Portaria GM/MS nº 3.088/2011) é uma rede territorial e interdisciplinar que inclui atenção básica, atenção psicossocial especializada (CAPS), urgência e emergência, atenção residencial de caráter transitório (unidades de acolhimento), leitos de saúde mental em hospital geral e serviços residenciais terapêuticos, além de estratégias de reabilitação psicossocial. Não é hospitalocêntrica, não é isolada das demais redes e CAPS têm função clínica e psicossocial, não apenas administrativa."},{"t":"P","e":"A Reforma Psiquiátrica Brasileira foi um movimento histórico, político e técnico-científico que transformou o modelo de atenção em saúde mental no país. Com base em seus fundamentos, diretrizes e implicações na organização do SUS, assinale a alternativa CORRETA:","a":["A Reforma Psiquiátrica teve como objetivo principal substituir gradualmente os hospitais gerais por manicômios especializados, buscando garantir a segurança social e o isolamento terapêutico dos pacientes em sofrimento psíquico grave.","A Reforma Psiquiátrica restringe o tratamento em saúde mental apenas aos serviços especializados, excluindo a atenção básica e os demais níveis de atenção da Rede de Atenção Psicossocial (RAPS), de modo a preservar a autonomia técnica da psiquiatria.","A Reforma Psiquiátrica Brasileira substituiu o modelo asilar pelo modelo psicossocial, promovendo atenção comunitária, cuidado territorializado, reinserção social e respeito aos direitos humanos, consolidando dispositivos como os CAPS, Serviços Residenciais Terapêuticos no SUS.","A Luta Antimanicomial foi um movimento restrito aos profissionais da psiquiatria hospitalar, com foco técnico na redução de custos públicos e na otimização da gestão hospitalar, sem relação com a defesa de direitos ou participação social.","A Reforma Psiquiátrica propôs a ampliação do número de leitos em hospitais psiquiátricos e a centralização do cuidado em instituições especializadas, com ênfase no controle medicamentoso e na internação prolongada como forma prioritária de tratamento."],"c":2,"x":"A Reforma Psiquiátrica (Lei nº 10.216/2001) propõe a substituição progressiva do modelo asilar/manicomial por um modelo psicossocial de base comunitária e territorial, com CAPS, serviços residenciais terapêuticos, reinserção social e defesa dos direitos humanos. As demais alternativas invertem seus princípios: defendem manicômios, centralização hospitalar, exclusão da atenção básica ou tratam a Luta Antimanicomial como movimento restrito e sem dimensão de direitos."},{"t":"P","e":"No bilinguismo, o objetivo é levar o surdo a desenvolver habilidades, primeiramente em sua língua de sinais natural e, subsequentemente, na língua escrita do país a que pertence. Para Capovilla e Raphael (2001b, p. 1486), “tais habilidades incluem compreender e sinalizar fluentemente em sua língua de sinais, e ler e escrever fluentemente no idioma do país ou cultura em que ele vive”. Todavia, alguns autores, como Quadros e Karnopp (2004), Freitas (2001) e Brito (1993), revelam que existe uma carência de terminologias científicas em LIBRAS, as quais, na maioria das vezes, são substituídas pela datilologia, o que pode interferir na negociação de sentidos dos conceitos científicos por docentes, alunos e intérpretes, dificultando o ensino-aprendizagem de ciências. Nesse sentido, sobre a finalidade da datilologia ou o soletramento do alfabeto manual, julgue os itens a seguir.\nI. Fazem referência a nomes próprios de pessoas ou lugares.\nII. Fazem referência a elementos que não possuem um sinal da LIBRAS ainda.\nIII. Fazem referência a elementos linguísticos que a LIBRAS não compreende.\nIV. Fazem referência às siglas.\nÉ correto apenas o que se afirma em","a":["I, II e IV.","II e III.","III e IV.","I, II e III.","I e IV."],"c":0,"x":"A datilologia (soletração com o alfabeto manual) é usada para nomes próprios de pessoas e lugares, para elementos que ainda não têm sinal estabelecido e para siglas. O item III está errado: a Libras é uma língua completa e a datilologia não indica que ela “não compreenda” elementos linguísticos, mas sim que determinado termo não tem sinal próprio."},{"t":"P","e":"A tosse é um efeito colateral comum no uso de inibidores da enzima conversora de angiotensina devido ao acúmulo de qual substância?","a":["renina","bradicinina","angiotensinogênio","angiotensina I","angiotensina II"],"c":1,"x":"A enzima conversora de angiotensina (ECA) também degrada a bradicinina (cininase II). Ao inibi-la, a bradicinina se acumula nas vias aéreas e provoca a tosse seca, efeito comum dos IECA. Os bloqueadores do receptor AT1 não interferem na degradação da bradicinina e, por isso, raramente causam tosse."},{"t":"P","e":"As doenças crônicas não transmissíveis (DCNT) são responsáveis por cerca de 60% das causas de mortes em todo mundo, afetando cerca de 35 milhões de pessoas por ano e, para a próxima década, espera-se que haja um aumento de 17% na mortalidade causada pelas DCNT. Atualmente, a doença renal crônica (DRC), uma DCNT, tem sido considerada um problema de saúde pública. DCR é um termo geral para alterações heterogêneas que afetam tanto a estrutura, quanto a função renal, com múltiplas causas e múltiplos fatores de prognóstico. Trata-se de uma doença de curso prolongado, insidioso, que, na maior parte do tempo de sua evolução, é assintomática. Muitos fatores estão associados tanto à etiologia quanto à progressão para perda de função renal. Por estes motivos, é importante reconhecer quem são os indivíduos que estão sob o risco de desenvolver a DRC, com o objetivo do diagnóstico precoce, bem como quais são os fatores de pior prognóstico, definidos como aqueles fatores que estão relacionados à progressão mais rápida para perda de função renal. Brasil, Ministério da Saúde. Diretrizes Clínicas para o Cuidado ao paciente com Doença Renal Crônica – DRC no Sistema Único de Saúde/ Ministério da Saúde. Secretaria de Atenção à Saúde.– Brasília: Ministério da Saúde, 2014. p.: 37 p. Adaptado.\nSobre a DRC, julgue as afirmativas a seguir.\nI. Em pacientes com DRC, frequentemente ocorre anemia devido à deficiência de eritropoietina, um hormônio endógeno secretado pelos rins, essencial para a produção das\ncélulas vermelhas.\nII. O aumento da expectativa de vida tem elevado o número de indivíduos com DCV, visto o acúmulo de fatores de risco para a doença que também estão relacionados com a idade, como hipertensão arterial e diabetes.\nIII. Para o diagnóstico da DRC, são utilizados os seguintes recursos: avaliação da taxa de filtração glomerular, estimada por fórmulas baseadas na creatinina sérica; exame de urina, o qual revela alterações parenquimatosas, ou da pesquisa de albuminúria; e avaliação de imagem, preferencialmente por ultrassonografia.\nIV. Uma vez estabelecida a DRC, não é possível prevenir a progressão da doença, assim, todos os pacientes diagnosticados devem ser encaminhados para os serviços especializados em transplante renal.\nÉ correto o que se afirma em","a":["I, II e III, apenas.","I, II, III e IV.","(texto não visível na foto original)","(texto não visível na foto original)","(texto não visível na foto original)"],"c":0,"x":"I está correta: a deficiência de eritropoietina, produzida pelos rins, causa anemia na DRC. II está correta: o envelhecimento e fatores de risco como hipertensão e diabetes elevam a carga de doenças cardiovasculares e renais. III está correta: o diagnóstico usa a taxa de filtração glomerular estimada pela creatinina, exame de urina/albuminúria e imagem (preferencialmente ultrassonografia). IV está errada: a progressão da DRC pode ser retardada (controle da pressão arterial e da glicemia, redução da proteinúria, tratamento das causas), e nem todos os pacientes são encaminhados para transplante."},{"t":"P","e":"A Política Nacional para a População em Situação de Rua (PPSR), instituída pelo Decreto nº 7.053/2009, integra as políticas públicas de promoção da equidade e da cidadania no Brasil. Considerando seus fundamentos e princípios, assinale a alternativa CORRETA:","a":["A PPSR é uma política de caráter assistencialista, voltada exclusivamente ao fornecimento de abrigo e alimentação, sem articulação com os princípios de universalidade e integralidade do Sistema Único de Saúde.","A PPSR busca garantir acesso universal e digno às políticas públicas, promover a intersetorialidade entre saúde, assistência social e habitação, e reconhecer a autonomia e a cidadania das pessoas em situação de rua.","A Política Nacional para a População em Situação de Rua é uma estratégia setorial do Ministério da Saúde, restrita ao atendimento de agravos mentais e dependência química, sem interface com outras áreas sociais.","A Política Nacional para a População em Situação de Rua tem como foco principal o controle social e a fiscalização das pessoas que vivem nas ruas, visando à manutenção da ordem pública e à redução da circulação em espaços urbanos.","A PPSR tem como diretriz central a institucionalização permanente da população em situação de rua, com vistas à proteção integral por meio de internações em instituições filantrópicas e hospitais gerais."],"c":1,"x":"A PPSR (Decreto nº 7.053/2009) é intersetorial e se baseia em princípios como dignidade, respeito à autonomia e à cidadania, atendimento humanizado e universal e articulação entre saúde, assistência social, habitação, trabalho e outras áreas. Não é meramente assistencialista, não se restringe à saúde mental ou à dependência química, não tem foco de controle da ordem pública e não propõe institucionalização permanente."},{"t":"P","e":"Um jovem com 25 anos de idade foi atendido na emergência hospitalar em decorrência de episódio de intoxicação aguda por uma combinação de álcool e drogas que o levaram a ser vítima de atropelamento. Após tratamento ortopédico, recebe alta e inicia acompanhamento em ambulatório de saúde mental. Na consulta, afirma que, apesar do incidente, não pretende deixar de usar drogas ilícitas, que já tentou várias vezes parar de beber sem sucesso e que não tem mais vontade de tentar. Relata que abusa de álcool desde os 12 anos e que todos os seus amigos fazem uso de álcool ou drogas. Não acredita que isto seja uma “anormalidade” e, portanto, não gostaria de ser tratado como “drogado”. Apresenta sintomas depressivos, mas diz que não deseja iniciar medicamento antidepressivo, pois não gosta de tomar medicações. Também relata que mora com os pais e que gostaria que eles acompanhassem suas consultas, para que o médico lhes informasse que ele estava sob o efeito de drogas no momento do acidente. A orientação correta para esse caso requer que se explique ao paciente que","a":["o uso abusivo de drogas e álcool associa-se, frequentemente, a transtornos mentais como depressão e ansiedade, sendo importante a continuidade do tratamento médico, mesmo sem o objetivo de abstinência.","o consumo abusivo de álcool e drogas está intimamente relacionado ao surgimento de doenças mentais graves; portanto, a dificuldade de manter-se abstinente invalida o tratamento.","o objetivo do tratamento médico é a abstinência; a discordância do paciente em relação a este objetivo implica na impossibilidade de continuidade do tratamento.","a intermediação com a família depende do compromisso de submeter-se a um programa de curto prazo, com vistas à abstinência do álcool e drogas.","o problema com o consumo abusivo de álcool e drogas é de responsabilidade exclusiva dele mesmo, e que o fato de querer que os pais acompanhem a consulta médica demonstra uma infantilização de sua relação com o médico."],"c":0,"x":"A abordagem recomendada é centrada no paciente e na redução de danos: o uso abusivo de álcool e drogas frequentemente coexiste com transtornos como depressão e ansiedade, e o vínculo e a continuidade do tratamento devem ser mantidos mesmo que o paciente ainda não deseje ou não consiga a abstinência. A abstinência não pode ser condição para o cuidado (B, C, D), e culpabilizar ou ridicularizar o paciente (E) prejudica a aliança terapêutica."},{"t":"P","e":"A aterosclerose é um processo patológico crônico e sistêmico, caracterizado por resposta inflamatória e fibroproliferativa da parede arterial. Inicia-se com lesão na camada endotelial causada, por exemplo, por altos níveis séricos de colesterol e triglicerídeos, forças hemodinâmicas, depósito de complexo imune, irradiação, ou produtos químicos. A lesão endotelial leva ao aumento da permeabilidade vascular e acúmulo de lipoproteínas, principalmente LDL (lipoproteína de baixa densidade) na camada íntima. Esses lipídios que se acumulam no endotélio serão oxidados por espécies reativas de oxigênio (ERO), liberadas pelas células endoteliais e por macrófagos. A oxidação da LDL e a ativação de macrófagos estimula a produção de citocinas, que recrutam mais células inflamatórias, desencadeando assim um processo inflamatório crônico. Disponível em: http://crid.fmrp.usp.br/site/2014/11/04/a-aterosclerose/. Acesso em: 02 jun. 2019.\nFormação da placa de ateroma no interior do vaso sanguíneo Disponível em: http://crid.fmrp.usp.br/site/2014/11/04/a-aterosclerose/ Acesso em: 02 jun. 2019.\nSobre a aterosclerose, é correto afirmar que","a":["hiperlipidemia, hipertensão arterial, tabagismo e diabetes mellitus são considerados fatores de risco não modificáveis para aterosclerose.","pode levar a diversas consequências clínicas, como infarto do miocárdio, doença vascular periférica e insuficiência renal.","ocorre predominantemente no sexo feminino devido ao efeito do hormônio estrogênio. Após a menopausa, ambos os sexos são afetados igualmente.","(texto não visível na foto original)","(texto não visível na foto original)"],"c":1,"x":"A aterosclerose é sistêmica e pode causar infarto do miocárdio, AVC, doença arterial periférica, aneurismas e insuficiência renal (por nefroesclerose ou estenose de artéria renal). A: hiperlipidemia, hipertensão, tabagismo e diabetes são fatores de risco modificáveis (não modificáveis são idade, sexo e genética). C: a doença é mais precoce e frequente em homens, e nas mulheres o risco aumenta após a menopausa, não sendo predominante no sexo feminino."},{"t":"P","e":"Com relação à hiperinsulinemia em pacientes obesos, assinale a alternativa correta.","a":["É mais proeminente quando a gordura é distribuída mais perifericamente.","Ela indica proteção contra a resistência à insulina.","Ela define o diagnóstico de diabetes melito nestes pacientes.","Ela ocorre precocemente para manter a homeostase da glicose.","O nível de insulina é inversamente proporcional ao grau de obesidade."],"c":3,"x":"Na obesidade, a resistência à insulina leva a uma hiperinsulinemia compensatória, que surge precocemente para manter a glicemia normal; quando a célula beta já não compensa, instala-se a hiperglicemia e o diabetes tipo 2. A: a resistência é maior com gordura visceral/central, não periférica. B: a hiperinsulinemia reflete resistência, não proteção. C: o diagnóstico de diabetes é glicêmico (glicemia ou HbA1c). E: a insulina tende a ser diretamente proporcional ao grau de obesidade."},{"t":"P","e":"Suellen, 29 anos, é trazida à Emergência depois de ter pulado de sua janela, no quarto andar de um prédio, e caído de pé no chão. O exame físico é de Suellen normal, exceto por dor em suas proeminências ósseas. Exames laboratoriais iniciais são normais. Radiografias simples de tórax, pelve e região cervical não revelam anormalidades. A avaliação subsequente de Suellen deve incluir","a":["repetir a radiografia de tórax em 6 horas.","radiografias dos joelhos e tornozelos.","tomografia da cabeça.","radiografias da coluna e das extremidades inferiores.","tomografia do abdome e pelve."],"c":3,"x":"Na queda de altura com aterrissagem sobre os pés, a carga axial pode causar fraturas do calcâneo e de outros ossos das extremidades inferiores, frequentemente associadas a fraturas da coluna toracolombar. Com dor em proeminências ósseas e radiografias iniciais normais, a avaliação seguinte deve incluir radiografias da coluna e das extremidades inferiores. Não há achado que justifique tomografia de crânio ou de abdome e pelve, nem repetição da radiografia de tórax."},{"t":"P","e":"A Portaria nº 2.616 de 12 de maio de 1998, do Ministério da Saúde, estabelece normas para a prevenção e o controle de infecções hospitalares e classifica as cirurgias segundo o potencial de contaminação. Nesse sentido, com base no texto a seguir, assinale a alternativa que representa o tipo de cirurgia de acordo com o potencial de infecção. São as cirurgias realizadas em tecidos colonizados por abundante microbiota bacteriana, cuja descontaminação seja difícil; incisão cirúrgica na presença de inflamação aguda sem supuração local; quebra grosseira da técnica asséptica; tecidos traumatizados e abertos recentemente, por exemplo, colectomia.","a":["Cirurgia contaminada.","Cirurgia limpa.","Cirurgia potencialmente contaminada.","Cirurgia ablativa/radical.","Cirurgia infectada."],"c":0,"x":"A descrição corresponde à cirurgia contaminada segundo a Portaria nº 2.616/98: tecidos colonizados por flora abundante e de difícil descontaminação, inflamação aguda sem supuração, falha grosseira de técnica asséptica e tecidos traumatizados ou recém-abertos. A cirurgia limpa ocorre em tecidos estéreis ou de fácil descontaminação, sem inflamação; a potencialmente contaminada, em tecidos colonizados com flora pouco numerosa e fácil descontaminação; a infectada, na presença de infecção e supuração local."},{"t":"P","e":"A tosse é um efeito colateral comum no uso de inibidores da enzima conversora de angiotensina devido ao acúmulo de qual substância?","a":["renina","bradicinina","angiotensinogênio","angiotensina I","angiotensina II"],"c":1,"x":"A enzima conversora de angiotensina (ECA) também degrada a bradicinina (cininase II). Ao inibi-la, a bradicinina se acumula nas vias aéreas e provoca a tosse seca, efeito comum dos IECA. Os bloqueadores do receptor AT1 não interferem na degradação da bradicinina e, por isso, raramente causam tosse."},{"t":"P","e":"Um estudante de medicina acompanha um exame de ultrassonografia cervical solicitado para um paciente de 23 anos, com queixa de linfadenomegalia indolor em região submandibular direita, notada há 10 dias. O exame de imagem identifica múltiplos linfonodos submandibulares, o maior com 1,2 cm no eixo longitudinal, forma ovalada, córtex fino (<3 mm), hilo ecogênico central e contornos bem definidos. Nenhuma vascularização excêntrica foi observada ao Doppler. Após a discussão do caso, o professor questiona os alunos sobre a aparência ultrassonográfica normal dos linfonodos e sua relação com critérios de benignidade. Com base nesse cenário, assinale a alternativa correta.","a":["Linfonodos normais apresentam ausência completa de vascularização, o que os diferencia de linfonodos com padrão inflamatório ou neoplásico.","Linfonodos normais são sempre arredondados, com ausência de hilo e ecotextura hiperecogênica, especialmente nas cadeias cervicais profundas.","A presença de hilo ecogênico central, contornos bem definidos e forma ovalada são achados compatíveis com linfonodo de padrão benigno.","A espessura cortical superior a 3 mm, com presença de hilo, é critério de benignidade nas cadeias axilares e cervicais.","O número de linfonodos aumentados não tem relevância clínica, desde que o maior tenha menos de 2 cm em qualquer eixo."],"c":2,"x":"Ao ultrassom, são sinais de benignidade: forma ovalada (relação eixo longo/curto maior que 2), hilo ecogênico central preservado, córtex fino e uniforme, contornos bem definidos e vascularização hilar (não excêntrica). A: linfonodos normais apresentam vascularização hilar. B: os normais são ovalados e com hilo presente. D: espessamento cortical acima de 3 mm é sinal suspeito. E: o número e as características do conjunto têm relevância clínica, e o tamanho isolado não exclui doença."},{"t":"P","e":"A colecistite aguda continua sendo uma doença com a qual o cirurgião se depara frequentemente. A cirurgia videolaparoscópica veio mudar o manuseio e evolução dos pacientes tomando o pós-operatório mais curto e menos doloroso. A literatura médica tem levado alguns cirurgiões a retardarem a indicação cirúrgica, entretanto novos trabalhos, inclusive com análise de medicina baseada em evidências, têm demonstrado que a intervenção na primeira semana do início do quadro é a melhor conduta. MAYA, Maria Cristina A. et al. Colecistite Aguda: Diagnóstico e Tratamento. Revista do Hospital Universitário Pedro Ernesto, Universidade do Estado do Rio de Janeiro, ano 8, jan./jun. 2009. Disponível em: https://www.e-publicacoes.uerj.br/index.php/revistahupe/article/view/9233. Acesso em: 10 jun. 2019.\nSobre o quadro clínico da colecistite aguda, avalie as afirmações a seguir.\nI. Em cerca de 70% dos indivíduos acometidos, é comum a ocorrência de febre, náuseas e vômitos, podendo ser excesso de bilis.\nII. A primeira observação que se nota é o início de uma cólica biliar percebida como dor no hipocôndrio direito que se irradia para escápula direita e região epigástrica.\nIII. A perfuração da vesícula biliar, formação de abscesso ou gangrena são percebidos pela presença de febre alta, leucocitose, calafrios e a distensão abdominal seguida de diminuição\nda peristalse.\nÉ correto o que se afirma em","a":["II e III, apenas.","I e III, apenas.","I, II e III.","II, apenas.","III, apenas."],"c":2,"x":"Todas as afirmativas estão corretas. I: febre, náuseas e vômitos são comuns na colecistite aguda. II: o quadro começa com cólica biliar em hipocôndrio direito, com irradiação para escápula direita e epigástrio. III: perfuração, abscesso ou gangrena da vesícula se manifestam com febre alta, calafrios, leucocitose e distensão abdominal com redução dos ruídos (íleo), sinais de gravidade."},{"t":"P","e":"Durante o atendimento de uma mulher de 21 anos,que está febril e com fortes cólicas abdominais, você identifica sinal de Giordano positivo. Este sinal é sugestivo de:","a":["obstrução intestinal, causada principalmente por massa tumoral.","peritonite, especialmente por apendicite aguda.","perfuração intestinal, especialmente de duodeno.","processos inflamatórios retroperitoneais, especialmente a pielonefrite aguda.","abscesso tubáreo, relacionado à doença inflamatória pélvica."],"c":3,"x":"O sinal de Giordano (dor à punho-percussão da região lombar, na loja renal) é sugestivo de processo inflamatório retroperitoneal, sobretudo pielonefrite aguda. Peritonite relaciona-se a sinais como o de Blumberg, e obstrução, perfuração e abscesso tubáreo não são indicados por esse sinal."}]}]}]}];
const letters=['A','B','C','D','E'];
let selected=null, pool=[], index=0, answers={}, finished=false, filter='all', searchTerm='';
const $=id=>document.getElementById(id);
function allSps(){let out=[];DB.forEach(sec=>sec.themes.forEach(theme=>(theme.sps||[]).forEach(sp=>out.push({id:sp.id, title:sp.title, lbl:sp.lbl||'', section:sec.name, theme:theme.name, qs:sp.qs||[]}))));return out}
const SPS=allSps();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function countQs(sp){return sp.qs.length}
function renderNav(){
 let html='';
 DB.forEach(sec=>{
  const entries=SPS.filter(s=>s.section===sec.name&&(`${s.title} ${s.theme} ${s.section}`).toLowerCase().includes(searchTerm));
  if(!entries.length && !sec.name.toLowerCase().includes(searchTerm))return;
  html+=`<div class="group">${esc(sec.name)}</div>`;
  entries.forEach(sp=>html+=`<button class="${selected===sp.id?'active':''}" data-sp="${esc(sp.id)}">${esc(sp.title)}<small>${esc(sp.theme)} · ${sp.qs.length} questões</small></button>`);
 });
 if(!html)html='<div class="empty">Nenhum conteúdo encontrado.</div>';
 $('nav').innerHTML=html;
 $('nav').querySelectorAll('[data-sp]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.sp)));
}
function start(id,mode='all'){
 selected=id;const sp=SPS.find(s=>s.id===id);filter=mode;
 pool=sp.qs.map((q,i)=>({...q,original:i,spTitle:sp.title,spId:sp.id})).filter(q=>mode==='all'||(mode==='M'&&q.t==='M')||(mode==='C'&&q.t==='C')||(mode==='P'&&q.t==='P'));
 index=0;answers={};finished=false;renderNav();render();
}
function typeName(t){return t==='M'?'Memorização':t==='C'?'Caso clínico':t==='P'?'Questão de prova':'Questão'}
function render(){
 const app=$('app');
 if(!selected){app.innerHTML=`<div class="empty"><div style="font-size:38px;margin-bottom:12px">🩺</div><strong>Comece sua revisão</strong>Escolha uma aula no menu ao lado para visualizar as questões.<p class="muted">Você pode filtrar por memorização, casos clínicos ou questões de prova.</p></div>`;return}
 const sp=SPS.find(s=>s.id===selected);
 if(!pool.length){app.innerHTML='<div class="empty"><strong>Nenhuma questão neste filtro.</strong>Selecione outro tipo de questão.</div>';return}
 if(finished){renderResults(sp);return}
 const q=pool[index], chosen=answers[index], revealed=chosen!==undefined;
 let opts=q.a.map((a,i)=>{let cls='option';if(revealed&&i===q.c)cls+=' correct';else if(revealed&&i===chosen&&chosen!==q.c)cls+=' wrong';return `<button class="${cls}" data-answer="${i}" ${revealed?'disabled':''}><span class="letter">${letters[i]||i+1}</span><span>${esc(a)}</span></button>`}).join('');
 const answered=Object.keys(answers).length, pct=Math.round(answered/pool.length*100);
 app.innerHTML=`<div class="toolbar"><div><div class="eyebrow">${esc(sp.section)} · ${esc(sp.theme)}</div><h2 class="heading">${esc(sp.title)}</h2><div class="muted">${pool.length} questões neste treino</div></div><button class="btn" id="reset">↻ Reiniciar</button></div>
 <div class="controls"><select id="typeFilter" aria-label="Filtrar tipo"><option value="all" ${filter==='all'?'selected':''}>Todos os tipos</option><option value="M" ${filter==='M'?'selected':''}>Memorização</option><option value="C" ${filter==='C'?'selected':''}>Casos clínicos</option><option value="P" ${filter==='P'?'selected':''}>Questões de prova</option></select></div>
 <div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div><div class="qmeta"><span>Questão ${index+1} de ${pool.length}</span><span>${answered} respondida(s) · ${pct}%</span></div>
 <div class="qmeta" style="margin-top:13px"><span class="eyebrow">${typeName(q.t)}</span><span>${q.t==='M'?'Conceito e memorização':q.t==='C'?'Raciocínio clínico':'Prova / revisão'}</span></div>
 <div class="question">${esc(q.e)}</div><div id="options">${opts}</div>
 ${revealed?`<div class="explanation ${chosen===q.c?'good':'bad'}"><b>${chosen===q.c?'✓ Resposta correta':'✕ Resposta incorreta'} — alternativa ${letters[q.c]}</b>${q.x?`<div style="margin-top:6px">${esc(q.x)}</div>`:''}</div>`:''}
 <div class="actions"><button class="btn" id="prev" ${index===0?'disabled':''}>← Anterior</button><div class="right"><button class="btn" id="next" ${!revealed?'disabled':''}>${index===pool.length-1?'Ver resultado':'Próxima →'}</button></div></div>`;
 $('options').querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{answers[index]=Number(b.dataset.answer);render()}));
 $('prev').onclick=()=>{index--;render()};
 $('next').onclick=()=>{if(index===pool.length-1){finished=true;render()}else{index++;render()}};
 $('reset').onclick=()=>start(selected,filter);
 $('typeFilter').onchange=e=>start(selected,e.target.value);
}
function renderResults(sp){
 const correct=pool.filter((q,i)=>answers[i]===q.c).length, done=Object.keys(answers).length, pct=done?Math.round(correct/done*100):0;
 $('app').innerHTML=`<div class="eyebrow">${esc(sp.section)} · Resultado do treino</div><h2 class="heading">${esc(sp.title)}</h2><div class="results"><div class="score">${correct}/${pool.length}</div><b>acertos</b><p>${correct===pool.length?'Excelente! Você acertou todas as questões.':`Você acertou ${pct}% das questões respondidas.`}</p><div class="muted">${done} respondida(s) de ${pool.length}</div></div>
 <div class="actions"><button class="btn" id="review">Revisar questões</button><div class="right"><button class="btn primary" id="again">Refazer treino</button></div></div>`;
 $('review').onclick=()=>{finished=false;index=0;render()};
 $('again').onclick=()=>start(selected,filter);
}
$('search').addEventListener('input',e=>{searchTerm=e.target.value.toLowerCase().trim();renderNav()});
$('totalCount').textContent=SPS.reduce((n,s)=>n+s.qs.length,0);
$('sectionCount').textContent=DB.length;
renderNav();render();
</script>
</body></html>
