<script>
const DB = [{"id":"s0","name":"Saúde, Doenças e Cuidados","themes":[{"id":"A","name":"Tema A","sps":[{"id":"A1","title":"Acidente Vascular Encefálico (AVE) e Fibrilação Atrial","qs":[{"t":"M","e":"A escala de Cincinnati é utilizada no reconhecimento inicial de possível acidente vascular encefálico. Quais alterações são avaliadas por essa escala?","a":["Alteração da marcha, cefaleia e perda visual.","Assimetria facial, queda do braço e alteração da fala.","Alteração da consciência, convulsões e rigidez de nuca.","Perda auditiva, vertigem e alteração da sensibilidade.","Alteração pupilar, disfagia e perda de equilíbrio."],"c":1,"x":"A escala de Cincinnati avalia assimetria facial, queda de um braço e alteração da fala."},{"t":"C","e":"Um paciente de 68 anos apresenta início súbito de fraqueza no lado direito do corpo e dificuldade para falar. Os sintomas começaram há 40 minutos. Qual deve ser a principal suspeita e a conduta inicial?","a":["Crise epiléptica; iniciar anticonvulsivante imediatamente.","Hipoglicemia; administrar glicose sem realizar avaliação adicional.","AVE agudo; realizar avaliação inicial, verificar glicemia e encaminhar para neuroimagem urgente.","Demência vascular; iniciar investigação ambulatorial.","Enxaqueca; administrar analgésico e observar a evolução."],"c":2,"x":"Déficit neurológico focal de início súbito exige suspeita de AVE, avaliação inicial, glicemia e neuroimagem urgente."},{"t":"M","e":"Qual exame é considerado fundamental na avaliação inicial de um paciente com suspeita de AVE agudo, especialmente para diferenciar AVE isquêmico de hemorrágico?","a":["Ressonância magnética com contraste.","Tomografia computadorizada de crânio sem contraste.","Angiografia cerebral invasiva.","Eletroencefalograma.","Ultrassonografia de carótidas."],"c":1,"x":"A tomografia sem contraste é fundamental para identificar ou excluir hemorragia intracraniana na avaliação inicial."},{"t":"C","e":"Um paciente apresenta déficit neurológico focal súbito. A tomografia de crânio evidencia ausência de sinais de hemorragia intracraniana. Considerando a possibilidade de AVE isquêmico, qual é o principal objetivo do tratamento agudo?","a":["Reduzir a atividade elétrica cerebral.","Promover recanalização arterial e preservar o tecido cerebral viável.","Induzir hipotensão arterial.","Impedir definitivamente a formação de novos neurônios.","Reduzir a pressão intracraniana por meio de hiperventilação em todos os pacientes."],"c":1,"x":"No AVE isquêmico, o objetivo do tratamento agudo é restaurar o fluxo sanguíneo e preservar o tecido cerebral viável."},{"t":"M","e":"O AVE hemorrágico ocorre principalmente em decorrência de:","a":["Obstrução arterial por trombo, sem ruptura vascular.","Redução transitória do fluxo sanguíneo cerebral.","Ruptura de um vaso sanguíneo, com extravasamento de sangue.","Degeneração progressiva dos neurônios.","Espasmo muscular das artérias cerebrais."],"c":2,"x":"O AVE hemorrágico decorre da ruptura de um vaso, com extravasamento de sangue para o parênquima ou espaço subaracnóideo."},{"t":"C","e":"Um paciente com fibrilação atrial apresenta déficit neurológico focal de início súbito. Qual mecanismo explica a associação entre fibrilação atrial e AVE isquêmico?","a":["A fibrilação atrial provoca ruptura direta dos vasos cerebrais.","A contração atrial desorganizada favorece estase sanguínea e formação de trombos, que podem embolizar para a circulação cerebral.","A fibrilação atrial causa exclusivamente vasoconstrição cerebral.","A arritmia impede a formação de trombos intracardíacos.","A fibrilação atrial provoca hipoglicemia cerebral."],"c":1,"x":"Na fibrilação atrial, a contração atrial ineficaz favorece estase sanguínea e formação de trombos, que podem causar embolia cerebral."},{"t":"M","e":"Quais são os principais objetivos do tratamento da fibrilação atrial?","a":["Controle da frequência ventricular, controle do ritmo e prevenção de fenômenos tromboembólicos.","Apenas controle da pressão arterial.","Apenas reversão imediata do ritmo cardíaco.","Redução da frequência respiratória e prevenção de convulsões.","Controle da glicemia e prevenção de hemorragia cerebral."],"c":0,"x":"O tratamento envolve controle da frequência, controle do ritmo e prevenção de fenômenos tromboembólicos."},{"t":"C","e":"Uma paciente de 75 anos, hipertensa e diabética, apresenta fibrilação atrial diagnosticada recentemente. Na avaliação, o médico considera o risco de eventos tromboembólicos. Qual é a principal complicação que se busca prevenir com a anticoagulação?","a":["Hemorragia subaracnóidea.","Infarto agudo do miocárdio por ruptura de placa.","AVE isquêmico cardioembólico.","Hemorragia intracerebral espontânea.","Hipertensão intracraniana."],"c":2,"x":"A anticoagulação busca principalmente reduzir o risco de formação de trombos e AVE cardioembólico."},{"t":"M","e":"Na fisiopatologia do AVE isquêmico, a interrupção do fluxo sanguíneo cerebral provoca inicialmente:","a":["Aumento da oferta de oxigênio aos neurônios.","Redução do fornecimento de oxigênio e glicose, comprometendo o metabolismo energético neuronal.","Aumento permanente da produção de ATP.","Destruição imediata de todos os neurônios do encéfalo.","Aumento da perfusão cerebral na região afetada."],"c":1,"x":"A interrupção do fluxo reduz a oferta de oxigênio e glicose, comprometendo o metabolismo energético neuronal."},{"t":"C","e":"Um paciente apresenta hemorragia intraparenquimatosa associada à hipertensão arterial sistêmica. Qual mecanismo está relacionado a esse tipo de evento?","a":["Ruptura vascular com extravasamento sanguíneo para o parênquima cerebral.","Formação de placas de ateroma exclusivamente em veias cerebrais.","Embolia pulmonar com repercussão cerebral.","Obstrução transitória da artéria cerebral média.","Degeneração da substância branca por processo exclusivamente autoimune."],"c":0,"x":"Na hemorragia intraparenquimatosa, ocorre ruptura vascular e extravasamento sanguíneo para o tecido cerebral."},{"t":"M","e":"Qual é a principal diferença entre AVE isquêmico e hemorrágico?","a":["O isquêmico ocorre por ruptura vascular e o hemorrágico por obstrução.","Ambos ocorrem exclusivamente por hipertensão arterial.","O isquêmico decorre da interrupção do fluxo sanguíneo; o hemorrágico, da ruptura de um vaso.","O isquêmico não provoca déficit neurológico focal.","O hemorrágico não provoca aumento da pressão intracraniana."],"c":2,"x":"O AVE isquêmico decorre da obstrução ou interrupção do fluxo; o hemorrágico, da ruptura vascular."},{"t":"C","e":"Um paciente foi submetido à trombólise intravenosa por AVE isquêmico. A equipe médica pretende iniciar antiagregante plaquetário. Qual é a conduta descrita no material?","a":["Administrar imediatamente, independentemente da trombólise.","Adiar o antiagregante até pelo menos 24 horas após a trombólise, com reavaliação por neuroimagem.","Suspender definitivamente todos os antiagregantes.","Administrar anticoagulante em dose plena imediatamente.","Substituir o antiagregante por corticoide."],"c":1,"x":"Após trombólise intravenosa, os antiagregantes costumam ser adiados por pelo menos 24 horas, com reavaliação por neuroimagem."},{"t":"M","e":"A fibrilação atrial é caracterizada por:","a":["Atividade elétrica atrial organizada e frequência ventricular obrigatoriamente baixa.","Atividade elétrica atrial desorganizada, com contração atrial ineficaz e resposta ventricular variável.","Contração ventricular ausente.","Bloqueio completo da condução entre átrios e ventrículos em todos os casos.","Atividade elétrica exclusivamente ventricular."],"c":1,"x":"A fibrilação atrial é caracterizada por atividade elétrica atrial desorganizada e resposta ventricular variável."},{"t":"C","e":"Um paciente apresenta quadro neurológico súbito com comprometimento de nervos cranianos ipsilaterais e alterações motoras em membros contralaterais. Esse padrão é compatível com:","a":["Síndrome de comprometimento de circulação posterior, podendo envolver tronco encefálico.","Demência frontotemporal.","Síndrome depressiva.","Crise de ansiedade.","Neuropatia periférica isolada."],"c":0,"x":"O comprometimento de nervos cranianos ipsilaterais e membros contralaterais sugere lesão de tronco encefálico, relacionada à circulação posterior."},{"t":"M","e":"Qual é a importância da prevenção secundária após um AVE isquêmico?","a":["Evitar apenas a recorrência de sintomas motores.","Investigar a etiologia do evento e controlar fatores de risco para reduzir novos eventos vasculares.","Substituir a investigação etiológica por repouso.","Suspender permanentemente os medicamentos cardiovasculares.","Evitar exclusivamente a realização de exames de imagem."],"c":1,"x":"A prevenção secundária exige investigação etiológica e controle dos fatores de risco para evitar novos eventos."}]},{"id":"A2","title":"Crise Epiléptica e Epilepsia","qs":[{"t":"M","e":"Qual alternativa diferencia corretamente crise epiléptica de epilepsia?","a":["Toda crise epiléptica caracteriza obrigatoriamente epilepsia.","Crise epiléptica é um evento decorrente de atividade neuronal anormal excessiva ou síncrona; epilepsia é uma condição caracterizada por predisposição persistente a crises recorrentes.","Epilepsia é uma alteração exclusivamente psiquiátrica.","Crise epiléptica ocorre somente durante o sono.","Epilepsia corresponde a qualquer episódio de perda de consciência."],"c":1,"x":"A crise é um evento decorrente de atividade neuronal anormal; epilepsia é uma condição de predisposição persistente a crises recorrentes."},{"t":"C","e":"Um homem apresenta perda súbita da consciência após permanecer muito tempo em pé. Antes do episódio, relata sudorese, náuseas e sensação de calor. Recupera rapidamente a consciência, sem confusão prolongada. Qual diagnóstico deve ser considerado?","a":["Crise epiléptica generalizada.","Estado de mal epiléptico.","Síncope, possivelmente vasovagal.","Demência.","Delirium."],"c":2,"x":"Pródromos como sudorese, náuseas e sensação de calor, seguidos de recuperação rápida, favorecem síncope vasovagal."},{"t":"M","e":"Qual achado clínico favorece o diagnóstico de crise epiléptica em comparação com síncope?","a":["Recuperação imediata da consciência.","Sudorese antes do episódio.","Confusão mental prolongada após o evento.","Sensação de calor antes da perda de consciência.","Episódio relacionado à permanência prolongada em pé."],"c":2,"x":"Confusão mental prolongada após o episódio favorece crise epiléptica, enquanto a síncope geralmente apresenta recuperação mais rápida."},{"t":"C","e":"Um paciente apresenta episódio de perda de consciência associado a movimentos tônico-clônicos, mordedura lateral da língua e confusão mental prolongada após o evento. Qual é a hipótese mais provável?","a":["Síncope vasovagal.","Crise epiléptica.","Crise de pânico.","Hipotensão ortostática isolada.","Episódio depressivo."],"c":1,"x":"Movimentos tônico-clônicos, mordedura lateral da língua e período pós-ictal prolongado são achados sugestivos de crise epiléptica."},{"t":"M","e":"A classificação atual da epilepsia deve considerar:","a":["Apenas a idade de início.","Apenas a frequência das crises.","Tipo de crise, tipo de epilepsia, síndrome epiléptica e etiologia.","Exclusivamente os achados do eletroencefalograma.","Apenas a resposta ao tratamento medicamentoso."],"c":2,"x":"A classificação considera tipo de crise, tipo de epilepsia, síndrome epiléptica e etiologia."},{"t":"C","e":"Um paciente apresenta episódios recorrentes de alteração comportamental e movimentos involuntários. O médico deseja correlacionar a atividade eletroencefalográfica com o comportamento observado durante os episódios. Qual exame é especialmente útil?","a":["Radiografia de crânio.","Vídeo-EEG.","Tomografia de tórax.","Ultrassonografia abdominal.","Eletrocardiograma isolado."],"c":1,"x":"O vídeo-EEG associa o registro elétrico cerebral à gravação do comportamento, permitindo correlacionar os eventos."},{"t":"M","e":"Qual é a principal utilidade do eletroencefalograma na investigação de epilepsia?","a":["Identificar diretamente a anatomia dos vasos cerebrais.","Registrar a atividade elétrica cerebral e auxiliar na identificação de atividade epileptiforme.","Medir a pressão intracraniana.","Avaliar exclusivamente a função cardíaca.","Substituir a avaliação clínica."],"c":1,"x":"O EEG registra a atividade elétrica cerebral e auxilia na identificação de alterações epileptiformes."},{"t":"M","e":"A epileptogênese corresponde:","a":["Ao processo pelo qual um cérebro inicialmente não predisposto passa a desenvolver predisposição à ocorrência de crises epilépticas.","À interrupção definitiva de todas as descargas neuronais.","À degeneração exclusiva dos nervos periféricos.","Ao processo de recuperação após uma síncope.","À redução da atividade elétrica cerebral durante o sono."],"c":0,"x":"Epileptogênese é o processo pelo qual um cérebro inicialmente não predisposto passa a apresentar predisposição a crises."},{"t":"C","e":"Um paciente chega à emergência apresentando crise convulsiva contínua, sem recuperação da consciência. Qual é a principal preocupação clínica?","a":["Síncope recorrente.","Estado de mal epiléptico.","Transtorno de ansiedade generalizada.","Demência aguda.","Transtorno depressivo."],"c":1,"x":"Crise contínua sem recuperação da consciência levanta suspeita de estado de mal epiléptico."},{"t":"M","e":"O estado de mal epiléptico é considerado:","a":["Uma condição benigna que não exige atendimento imediato.","Uma emergência neurológica que exige tratamento rápido.","Uma manifestação exclusiva de epilepsia focal.","Um evento que ocorre somente em pacientes idosos.","Uma condição tratada exclusivamente com psicoterapia."],"c":1,"x":"O estado de mal epiléptico é uma emergência neurológica que exige intervenção rápida."},{"t":"C","e":"Um paciente permanece em crise convulsiva na emergência. A equipe decide iniciar tratamento farmacológico de primeira linha. Qual classe de medicamentos é utilizada inicialmente?","a":["Antidepressivos tricíclicos.","Benzodiazepínicos.","Antipsicóticos típicos.","Inibidores seletivos da recaptação de serotonina.","Estabilizadores do humor utilizados exclusivamente no TAB."],"c":1,"x":"Os benzodiazepínicos são utilizados como tratamento inicial do estado de mal epiléptico."},{"t":"M","e":"Entre os medicamentos abaixo, qual pertence à classe dos benzodiazepínicos utilizados no manejo de crises epilépticas?","a":["Sertralina.","Diazepam.","Haloperidol.","Fluoxetina.","Risperidona."],"c":1,"x":"O diazepam é um benzodiazepínico utilizado no manejo de crises."},{"t":"C","e":"Um paciente apresenta crise epiléptica persistente apesar da administração de benzodiazepínico. Qual é o próximo princípio terapêutico descrito no material?","a":["Interromper o tratamento e aguardar resolução espontânea.","Utilizar medicamento anticrise de ação prolongada como segunda linha.","Administrar antidepressivo.","Iniciar apenas hidratação oral.","Realizar alta imediata."],"c":1,"x":"Se a crise persiste após o benzodiazepínico, são utilizados medicamentos anticrise de ação prolongada como segunda linha."},{"t":"M","e":"Qual condição pode provocar crises epilépticas agudas sintomáticas?","a":["Apenas predisposição genética.","Intoxicação ou abstinência de substâncias e medicamentos.","Exclusivamente transtornos de personalidade.","Somente doenças degenerativas.","Apenas alterações do sono."],"c":1,"x":"Intoxicações e abstinência de álcool ou medicamentos podem desencadear crises agudas sintomáticas."},{"t":"C","e":"Uma pessoa apresenta episódio de movimentos involuntários e alteração da consciência. Durante a avaliação, o médico considera a possibilidade de evento psicogênico não epiléptico. Qual exame pode ajudar especialmente nessa diferenciação?","a":["Vídeo-EEG.","Radiografia de tórax.","Ecocardiograma.","Ultrassonografia abdominal.","Dosagem isolada de glicemia."],"c":0,"x":"O vídeo-EEG é especialmente útil na diferenciação entre crises epilépticas e eventos psicogênicos não epilépticos."}]},{"id":"A3","title":"Demências, Delirium e Delírio","qs":[{"t":"M","e":"Qual alternativa diferencia corretamente demência, delirium e delírio?","a":["Demência é uma alteração aguda da atenção; delirium é um declínio cognitivo crônico; delírio é uma alucinação.","Demência é declínio cognitivo adquirido e persistente; delirium é alteração aguda e flutuante da atenção e consciência; delírio é uma crença falsa mantida apesar de evidências contrárias.","Os três termos representam a mesma condição.","Delirium é sempre irreversível.","Demência ocorre exclusivamente em pacientes hospitalizados."],"c":1,"x":"Demência é declínio cognitivo persistente; delirium é alteração aguda e flutuante da atenção e consciência; delírio é uma crença falsa mantida apesar de evidências contrárias."},{"t":"C","e":"Um idoso previamente independente apresenta, em dois dias, desatenção, desorientação e flutuação do nível de consciência. Qual hipótese é mais provável?","a":["Doença de Alzheimer.","Demência frontotemporal.","Delirium.","Transtorno delirante persistente.","Transtorno de personalidade."],"c":2,"x":"Instalação aguda, desatenção e flutuação da consciência são características de delirium."},{"t":"M","e":"Qual característica é mais típica do delirium?","a":["Instalação lenta e progressiva ao longo de anos.","Alteração aguda e flutuante da atenção e da consciência.","Comprometimento isolado da memória episódica por décadas.","Ausência de alteração da atenção.","Preservação obrigatória da consciência."],"c":1,"x":"A alteração aguda e flutuante da atenção e da consciência é uma característica central do delirium."},{"t":"C","e":"Uma paciente apresenta perda progressiva de memória, dificuldade para realizar atividades habituais e comprometimento cognitivo persistente. O quadro evolui ao longo de anos. Qual síndrome deve ser investigada?","a":["Delirium.","Demência.","Crise epiléptica.","Síncope.","Surto psicótico breve."],"c":1,"x":"O declínio cognitivo adquirido e progressivo, com prejuízo funcional, sugere síndrome demencial."},{"t":"M","e":"Qual das alternativas corresponde a uma causa potencialmente reversível de comprometimento cognitivo que deve ser considerada no diagnóstico diferencial de demência?","a":["Hipotireoidismo.","Doença de Alzheimer.","Demência com corpos de Lewy.","Demência frontotemporal.","Demência vascular estabelecida."],"c":0,"x":"O hipotireoidismo pode causar comprometimento cognitivo e deve ser investigado como diagnóstico diferencial."},{"t":"C","e":"Um paciente idoso apresenta comprometimento cognitivo, apatia, isolamento social, perda de interesse e humor deprimido. Antes de concluir que se trata de demência, qual condição deve ser considerada?","a":["Depressão.","Esquizofrenia.","Epilepsia.","Fibrilação atrial.","Hipertensão arterial isolada."],"c":0,"x":"A depressão pode provocar sintomas cognitivos semelhantes aos da demência e deve ser considerada na avaliação."},{"t":"M","e":"A demência frontotemporal caracteriza-se principalmente por:","a":["Degeneração predominante dos lobos frontal e/ou temporal, com alterações comportamentais, de personalidade ou linguagem.","Comprometimento exclusivo do cerebelo.","Alteração aguda e flutuante da consciência.","Perda súbita de força em um hemicorpo.","Episódios recorrentes de síncope."],"c":0,"x":"A demência frontotemporal envolve degeneração dos lobos frontal e/ou temporal, frequentemente com alterações comportamentais ou de linguagem."},{"t":"M","e":"Na doença de Alzheimer, qual alteração fisiopatológica é característica?","a":["Acúmulo de beta-amiloide e hiperfosforilação da proteína tau.","Destruição exclusiva dos neurônios motores periféricos.","Acúmulo de hemoglobina no espaço subaracnóideo.","Formação de trombos nas artérias pulmonares.","Aumento permanente da atividade dopaminérgica mesolímbica."],"c":0,"x":"A doença de Alzheimer está associada ao acúmulo de beta-amiloide e à hiperfosforilação da proteína tau."},{"t":"C","e":"Um paciente apresenta declínio cognitivo associado a alucinações visuais recorrentes e alterações motoras semelhantes ao parkinsonismo. Qual diagnóstico deve ser considerado?","a":["Demência frontotemporal.","Demência com corpos de Lewy.","Delirium exclusivamente.","Transtorno depressivo maior.","Demência vascular por definição."],"c":1,"x":"Alucinações visuais recorrentes e manifestações semelhantes ao parkinsonismo são características sugestivas de demência com corpos de Lewy."},{"t":"M","e":"Qual é uma complicação importante em pacientes com demência que apresentam disfagia?","a":["Pneumonia aspirativa.","Pneumotórax espontâneo.","Trombose arterial dos membros superiores.","Hipertireoidismo.","Fibrilação atrial obrigatória."],"c":0,"x":"A disfagia favorece a aspiração de alimentos, líquidos ou secreções, podendo causar pneumonia aspirativa."},{"t":"C","e":"Um paciente com demência apresenta tosse durante as refeições e episódios de engasgo. Qual profissional tem atuação importante na avaliação e reabilitação da deglutição?","a":["Cardiologista.","Fonoaudiólogo.","Dermatologista.","Oftalmologista.","Reumatologista."],"c":1,"x":"O fonoaudiólogo atua na avaliação e reabilitação da deglutição, além da comunicação e linguagem."},{"t":"M","e":"Qual é o principal objetivo da atuação do terapeuta ocupacional no acompanhamento de pessoas com demência?","a":["Realizar exclusivamente o diagnóstico etiológico.","Estimular independência nas atividades de vida diária, adaptar o ambiente e propor atividades compatíveis com as capacidades do paciente.","Prescrever todos os medicamentos.","Substituir a avaliação neurológica.","Realizar exclusivamente exames laboratoriais."],"c":1,"x":"A terapia ocupacional busca preservar a independência, adaptar o ambiente e favorecer atividades compatíveis com as capacidades do paciente."},{"t":"C","e":"Um paciente hospitalizado desenvolve desatenção, alteração do ciclo sono-vigília e comportamento desorganizado, com períodos de melhora e piora ao longo do dia. Qual diagnóstico é mais provável?","a":["Delirium.","Demência frontotemporal.","Transtorno delirante.","Doença de Alzheimer em fase inicial.","Transtorno de personalidade."],"c":0,"x":"A flutuação da atenção, consciência e comportamento em paciente hospitalizado é sugestiva de delirium."},{"t":"M","e":"Qual é uma característica importante do tratamento das demências?","a":["Deve ser exclusivamente farmacológico.","Deve incluir abordagem multiprofissional, medidas de suporte e intervenções voltadas à funcionalidade e à qualidade de vida.","Deve priorizar internação prolongada em todos os casos.","Deve suspender todas as atividades cotidianas.","Deve evitar participação familiar."],"c":1,"x":"O cuidado deve ser multiprofissional, com medidas de suporte e foco na funcionalidade e qualidade de vida."},{"t":"M","e":"Qual é o papel dos anticorpos monoclonais antiamiloide, como lecanemabe e donanemabe, descritos no material?","a":["Curar definitivamente qualquer tipo de demência.","Reduzir a progressão clínica em pacientes selecionados com doença de Alzheimer inicial.","Tratar delirium por infecção.","Substituir todos os medicamentos sintomáticos.","Tratar exclusivamente demência frontotemporal."],"c":1,"x":"Os anticorpos antiamiloide podem reduzir a progressão clínica em pacientes selecionados com doença de Alzheimer inicial."}]},{"id":"A4","title":"Transtorno de Ansiedade Generalizada (TAG) e Depressão","qs":[{"t":"M","e":"O transtorno de ansiedade generalizada caracteriza-se por:","a":["Episódios isolados de medo intenso, sem preocupação persistente.","Preocupação e ansiedade excessivas, persistentes e difíceis de controlar, envolvendo diferentes aspectos da vida.","Alteração exclusiva do humor, sem sintomas físicos.","Perda progressiva de memória.","Episódios obrigatórios de alucinações."],"c":1,"x":"O TAG caracteriza-se por preocupação excessiva, persistente e difícil de controlar, envolvendo diferentes áreas da vida."},{"t":"C","e":"Uma paciente relata preocupação excessiva com trabalho, saúde, família e desempenho acadêmico. Apresenta dificuldade para controlar as preocupações, tensão muscular, irritabilidade e alterações do sono. Qual hipótese é mais compatível?","a":["Transtorno afetivo bipolar.","Transtorno de ansiedade generalizada.","Esquizofrenia.","Demência.","Delirium."],"c":1,"x":"Preocupações excessivas em múltiplos contextos, acompanhadas de tensão muscular, irritabilidade e alterações do sono, são compatíveis com TAG."},{"t":"M","e":"Qual manifestação é característica de um episódio depressivo?","a":["Humor persistentemente elevado e aumento da energia.","Anedonia, humor deprimido, fadiga e alterações do sono e do apetite.","Apenas preocupação excessiva com diferentes assuntos.","Delírios obrigatórios em todos os pacientes.","Redução da necessidade de sono com grandiosidade."],"c":1,"x":"Humor deprimido, anedonia, fadiga e alterações do sono e apetite são manifestações típicas da depressão."},{"t":"C","e":"Um paciente apresenta humor deprimido, perda de interesse por atividades antes prazerosas, fadiga, culpa e dificuldade de concentração. Qual sintoma é especialmente característico da depressão?","a":["Anedonia.","Grandiosidade.","Aumento da energia.","Fuga de ideias.","Redução da necessidade de sono sem cansaço."],"c":0,"x":"Anedonia é a redução ou perda da capacidade de sentir prazer em atividades anteriormente prazerosas."},{"t":"M","e":"Qual alternativa apresenta condições clínicas que devem ser consideradas no diagnóstico diferencial de sintomas ansiosos ou depressivos?","a":["Alterações hidroeletrolíticas, insuficiência renal, insuficiência hepática e hipercalcemia.","Apenas doenças dermatológicas.","Exclusivamente doenças osteoarticulares.","Somente doenças infecciosas respiratórias.","Apenas alterações oftalmológicas."],"c":0,"x":"Alterações metabólicas e doenças sistêmicas podem produzir sintomas semelhantes aos transtornos psiquiátricos."},{"t":"M","e":"O PHQ-9 é utilizado para:","a":["Avaliar exclusivamente sintomas psicóticos.","Avaliar nove sintomas relacionados à depressão nas últimas duas semanas.","Diagnosticar epilepsia.","Avaliar exclusivamente sintomas de mania.","Medir a intensidade da dor."],"c":1,"x":"O PHQ-9 avalia nove sintomas depressivos considerando as últimas duas semanas."},{"t":"C","e":"Uma paciente apresenta pontuação de 17 no PHQ-9. Considerando a classificação apresentada no material, como deve ser interpretado esse resultado?","a":["Sintomas mínimos.","Sintomas leves.","Sintomas moderados.","Sintomas moderadamente graves.","Sintomas graves."],"c":3,"x":"A pontuação de 17 corresponde à faixa de sintomas moderadamente graves."},{"t":"M","e":"O GAD-7 avalia:","a":["Sete sintomas de ansiedade nas últimas duas semanas.","Nove sintomas depressivos ao longo de seis meses.","Quatorze sintomas de mania.","Vinte e um sintomas psicóticos.","Apenas sintomas físicos de ansiedade."],"c":0,"x":"O GAD-7 avalia sete sintomas de ansiedade nas últimas duas semanas."},{"t":"C","e":"Um paciente apresenta pontuação de 16 no GAD-7. Qual é a classificação correspondente?","a":["Ansiedade mínima.","Ansiedade leve.","Ansiedade moderada.","Ansiedade grave.","Resultado normal."],"c":3,"x":"A pontuação de 16 está na faixa de ansiedade grave, que corresponde a 15–21 pontos."},{"t":"M","e":"Qual característica diferencia o Inventário de Depressão de Beck da Escala de Hamilton para Depressão?","a":["O Beck é um instrumento de autorrelato, enquanto a Hamilton é aplicada por profissional treinado.","Ambos são exames laboratoriais.","O Beck avalia apenas ansiedade.","A Hamilton é utilizada exclusivamente em crianças.","Ambos substituem a entrevista clínica."],"c":0,"x":"O Beck é um instrumento de autorrelato; a escala de Hamilton é aplicada por profissional treinado."},{"t":"M","e":"Como os inibidores seletivos da recaptação de serotonina (ISRS) atuam?","a":["Bloqueiam os receptores dopaminérgicos D2.","Inibem seletivamente o transportador de serotonina, aumentando sua disponibilidade na fenda sináptica.","Potencializam diretamente a ação do GABA-A.","Bloqueiam os canais de sódio dos neurônios.","Impedem a liberação de todos os neurotransmissores."],"c":1,"x":"Os ISRS inibem o transportador de serotonina (SERT), aumentando sua disponibilidade na fenda sináptica."},{"t":"C","e":"Uma paciente iniciou tratamento com escitalopram há três dias e ainda não percebe melhora da ansiedade. Qual explicação é mais adequada?","a":["O medicamento não atua no sistema serotoninérgico.","O efeito terapêutico dos ISRS geralmente demora algumas semanas devido a adaptações neurobiológicas progressivas.","O medicamento só funciona após uso associado a benzodiazepínico.","O efeito dos ISRS ocorre exclusivamente após seis meses.","A ausência de melhora em três dias confirma resistência terapêutica."],"c":1,"x":"Apesar da ação inicial sobre o transportador, a resposta terapêutica depende de adaptações neurobiológicas que levam algumas semanas."},{"t":"M","e":"Qual mecanismo explica a ação dos benzodiazepínicos?","a":["Bloqueio irreversível dos receptores dopaminérgicos.","Potencialização da ação do GABA no receptor GABA-A, aumentando a frequência de abertura do canal de cloro.","Inibição seletiva da recaptação de serotonina.","Aumento da liberação de glutamato.","Bloqueio dos receptores de acetilcolina."],"c":1,"x":"Os benzodiazepínicos potencializam a ação do GABA no receptor GABA-A, aumentando a frequência de abertura do canal de cloro."},{"t":"C","e":"Um paciente faz uso prolongado de benzodiazepínico e percebe que a dose anteriormente eficaz passou a produzir menor efeito sedativo. Qual fenômeno explica essa situação?","a":["Síndrome serotoninérgica.","Tolerância farmacológica.","Síndrome neuroléptica maligna.","Abstinência alcoólica.","Delirium infeccioso."],"c":1,"x":"A tolerância corresponde à redução do efeito de uma dose previamente eficaz após exposição repetida."},{"t":"M","e":"Qual é a principal diferença entre tolerância e dependência física aos benzodiazepínicos?","a":["Tolerância é redução da resposta ao medicamento; dependência física envolve adaptação do organismo e possibilidade de abstinência após redução ou suspensão.","Tolerância é sinônimo de intoxicação.","Dependência física ocorre apenas após uma dose.","Tolerância corresponde obrigatoriamente à síndrome de abstinência.","São fenômenos sem relação com o uso prolongado."],"c":0,"x":"Tolerância é redução da resposta; dependência física é adaptação do organismo, podendo provocar abstinência na redução ou suspensão."}]},{"id":"A5","title":"Transtorno Afetivo Bipolar (TAB) e Esquizofrenia","qs":[{"t":"M","e":"O transtorno afetivo bipolar é caracterizado por:","a":["Alterações persistentes da memória e da orientação.","Episódios de alteração patológica do humor, da energia e do nível de atividade, envolvendo mania ou hipomania e episódios depressivos.","Delírios e alucinações permanentes em todos os pacientes.","Preocupação excessiva sem alteração do humor.","Alteração exclusiva da personalidade."],"c":1,"x":"O TAB envolve episódios de alteração patológica do humor, energia e atividade, com mania ou hipomania e episódios depressivos."},{"t":"C","e":"Um paciente apresenta humor expansivo e irritável, aumento importante da energia, redução da necessidade de sono, fala acelerada, grandiosidade e envolvimento em comportamentos de risco. Os sintomas provocam prejuízo funcional importante e persistem por mais de uma semana. Qual episódio é mais provável?","a":["Episódio depressivo maior.","Episódio maníaco.","Episódio hipomaníaco.","Delirium.","Transtorno de ansiedade generalizada."],"c":1,"x":"A mania apresenta humor elevado, expansivo ou irritável, aumento de energia, redução da necessidade de sono e prejuízo funcional importante."},{"t":"M","e":"Qual é a duração mínima de um episódio hipomaníaco descrita no material?","a":["Um dia.","Dois dias.","Quatro dias consecutivos.","Uma semana obrigatoriamente.","Seis meses."],"c":2,"x":"A hipomania exige duração mínima de quatro dias consecutivos."},{"t":"C","e":"Uma paciente apresenta sintomas semelhantes aos da mania, porém menos intensos, com duração de cinco dias, sem prejuízo funcional grave, hospitalização ou sintomas psicóticos. Qual episódio deve ser considerado?","a":["Mania.","Hipomania.","Delirium.","Episódio psicótico breve.","Episódio depressivo."],"c":1,"x":"Sintomas semelhantes aos da mania, mas menos intensos e sem prejuízo grave, hospitalização ou psicose, caracterizam hipomania."},{"t":"M","e":"Qual é a principal diferença entre TAB tipo I e TAB tipo II?","a":["O TAB tipo I exige episódio depressivo, enquanto o tipo II exige apenas mania.","O TAB tipo I exige pelo menos um episódio maníaco; o tipo II envolve hipomania e depressão maior, sem histórico de mania.","O TAB tipo II apresenta obrigatoriamente sintomas psicóticos.","O TAB tipo I não apresenta episódios depressivos.","Não existe diferença entre os dois tipos."],"c":1,"x":"TAB tipo I exige pelo menos um episódio maníaco; TAB tipo II envolve hipomania e depressão maior, sem histórico de mania."},{"t":"M","e":"Na esquizofrenia, os sintomas positivos incluem:","a":["Avolição, anedonia e pobreza do discurso.","Delírios, alucinações e pensamento desorganizado.","Déficit de memória isolado.","Fadiga e alterações do apetite.","Preocupação excessiva e tensão muscular."],"c":1,"x":"Delírios, alucinações e pensamento desorganizado são sintomas positivos da esquizofrenia."},{"t":"C","e":"Um paciente apresenta redução da expressão emocional, pobreza do discurso, falta de iniciativa e diminuição do interesse pelas relações sociais. Esses achados correspondem predominantemente a:","a":["Sintomas positivos da esquizofrenia.","Sintomas negativos da esquizofrenia.","Sintomas de mania.","Sintomas de delirium.","Sintomas de intoxicação anticolinérgica."],"c":1,"x":"Redução da expressão emocional, avolição, anedonia e pobreza do discurso são sintomas negativos."},{"t":"M","e":"Segundo a hipótese dopaminérgica apresentada no material, a hiperatividade dopaminérgica mesolímbica está associada principalmente a:","a":["Sintomas positivos da esquizofrenia.","Sintomas negativos exclusivamente.","Sintomas motores periféricos.","Comprometimento renal.","Alterações tireoidianas."],"c":0,"x":"A hiperatividade dopaminérgica mesolímbica está associada aos sintomas positivos da esquizofrenia."},{"t":"C","e":"Um paciente apresenta delírios e alucinações exclusivamente durante episódios de mania. Entre os episódios de humor, recupera significativamente seu funcionamento e não apresenta sintomas psicóticos. Qual diagnóstico deve ser considerado?","a":["Esquizofrenia obrigatoriamente.","Transtorno afetivo bipolar com sintomas psicóticos durante episódios de humor.","Delirium crônico.","Demência com corpos de Lewy.","Transtorno delirante persistente obrigatoriamente."],"c":1,"x":"No TAB, os sintomas psicóticos geralmente aparecem durante episódios de mania ou depressão grave."},{"t":"M","e":"Qual achado diferencia a esquizofrenia do TAB com sintomas psicóticos?","a":["A esquizofrenia apresenta sintomas psicóticos que podem ocorrer independentemente dos episódios de humor.","A esquizofrenia apresenta apenas episódios depressivos.","O TAB nunca apresenta sintomas psicóticos.","A esquizofrenia é exclusivamente um transtorno do humor.","O TAB apresenta obrigatoriamente sintomas psicóticos contínuos."],"c":0,"x":"Na esquizofrenia, os sintomas psicóticos podem ocorrer independentemente dos episódios de humor."},{"t":"M","e":"Qual é o principal mecanismo de ação dos antipsicóticos descrito no material?","a":["Bloqueio dos receptores dopaminérgicos D2.","Inibição seletiva do transportador de serotonina.","Estímulo dos receptores GABA-B.","Aumento da liberação de acetilcolina.","Bloqueio dos receptores de insulina."],"c":0,"x":"Os antipsicóticos atuam principalmente pelo bloqueio dos receptores dopaminérgicos D2."},{"t":"C","e":"Um paciente em uso de antipsicótico apresenta febre elevada, rigidez muscular intensa, alteração do nível de consciência e instabilidade autonômica. Qual complicação deve ser suspeitada?","a":["Síndrome serotoninérgica.","Síndrome neuroléptica maligna.","Crise de ausência.","Síndrome de abstinência de benzodiazepínicos.","Episódio hipomaníaco."],"c":1,"x":"Hipertermia, rigidez intensa, alteração da consciência e instabilidade autonômica são características da síndrome neuroléptica maligna."},{"t":"M","e":"Qual antipsicótico é especialmente indicado em casos de esquizofrenia resistente ao tratamento, geralmente após falha de pelo menos dois antipsicóticos em doses e períodos adequados?","a":["Fluoxetina.","Clozapina.","Diazepam.","Sertralina.","Lamotrigina."],"c":1,"x":"A clozapina é indicada principalmente para esquizofrenia resistente, exigindo monitoramento hematológico."},{"t":"C","e":"Um paciente com TAB tipo I apresenta episódio depressivo. A equipe considera a utilização de antidepressivo. Qual conduta é mais adequada segundo o material?","a":["Utilizar antidepressivo isoladamente como primeira escolha obrigatória.","Considerar antidepressivo apenas como adjuvante de estabilizador do humor em casos selecionados, devido ao risco de virada maníaca.","Suspender todos os estabilizadores do humor.","Utilizar antidepressivo em dose máxima sem acompanhamento.","Evitar qualquer tratamento farmacológico."],"c":1,"x":"Antidepressivos podem ser considerados como adjuvantes de estabilizadores do humor em casos selecionados, mas não devem ser utilizados isoladamente no TAB tipo I."},{"t":"M","e":"De acordo com a Lei nº 10.216/2001, qual modalidade de internação psiquiátrica é determinada pelo Poder Judiciário?","a":["Voluntária.","Involuntária.","Compulsória.","Ambulatorial.","Comunitária."],"c":2,"x":"A internação compulsória é determinada pelo Poder Judiciário, independentemente do consentimento do paciente."}]}]},{"id":"B","name":"Tema B","sps":[{"id":"B1","title":"Sarcopenia, Caquexia e Síndrome do Idoso Frágil","qs":[{"t":"M","e":"A sarcopenia é caracterizada principalmente por:","a":["Perda isolada de tecido adiposo, sem comprometimento muscular.","Redução progressiva da força muscular associada à diminuição da quantidade e qualidade do músculo esquelético.","Aumento da massa muscular com redução da força.","Perda muscular exclusivamente decorrente de neoplasias.","Redução da densidade óssea sem alteração muscular."],"c":1,"x":"Sarcopenia envolve redução da força muscular associada à diminuição da quantidade e qualidade muscular."},{"t":"C","e":"Um homem de 78 anos apresenta dificuldade para levantar-se de uma cadeira, subir escadas e carregar objetos. Ao exame, apresenta redução da força de preensão palmar. Considerando os critérios EWGSOP2, qual é a interpretação mais adequada?","a":["A sarcopenia está descartada porque não há perda ponderal.","A baixa força muscular indica sarcopenia provável.","O diagnóstico exige obrigatoriamente a presença de anemia.","A baixa força muscular caracteriza caquexia refratária.","O diagnóstico depende exclusivamente da idade."],"c":1,"x":"No EWGSOP2, a baixa força muscular indica sarcopenia provável."},{"t":"M","e":"Qual mecanismo fisiopatológico contribui para o desenvolvimento da sarcopenia?","a":["Aumento da síntese proteica muscular e redução do estresse oxidativo.","Predomínio da síntese sobre a degradação de proteínas musculares.","Desequilíbrio entre síntese e degradação proteica, com predomínio do catabolismo.","Aumento da atividade das células-satélite.","Aumento da sensibilidade muscular aos estímulos anabólicos."],"c":2,"x":"Ocorre desequilíbrio entre síntese e degradação proteica, com predomínio do catabolismo."},{"t":"C","e":"Um paciente com câncer avançado apresenta perda involuntária de peso, redução importante da massa muscular, anorexia e fadiga. Mesmo com oferta alimentar adequada, continua perdendo massa muscular. Qual condição explica melhor o quadro?","a":["Sarcopenia primária.","Caquexia.","Senescência fisiológica.","Obesidade sarcopênica obrigatoriamente.","Desidratação isolada."],"c":1,"x":"A caquexia envolve perda muscular progressiva associada a alterações metabólicas e inflamatórias."},{"t":"M","e":"Qual característica diferencia principalmente a caquexia da desnutrição simples por privação alimentar?","a":["Na caquexia, existe componente metabólico e inflamatório que mantém o catabolismo, não completamente revertido pela alimentação convencional.","A caquexia ocorre exclusivamente em idosos.","A desnutrição simples sempre provoca inflamação sistêmica intensa.","A caquexia é caracterizada apenas pela perda de tecido adiposo.","A caquexia é completamente revertida com aumento da ingestão calórica."],"c":0,"x":"Diferentemente da desnutrição simples, a caquexia apresenta catabolismo metabólico e inflamatório que não é completamente revertido pela alimentação convencional."},{"t":"M","e":"Quais citocinas pró-inflamatórias estão relacionadas à fisiopatologia da caquexia?","a":["IL-4, IL-10 e TGF-β exclusivamente.","TNF-α, IL-1 e IL-6.","Eritropoietina, insulina e glucagon.","GH, IGF-1 e testosterona.","TSH, T3 e T4."],"c":1,"x":"TNF-α, IL-1 e IL-6 participam da resposta inflamatória e da degradação muscular."},{"t":"C","e":"Uma mulher de 82 anos apresenta perda involuntária de peso, exaustão frequente, fraqueza muscular, lentidão da marcha e baixo nível de atividade física. Segundo o fenótipo de Fried, como deve ser classificada?","a":["Sem fragilidade, pois apresenta apenas alterações relacionadas à idade.","Pré-frágil, pois apresenta cinco critérios.","Frágil, pois apresenta três ou mais critérios.","Sarcopênica grave obrigatoriamente.","Caquética, independentemente da investigação clínica."],"c":2,"x":"Três ou mais critérios de Fried caracterizam fragilidade."},{"t":"M","e":"Segundo os critérios de Fried, a presença de quantos critérios caracteriza pré-fragilidade?","a":["Nenhum.","Um ou dois.","Três.","Quatro ou cinco.","Todos os cinco obrigatoriamente."],"c":1,"x":"Um ou dois critérios caracterizam pré-fragilidade."},{"t":"M","e":"Qual alternativa apresenta corretamente os cinco critérios do fenótipo de Fried?","a":["Hipertensão, diabetes, obesidade, anemia e osteoporose.","Perda involuntária de peso, exaustão, fraqueza muscular, lentidão da marcha e baixo nível de atividade física.","Perda de memória, disfagia, depressão, insônia e quedas.","Anemia, leucopenia, trombocitopenia, febre e perda de peso.","Dispneia, dor torácica, edema, taquicardia e hipotensão."],"c":1,"x":"Os cinco critérios são perda de peso, exaustão, fraqueza, lentidão da marcha e baixa atividade física."},{"t":"C","e":"Um idoso apresenta perda involuntária de peso. A investigação identifica depressão, disfagia, alteração do paladar, diarreia, problemas odontológicos e uso de medicamentos que provocam náuseas. Qual instrumento mnemônico reúne fatores que devem ser investigados nessa situação?","a":["Escala de Glasgow.","Os 9 D's.","Critérios de Fried.","Escore de Wells.","Escala de Braden."],"c":1,"x":"Os 9 D's organizam fatores relacionados à perda involuntária de peso em idosos."},{"t":"M","e":"Segundo os critérios GLIM, para estabelecer o diagnóstico de desnutrição é necessário:","a":["Apenas um critério laboratorial alterado.","Pelo menos um critério fenotípico e um critério etiológico.","Apenas redução da albumina sérica.","Exclusivamente perda de peso superior a 10%.","Presença obrigatória de anemia e hipocalemia."],"c":1,"x":"O GLIM exige pelo menos um critério fenotípico e um etiológico."},{"t":"C","e":"Um paciente apresenta perda involuntária de peso superior a 5% em seis meses, redução da massa muscular e doença inflamatória crônica. Qual alternativa melhor representa a avaliação nutricional segundo o GLIM?","a":["Possui critério fenotípico e etiológico, permitindo estabelecer diagnóstico de desnutrição.","Não pode apresentar desnutrição porque possui doença crônica.","A perda de peso é suficiente, independentemente dos demais critérios.","A albumina isoladamente confirma a desnutrição.","O diagnóstico depende exclusivamente do IMC."],"c":0,"x":"Perda de peso e redução muscular são critérios fenotípicos; doença inflamatória é critério etiológico."},{"t":"M","e":"Qual é a diferença entre senescência e senilidade?","a":["Senescência é envelhecimento patológico; senilidade é envelhecimento fisiológico.","Senescência corresponde ao envelhecimento fisiológico; senilidade refere-se a alterações patológicas associadas ao envelhecimento.","Ambos são sinônimos de demência.","Senescência ocorre somente após os 80 anos.","Senilidade é uma consequência obrigatória do envelhecimento."],"c":1,"x":"Senescência é envelhecimento fisiológico; senilidade envolve alterações patológicas."},{"t":"C","e":"Um paciente com insuficiência cardíaca crônica apresenta perda muscular, anorexia, fadiga e redução da capacidade funcional. Qual abordagem é mais adequada para o tratamento da possível caquexia?","a":["Suplementação calórica isolada, sem tratar a doença de base.","Repouso absoluto para evitar gasto energético.","Abordagem individualizada e multidisciplinar, com tratamento da doença de base, suporte nutricional e exercícios adaptados.","Restrição proteica obrigatória.","Tratamento exclusivamente psicológico."],"c":2,"x":"A caquexia exige abordagem multidimensional, incluindo doença de base, nutrição e reabilitação."},{"t":"M","e":"Qual profissional tem atuação específica na avaliação e no tratamento da disfagia em pacientes com caquexia ou desnutrição?","a":["Cardiologista.","Fonoaudiólogo.","Dermatologista.","Reumatologista.","Oftalmologista."],"c":1,"x":"O fonoaudiólogo avalia e trata disfagia e alterações da deglutição."}]},{"id":"B2","title":"Politrauma, Choques e Hemocomponentes","qs":[{"t":"M","e":"O politrauma é caracterizado por:","a":["Qualquer lesão superficial isolada.","Lesões graves em duas ou mais regiões anatômicas, cuja associação provoca alterações fisiológicas sistêmicas e maior risco de morte.","Fratura isolada de membro superior.","Lesões exclusivamente cranianas.","Qualquer acidente sem comprometimento sistêmico."],"c":1,"x":"Politrauma envolve lesões graves em pelo menos duas regiões anatômicas, com repercussão sistêmica."},{"t":"M","e":"Na sequência xABCDE do atendimento ao trauma, o “x” representa:","a":["Avaliação neurológica.","Controle imediato da hemorragia exsanguinante.","Exposição completa do paciente.","Avaliação da ventilação.","Avaliação da circulação após a reposição volêmica."],"c":1,"x":"O “x” prioriza o controle da hemorragia exsanguinante."},{"t":"C","e":"Um paciente vítima de acidente automobilístico chega à emergência com ferimento profundo em membro inferior e sangramento arterial intenso. Qual deve ser a prioridade inicial?","a":["Realizar tomografia de corpo inteiro.","Controlar imediatamente a hemorragia exsanguinante.","Realizar avaliação neurológica detalhada antes de qualquer intervenção.","Administrar dieta oral.","Aguardar os resultados laboratoriais para iniciar o controle do sangramento."],"c":1,"x":"O sangramento exsanguinante deve ser controlado imediatamente."},{"t":"M","e":"A tríade letal do trauma é composta por:","a":["Hipertensão, hiperglicemia e hipoxemia.","Hipotermia, acidose e coagulopatia.","Hipotensão, hipocalemia e alcalose.","Hiperglicemia, hipercalcemia e hipertermia.","Anemia, leucocitose e trombocitose."],"c":1,"x":"A tríade letal é hipotermia, acidose e coagulopatia."},{"t":"C","e":"Um paciente politraumatizado apresenta hemorragia grave, hipotensão, extremidades frias, taquicardia e redução da diurese. Qual tipo de choque é mais provável?","a":["Cardiogênico.","Distributivo.","Hipovolêmico.","Obstrutivo.","Neurogênico."],"c":2,"x":"Hemorragia, hipotensão, taquicardia e hipoperfusão sugerem choque hipovolêmico."},{"t":"M","e":"Qual é a principal diferença entre hemocomponentes e hemoderivados?","a":["Hemocomponentes são produzidos industrialmente; hemoderivados são obtidos por centrifugação do sangue total.","Hemocomponentes são obtidos por processamento físico do sangue; hemoderivados são produzidos industrialmente por fracionamento e purificação do plasma.","Ambos são obtidos exclusivamente por aférese.","Hemoderivados contêm apenas hemácias.","Não existe diferença entre eles."],"c":1,"x":"Hemocomponentes são obtidos por processamento físico; hemoderivados, por fracionamento industrial do plasma."},{"t":"M","e":"Qual hemocomponente tem como principal finalidade aumentar a capacidade de transporte de oxigênio?","a":["Plasma fresco congelado.","Crioprecipitado.","Concentrado de hemácias.","Concentrado de plaquetas.","Albumina humana."],"c":2,"x":"O concentrado de hemácias aumenta a capacidade de transporte de oxigênio."},{"t":"C","e":"Um paciente apresenta trauma grave, sangramento ativo e fibrinogênio reduzido. Qual hemocomponente é especialmente indicado para reposição de fibrinogênio?","a":["Concentrado de hemácias.","Concentrado de plaquetas.","Plasma fresco congelado exclusivamente.","Crioprecipitado.","Albumina humana."],"c":3,"x":"O crioprecipitado é rico em fibrinogênio."},{"t":"M","e":"Qual alternativa descreve corretamente a principal indicação do plasma fresco congelado?","a":["Corrigir anemia isolada.","Expandir volume em qualquer paciente hipotenso.","Repor múltiplos fatores de coagulação em situações de sangramento associado à deficiência desses fatores.","Corrigir exclusivamente trombocitopenia.","Aumentar a massa eritrocitária."],"c":2,"x":"O plasma fresco congelado repõe múltiplos fatores de coagulação."},{"t":"C","e":"Um paciente apresenta trauma fechado de abdome após colisão automobilística. Não há ferimentos externos, mas evolui com hipotensão e sinais de choque. Qual afirmação está correta?","a":["O trauma fechado não provoca hemorragia interna.","A ausência de ferimento externo exclui lesão visceral.","O trauma fechado pode provocar hemorragias internas, como hemoperitônio e hematoma retroperitoneal.","O quadro exclui choque hemorrágico.","A avaliação abdominal não é necessária."],"c":2,"x":"O trauma fechado pode causar hemorragias internas mesmo sem ferimentos externos."},{"t":"M","e":"A hemorragia exteriorizada caracteriza-se por:","a":["Sangramento restrito ao tecido subcutâneo.","Sangue proveniente de uma cavidade interna que sai por um orifício natural.","Sangramento exclusivamente visível em ferimentos cutâneos.","Sangramento sem ruptura vascular.","Perda sanguínea exclusivamente intracraniana."],"c":1,"x":"Na hemorragia exteriorizada, o sangue de uma cavidade interna sai por um orifício natural."},{"t":"M","e":"Na distribuição trimodal clássica das mortes no trauma, o segundo pico ocorre principalmente:","a":["Nos primeiros segundos após o acidente.","Nas primeiras horas após o trauma, frequentemente por hemorragias graves e lesões potencialmente tratáveis.","Exclusivamente após meses de internação.","Apenas após a alta hospitalar.","Somente em pacientes com infecções crônicas."],"c":1,"x":"O segundo pico clássico ocorre nas primeiras horas, principalmente por hemorragias e lesões tratáveis."},{"t":"C","e":"Um paciente com trauma torácico apresenta dispneia intensa, hipotensão, taquicardia, ausência de murmúrio vesicular à direita e hipersonoridade à percussão. Qual é a principal hipótese?","a":["Hemotórax simples.","Pneumotórax hipertensivo.","Derrame pleural crônico.","Pneumonia comunitária.","Contusão abdominal."],"c":1,"x":"A associação de dispneia, hipotensão, ausência de murmúrio vesicular e hipersonoridade sugere pneumotórax hipertensivo."},{"t":"M","e":"Qual mecanismo fisiopatológico explica a instabilidade hemodinâmica no pneumotórax hipertensivo?","a":["Aumento do retorno venoso e do débito cardíaco.","Compressão das veias cavas, redução do retorno venoso e diminuição do débito cardíaco.","Aumento da pressão arterial por vasoconstrição sistêmica.","Aumento da contratilidade ventricular.","Redução da pressão intrapleural."],"c":1,"x":"A pressão intrapleural elevada comprime as veias cavas, reduz o retorno venoso e diminui o débito cardíaco."},{"t":"C","e":"Um paciente apresenta quadro clínico compatível com pneumotórax hipertensivo e instabilidade hemodinâmica. Qual é a conduta correta?","a":["Aguardar radiografia para confirmar o diagnóstico.","Solicitar tomografia antes de qualquer intervenção.","Realizar descompressão pleural imediata, seguida de drenagem torácica definitiva.","Administrar apenas oxigênio e observar.","Realizar toracocentese para retirada de líquido pleural."],"c":2,"x":"A descompressão deve ser imediata, sem aguardar exames de imagem, seguida de drenagem definitiva."},{"t":"M","e":"Na descompressão por agulha do pneumotórax hipertensivo, qual local é recomendado no adulto segundo o material?","a":["Primeiro espaço intercostal, linha paraesternal.","Quarto ou quinto espaço intercostal, entre as linhas axilar anterior e média.","Sexto espaço intercostal, linha posterior.","Segundo espaço intercostal, linha axilar posterior.","Região subxifoide."],"c":1,"x":"O material recomenda o quarto ou quinto espaço intercostal entre as linhas axilar anterior e média."},{"t":"C","e":"Durante a descompressão por agulha, o profissional precisa evitar lesão do feixe neurovascular intercostal. Em qual região deve introduzir o cateter?","a":["Imediatamente abaixo da borda inferior da costela superior.","Imediatamente acima da borda superior da costela inferior do espaço escolhido.","Diretamente sobre a borda inferior da costela inferior.","No centro da costela.","Abaixo da borda inferior da costela inferior."],"c":1,"x":"A punção deve ser realizada imediatamente acima da borda superior da costela inferior do espaço escolhido."},{"t":"M","e":"Qual é a principal indicação da vacinação pneumocócica no contexto do trauma descrita no material?","a":["Todo paciente com fratura de costela.","Todo paciente com pneumotórax simples.","Pacientes com lesão esplênica grave que necessitam de esplenectomia.","Todos os pacientes com hemorragia externa.","Todos os pacientes submetidos à drenagem torácica."],"c":2,"x":"A vacinação pneumocócica é especialmente importante após esplenectomia."},{"t":"C","e":"Um paciente apresenta pneumotórax aberto após ferimento penetrante no tórax. Qual é a abordagem inicial descrita no material?","a":["Curativo torácico valvulado ou selo torácico ventilado, monitorização e drenagem torácica em local separado da ferida.","Curativo totalmente oclusivo sem vigilância.","Apenas antibioticoterapia.","Toracocentese para retirada de líquido.","Aguardar fechamento espontâneo da ferida."],"c":0,"x":"O pneumotórax aberto exige curativo valvulado ou selo ventilado e drenagem em local separado da ferida."},{"t":"M","e":"Qual é a finalidade da cirurgia de controle de danos no paciente politraumatizado?","a":["Realizar todos os procedimentos definitivos em uma única operação prolongada.","Interromper rapidamente o sangramento e controlar a contaminação, adiando a correção definitiva até a estabilização fisiológica.","Evitar qualquer intervenção cirúrgica.","Corrigir apenas fraturas de membros.","Substituir a reposição de hemocomponentes."],"c":1,"x":"A cirurgia de controle de danos prioriza interromper o sangramento e controlar a contaminação, deixando procedimentos definitivos para depois da estabilização."}]},{"id":"B3","title":"Anemia Ferropriva e Parasitoses","qs":[{"t":"M","e":"Qual indicador antropométrico avalia o crescimento linear da criança?","a":["Peso para idade (P/I).","Estatura para idade (E/I).","Peso para estatura (P/E).","IMC para idade (IMC/I).","Perímetro abdominal para idade."],"c":1,"x":"Estatura para idade avalia o crescimento linear."},{"t":"M","e":"O escore Z representa:","a":["A porcentagem de gordura corporal da criança.","A quantidade de calorias ingeridas diariamente.","Quantos desvios-padrão uma medida antropométrica está acima ou abaixo da mediana da população de referência.","A relação entre hemoglobina e hematócrito.","A velocidade de crescimento em centímetros por mês."],"c":2,"x":"O escore Z expressa a distância da medida em relação à mediana em desvios-padrão."},{"t":"C","e":"Uma criança apresenta estatura para idade abaixo de -2 escores Z. Qual interpretação é compatível com os padrões apresentados no material?","a":["Baixa estatura para idade.","Sobrepeso para idade.","Obesidade grave.","Peso elevado para estatura.","Crescimento obrigatoriamente normal."],"c":0,"x":"Estatura para idade abaixo de -2 Z indica baixa estatura."},{"t":"M","e":"Qual é a principal forma de transmissão da giardíase?","a":["Transmissão respiratória por gotículas.","Transmissão fecal-oral pela ingestão de cistos presentes em água, alimentos ou superfícies contaminadas.","Penetração ativa de larvas pela pele.","Picada de mosquito.","Transmissão exclusivamente sexual."],"c":1,"x":"A giardíase é transmitida pela ingestão fecal-oral de cistos."},{"t":"C","e":"Uma criança apresenta diarreia persistente, fezes volumosas, gordurosas e fétidas, flatulência intensa e distensão abdominal. Qual parasitose é mais compatível com o quadro?","a":["Ascaridíase.","Giardíase.","Ancilostomíase.","Enterobíase.","Esquistossomose."],"c":1,"x":"Esteatorreia, flatulência e fezes fétidas são manifestações típicas da giardíase."},{"t":"M","e":"Qual característica diferencia a giardíase de parasitoses que provocam invasão da mucosa intestinal?","a":["A giardíase costuma provocar sangue abundante nas fezes.","A giardíase geralmente não provoca febre alta nem sangue nas fezes, pois não costuma invadir a mucosa intestinal.","A giardíase provoca obrigatoriamente hemorragia digestiva.","A giardíase é transmitida exclusivamente por mosquitos.","A giardíase provoca sempre obstrução intestinal."],"c":1,"x":"A Giardia geralmente não invade a mucosa intestinal, por isso sangue nas fezes e febre alta não são características habituais."},{"t":"C","e":"Uma criança apresenta dor abdominal, redução do apetite e distensão abdominal. A família relata que observou vermes nas fezes. Qual agente etiológico é o mais provável?","a":["Giardia duodenalis.","Ascaris lumbricoides.","Entamoeba histolytica.","Toxoplasma gondii.","Plasmodium falciparum."],"c":1,"x":"Ascaris lumbricoides pode ser identificado pela eliminação de vermes nas fezes ou pela boca."},{"t":"M","e":"Qual é o mecanismo de transmissão da ascaridíase?","a":["Ingestão de ovos embrionados presentes em água ou alimentos contaminados.","Penetração de larvas pela pele.","Picada de insetos hematófagos.","Inalação de gotículas respiratórias.","Contato direto com sangue contaminado."],"c":0,"x":"A ascaridíase é transmitida pela ingestão de ovos embrionados."},{"t":"C","e":"Uma criança apresenta dor abdominal intensa, vômitos e distensão abdominal. Há suspeita de obstrução intestinal por infestação intensa de Ascaris lumbricoides. Qual exame de imagem pode auxiliar na investigação?","a":["Eletrocardiograma.","Radiografia ou outros exames de imagem abdominal.","Eletroencefalograma.","Ecocardiograma.","Densitometria óssea."],"c":1,"x":"Exames de imagem podem auxiliar na investigação de obstrução intestinal."},{"t":"M","e":"A anemia ferropriva ocorre em fases. Na fase estabelecida, qual alteração hematológica é esperada?","a":["Hemácias macrocíticas e hipercrômicas.","Hemácias microcíticas e hipocrômicas, com redução da hemoglobina.","Aumento da hemoglobina e do hematócrito.","Aumento obrigatório dos reticulócitos.","Aumento da ferritina sérica."],"c":1,"x":"A anemia ferropriva estabelecida costuma apresentar microcitose e hipocromia."},{"t":"C","e":"Uma criança apresenta palidez, fadiga e dificuldade de concentração. O hemograma mostra hemoglobina reduzida, VCM baixo, HCM baixa e RDW aumentado. Qual diagnóstico é mais compatível?","a":["Anemia ferropriva.","Anemia macrocítica por deficiência de B12.","Policitemia.","Anemia aplásica obrigatoriamente.","Anemia hemolítica autoimune."],"c":0,"x":"Hemoglobina baixa, VCM e HCM reduzidos e RDW aumentado são compatíveis com anemia ferropriva."},{"t":"M","e":"Qual é a função da hepcidina na homeostase do ferro?","a":["Aumentar a liberação de ferro pela ferroportina.","Ligar-se à ferroportina, provocando sua internalização e degradação, reduzindo a disponibilidade de ferro.","Estimular diretamente a produção de hemoglobina.","Aumentar a absorção intestinal de ferro em qualquer situação.","Promover a excreção renal ativa de ferro."],"c":1,"x":"A hepcidina promove a internalização e degradação da ferroportina, reduzindo a disponibilidade de ferro."},{"t":"C","e":"Uma criança apresenta microcitose importante, mas ferritina normal e contagem de hemácias relativamente elevada. O índice de Mentzer é inferior a 13. Qual diagnóstico diferencial deve ser considerado?","a":["Anemia ferropriva como diagnóstico confirmado.","Talassemia.","Anemia megaloblástica.","Anemia aplásica.","Anemia por deficiência de folato."],"c":1,"x":"Índice de Mentzer abaixo de 13 favorece talassemia, embora não confirme o diagnóstico."},{"t":"M","e":"Qual é o principal local de absorção intestinal do ferro?","a":["Estômago e cólon.","Duodeno e porção proximal do jejuno.","Íleo terminal exclusivamente.","Cólon ascendente.","Reto."],"c":1,"x":"A absorção ocorre principalmente no duodeno e jejuno proximal."},{"t":"C","e":"Uma criança com deficiência de ferro apresenta desejo persistente de mastigar gelo. Qual é o nome dessa manifestação?","a":["Geofagia.","Pagofagia.","Disgeusia.","Anorexia.","Esteatorreia."],"c":1,"x":"Pagofagia é o desejo de mastigar ou ingerir gelo."},{"t":"M","e":"Qual é a dose terapêutica pediátrica de ferro elementar frequentemente utilizada no tratamento da deficiência de ferro, conforme o material?","a":["0,1–0,5 mg/kg/dia.","1 mg/kg/dia obrigatoriamente.","3–6 mg/kg/dia.","10–15 mg/kg/dia.","20 mg/kg/dia."],"c":2,"x":"A dose terapêutica pediátrica frequentemente utilizada é de 3–6 mg/kg/dia de ferro elementar."},{"t":"C","e":"Uma criança apresenta anemia ferropriva e inicia tratamento com ferro oral. Após normalização da hemoglobina, a família pergunta se deve interromper imediatamente o medicamento. Qual orientação corresponde ao material?","a":["Interromper assim que a hemoglobina normalizar.","Manter o tratamento por aproximadamente três meses após a normalização da hemoglobina, para reposição dos estoques.","Manter por apenas mais dois dias.","Substituir o ferro por antibiótico.","Suspender a medicação e não realizar acompanhamento laboratorial."],"c":1,"x":"A reposição deve continuar aproximadamente três meses após a normalização da hemoglobina."},{"t":"M","e":"Qual é a importância de coletar mais de uma amostra de fezes na investigação de parasitoses?","a":["Os parasitas são eliminados continuamente em todas as infecções.","A eliminação de cistos e ovos pode ser intermitente, e amostras em dias diferentes aumentam a possibilidade de identificação.","Uma amostra é suficiente em todos os casos.","A coleta seriada serve apenas para avaliar anemia.","A segunda amostra substitui a necessidade de avaliação clínica."],"c":1,"x":"A eliminação intermitente de cistos e ovos justifica a coleta de amostras em dias diferentes."},{"t":"M","e":"Qual medicamento é um nitroimidazólico utilizado no tratamento da giardíase?","a":["Albendazol.","Metronidazol.","Hidroxiureia.","Eltrombopague.","Ciclosporina."],"c":1,"x":"Metronidazol é um nitroimidazólico utilizado no tratamento da giardíase."},{"t":"C","e":"Uma criança apresenta parasitose intestinal recorrente em contexto de saneamento inadequado e consumo de água não tratada. Além do tratamento medicamentoso, qual medida é fundamental para reduzir reinfecções?","a":["Restringir permanentemente a ingestão de alimentos.","Saneamento básico, água potável e medidas de higiene.","Utilizar antibióticos continuamente.","Evitar vacinação.","Suspender a alimentação rica em ferro."],"c":1,"x":"Saneamento, água potável e higiene são fundamentais para prevenir reinfecções."}]},{"id":"B4","title":"Anemia Falciforme","qs":[{"t":"M","e":"A anemia falciforme é causada por uma alteração genética que provoca:","a":["Substituição da valina por ácido glutâmico na cadeia alfa da hemoglobina.","Substituição do ácido glutâmico por valina na sexta posição da cadeia beta da hemoglobina, formando HbS.","Ausência completa de produção de hemoglobina.","Deficiência de ferro na cadeia beta.","Produção excessiva de hemoglobina fetal como alteração primária."],"c":1,"x":"A HbS resulta da substituição do ácido glutâmico por valina na sexta posição da cadeia beta."},{"t":"C","e":"Um paciente com anemia falciforme apresenta crise dolorosa após episódio de desidratação. Qual mecanismo explica a ocorrência da vaso-oclusão?","a":["A HbS desoxigenada polimeriza, deformando as hemácias e favorecendo obstrução da microcirculação.","A hemoglobina normal aumenta a flexibilidade das hemácias.","A desidratação impede a polimerização da HbS.","A hemólise aumenta a produção de óxido nítrico e dilata os vasos.","A vaso-oclusão ocorre exclusivamente por trombos de fibrina."],"c":0,"x":"A HbS desoxigenada polimeriza, deformando as hemácias e favorecendo a vaso-oclusão."},{"t":"M","e":"Quais são os dois mecanismos fisiopatológicos principais da doença falciforme?","a":["Hemólise crônica e vaso-oclusão.","Deficiência de ferro e hemorragia crônica.","Hipoprodução plaquetária e leucocitose.","Hiperviscosidade por aumento de hemoglobina normal e vasodilatação.","Aplasia medular e deficiência de vitamina B12."],"c":0,"x":"Os mecanismos centrais são hemólise crônica e vaso-oclusão."},{"t":"C","e":"Um lactente com doença falciforme apresenta edema doloroso das mãos e dos pés. Qual manifestação clínica está sendo descrita?","a":["Priapismo.","Dactilite.","Osteonecrose.","Sequestro esplênico.","Síndrome torácica aguda."],"c":1,"x":"Dactilite é o edema doloroso de mãos e pés, frequente em lactentes."},{"t":"M","e":"A hemólise crônica na anemia falciforme pode provocar:","a":["Redução da bilirrubina indireta e ausência de reticulocitose.","Anemia hemolítica, reticulocitose, aumento da bilirrubina indireta e icterícia.","Aumento da haptoglobina obrigatoriamente.","Policitemia e redução da bilirrubina.","Trombocitopenia isolada."],"c":1,"x":"A hemólise provoca anemia, reticulocitose, aumento da bilirrubina indireta e icterícia."},{"t":"C","e":"Um paciente com doença falciforme apresenta febre e dor torácica, com hipoxemia e sintomas respiratórios. Qual complicação aguda deve ser considerada?","a":["Síndrome torácica aguda.","Anemia ferropriva.","Crise de ausência.","Síndrome nefrótica.","Hipotireoidismo."],"c":0,"x":"Febre, dor torácica e hipoxemia em paciente falciforme levantam suspeita de síndrome torácica aguda."},{"t":"M","e":"Qual exame é utilizado para identificar e quantificar as diferentes frações de hemoglobina, auxiliando na diferenciação entre HbSS, HbSC, HbS/β-talassemia e HbAS?","a":["Coagulograma.","Eletroforese de hemoglobina ou HPLC.","Dosagem isolada de ferritina.","Teste de Coombs direto.","Hemocultura."],"c":1,"x":"Eletroforese de hemoglobina ou HPLC identifica e quantifica as frações de hemoglobina."},{"t":"C","e":"Um paciente apresenta hemácias falcizadas no esfregaço periférico. Qual afirmação está correta?","a":["O esfregaço isoladamente confirma definitivamente o genótipo.","A confirmação depende da identificação e caracterização das hemoglobinas por eletroforese ou HPLC.","A eletroforese é desnecessária em todos os casos.","O esfregaço diferencia sozinho HbSS de HbAS.","O achado exclui a possibilidade de deficiência de ferro associada."],"c":1,"x":"O esfregaço pode mostrar hemácias falcizadas, mas a confirmação exige caracterização das hemoglobinas."},{"t":"M","e":"Quando ambos os pais apresentam traço falciforme (HbAS), qual é a probabilidade de cada gestação resultar em uma criança com HbSS?","a":["0%.","10%.","25%.","50%.","75%."],"c":2,"x":"Quando ambos os pais são HbAS, cada gestação tem 25% de probabilidade de HbSS."},{"t":"C","e":"Uma criança com doença falciforme apresenta risco aumentado de infecções pneumocócicas devido à perda progressiva da função esplênica. Qual medida preventiva é descrita no material?","a":["Suspender as vacinas pneumocócicas.","Profilaxia com penicilina na infância e vacinação adequada.","Utilizar antibiótico apenas após ocorrência de sepse.","Evitar acompanhamento pediátrico.","Realizar transfusão mensal obrigatória em todas as crianças."],"c":1,"x":"A profilaxia com penicilina na infância e a vacinação reduzem o risco de infecções graves."},{"t":"M","e":"Qual é o principal mecanismo de ação da hidroxiureia na doença falciforme?","a":["Reduzir a produção de hemoglobina fetal.","Aumentar a produção de hemoglobina fetal, reduzindo a polimerização da HbS.","Aumentar a destruição das hemácias falcizadas.","Impedir a absorção intestinal de ferro.","Estimular a produção de anticorpos contra HbS."],"c":1,"x":"A hidroxiureia aumenta a HbF, reduzindo a polimerização da HbS."},{"t":"C","e":"Um paciente com doença falciforme apresenta dor intensa compatível com crise vaso-oclusiva. Qual abordagem terapêutica é adequada?","a":["Aguardar a resolução espontânea antes de administrar analgesia.","Iniciar analgesia precocemente, individualizada pela intensidade da dor, e corrigir desidratação sem excesso de líquidos.","Administrar líquidos em grandes volumes obrigatoriamente.","Utilizar antibióticos em todos os casos, independentemente de infecção.","Realizar transfusão de troca em toda crise dolorosa."],"c":1,"x":"A crise dolorosa exige analgesia precoce e hidratação cuidadosa, evitando excesso de líquidos."},{"t":"M","e":"Qual exame é utilizado no rastreamento de risco de AVC em crianças com doença falciforme, nas faixas etárias e genótipos indicados?","a":["Doppler transcraniano.","Eletrocardiograma.","Radiografia de crânio.","Ultrassonografia abdominal.","Eletroencefalograma."],"c":0,"x":"O Doppler transcraniano é utilizado no rastreamento de risco de AVC em crianças elegíveis."},{"t":"C","e":"Um paciente com doença falciforme apresenta AVC agudo. Qual tratamento transfusional pode ser necessário para reduzir rapidamente a proporção de HbS?","a":["Transfusão exclusiva de plaquetas.","Transfusão de troca urgente, quando indicada.","Transfusão de plasma fresco congelado.","Administração isolada de albumina.","Transfusão de crioprecipitado."],"c":1,"x":"A transfusão de troca pode reduzir rapidamente a proporção de HbS no AVC agudo."},{"t":"M","e":"Qual alternativa representa uma complicação crônica possível da doença falciforme?","a":["Hipostenúria e doença renal crônica.","Aumento permanente da função esplênica.","Ausência de lesões osteoarticulares.","Redução obrigatória da bilirrubina.","Proteção contra infecções invasivas."],"c":0,"x":"A doença pode provocar hipostenúria, hematúria, albuminúria e doença renal crônica."}]},{"id":"B5","title":"Anemia Aplásica, Síndromes Mono-like e Neutropenia Febril","qs":[{"t":"M","e":"A anemia aplásica é caracterizada por:","a":["Aumento da produção de todas as linhagens sanguíneas.","Falência da medula óssea, com redução da produção de células sanguíneas e substituição do tecido hematopoiético por gordura.","Destruição isolada de hemácias no baço.","Aumento da celularidade medular com excesso de blastos em todos os casos.","Deficiência isolada de ferro."],"c":1,"x":"A anemia aplásica é uma falência medular com pancitopenia e substituição do tecido hematopoiético por gordura."},{"t":"M","e":"Qual mecanismo está frequentemente relacionado à anemia aplásica adquirida?","a":["Destruição imunomediada das células-tronco hematopoiéticas por linfócitos T citotóxicos.","Aumento da produção de eritropoietina.","Ativação exclusiva de plaquetas.","Aumento da absorção intestinal de ferro.","Produção excessiva de hemoglobina fetal."],"c":0,"x":"A forma adquirida frequentemente envolve ataque imunomediado dos linfócitos T às células-tronco hematopoiéticas."},{"t":"C","e":"Um paciente apresenta fadiga intensa, palidez, petéquias, epistaxe e infecções recorrentes. O hemograma demonstra anemia, neutropenia e trombocitopenia. Qual síndrome hematológica deve ser investigada?","a":["Anemia ferropriva isolada.","Anemia aplásica.","Policitemia vera.","Talassemia menor.","Anemia por deficiência isolada de folato."],"c":1,"x":"A associação de anemia, neutropenia e trombocitopenia sugere pancitopenia e exige investigação de falência medular."},{"t":"M","e":"Qual achado é característico da anemia aplásica na avaliação da medula óssea?","a":["Hipercelularidade com proliferação intensa de blastos.","Hipocelularidade acentuada e substituição do tecido hematopoiético por gordura.","Fibrose obrigatória em todos os casos.","Infiltração por células tumorais obrigatória.","Aumento isolado da série eritroide."],"c":1,"x":"A biópsia demonstra hipocelularidade e lipossubstituição da medula."},{"t":"C","e":"Um paciente apresenta pancitopenia e suspeita de anemia aplásica. O aspirado de medula óssea fornece pouca amostra, caracterizando um possível “dry tap”. Qual exame é fundamental para avaliar a celularidade global e a arquitetura da medula?","a":["Hemograma.","Biópsia de medula óssea.","Eletrocardiograma.","Radiografia de tórax.","Dosagem de ferritina."],"c":1,"x":"A biópsia avalia a celularidade global e a arquitetura medular, sendo essencial na suspeita de anemia aplásica."},{"t":"M","e":"Qual é a principal diferença entre aspirado e biópsia de medula óssea?","a":["O aspirado avalia a arquitetura global; a biópsia avalia apenas células isoladas.","O aspirado avalia principalmente morfologia e proporção das células; a biópsia avalia arquitetura e celularidade global.","Ambos avaliam exclusivamente a quantidade de ferro.","A biópsia não permite avaliar hipocelularidade.","O aspirado é utilizado exclusivamente para avaliar plaquetas."],"c":1,"x":"O aspirado avalia morfologia e proporção celular; a biópsia avalia arquitetura e celularidade."},{"t":"C","e":"Um paciente com suspeita de anemia aplásica apresenta pancitopenia. A equipe solicita investigação de hemoglobinúria paroxística noturna (HPN). Qual exame é utilizado para pesquisar clones de HPN?","a":["Citometria de fluxo.","Eletrocardiograma.","Teste ergométrico.","Radiografia de tórax.","Ultrassonografia abdominal."],"c":0,"x":"A citometria de fluxo pesquisa clones de HPN."},{"t":"M","e":"Qual das alternativas representa uma causa hereditária de falência medular?","a":["Anemia de Fanconi.","Deficiência de ferro alimentar.","Giardíase.","Anemia por doença crônica.","Hemorragia aguda."],"c":0,"x":"A anemia de Fanconi é uma síndrome hereditária de falência medular."},{"t":"C","e":"Um paciente jovem apresenta anemia aplásica grave. Considerando o tratamento descrito no material, qual estratégia pode ser potencialmente curativa em pacientes selecionados com doador HLA compatível?","a":["Ferro oral.","Transplante alogênico de células-tronco hematopoiéticas.","Metronidazol.","Transfusão isolada de plaquetas.","Corticoide em monoterapia para todos os pacientes."],"c":1,"x":"O transplante alogênico de células-tronco hematopoiéticas pode ser curativo em pacientes selecionados."},{"t":"M","e":"Qual combinação medicamentosa é utilizada como terapia imunossupressora na anemia aplásica?","a":["Ciclosporina e globulina antitimócito.","Metronidazol e albendazol.","Hidroxiureia e ferro oral.","Penicilina e ácido fólico.","Sertralina e diazepam."],"c":0,"x":"A associação de ciclosporina e globulina antitimócito é uma estratégia de imunossupressão."},{"t":"M","e":"Na anemia aplásica, qual complicação pode estar associada à ciclosporina?","a":["Nefrotoxicidade e hipertensão arterial.","Hipoglicemia grave obrigatória.","Hemólise autoimune em todos os pacientes.","Fibrose pulmonar imediata.","Hipotireoidismo permanente."],"c":0,"x":"A ciclosporina pode causar nefrotoxicidade e hipertensão."},{"t":"C","e":"Um paciente com anemia aplásica apresenta febre e neutropenia importante. Qual é a principal preocupação clínica?","a":["Infecção grave com risco de sepse.","Apenas anemia ferropriva.","Hiperviscosidade sanguínea.","Crise hipertensiva isolada.","Hipercalcemia."],"c":0,"x":"A neutropenia aumenta o risco de infecções graves e sepse."},{"t":"M","e":"A neutropenia febril é definida pela associação de febre com:","a":["Neutrófilos acima de 5.000/µL.","Neutrófilos abaixo de 500/µL ou previsão de queda para esse valor nas próximas 48 horas.","Plaquetas abaixo de 100.000/µL.","Hemoglobina abaixo de 7 g/dL.","Linfócitos abaixo de 1.000/µL."],"c":1,"x":"Neutropenia febril envolve febre associada a neutrófilos abaixo de 500/µL ou previsão de queda para esse valor."},{"t":"C","e":"Um paciente apresenta temperatura oral de 38,4 °C em uma medida isolada e contagem absoluta de neutrófilos de 300/µL. Qual é a conduta adequada?","a":["Aguardar 48 horas para confirmar febre.","Considerar neutropenia febril e iniciar avaliação e tratamento urgentes.","Liberar o paciente sem investigação.","Prescrever apenas antitérmico.","Aguardar o resultado das culturas antes de iniciar antibiótico."],"c":1,"x":"Febre de 38,4 °C e neutrófilos de 300/µL caracterizam emergência que exige avaliação e tratamento urgentes."},{"t":"M","e":"Qual é o tempo ideal para início da antibioticoterapia empírica na neutropenia febril?","a":["Após sete dias.","Idealmente na primeira hora após a identificação do quadro.","Apenas após o resultado das hemoculturas.","Após confirmação radiológica de infecção.","Somente quando houver hipotensão."],"c":1,"x":"A antibioticoterapia empírica deve começar idealmente na primeira hora."},{"t":"C","e":"Um paciente de alto risco com neutropenia febril necessita de antibioticoterapia intravenosa empírica. Qual alternativa apresenta uma opção de primeira linha descrita no material?","a":["Cefepima.","Amoxicilina isolada.","Metronidazol isolado.","Penicilina benzatina.","Azitromicina isolada."],"c":0,"x":"Cefepima é uma opção de primeira linha para pacientes de alto risco."},{"t":"M","e":"Em qual situação a vancomicina deve ser considerada na neutropenia febril?","a":["Rotineiramente em todos os pacientes.","Quando há suspeita de infecção relacionada
